<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Est-ce que vous êtes une bonne personne ?</title>
<style>
  :root{
    --violet:#1b0b2e;
    --violet2:#3a0f5c;
    --jaune:#ffd60a;
    --rose:#ff2e88;
    --vert:#00e676;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:
      radial-gradient(circle at 20% 10%, var(--violet2) 0%, transparent 55%),
      radial-gradient(circle at 85% 85%, #5b1a1a 0%, transparent 50%),
      var(--violet);
    color:#fff;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom));
    min-height:100vh;
    min-height:100dvh;
  }
  main{width:100%;max-width:620px;text-align:center}

  h1{
    font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
    font-weight:400;
    font-size:clamp(38px,11vw,78px);
    line-height:.92;
    letter-spacing:-.01em;
    margin:0 0 34px;
    text-transform:uppercase;
    color:var(--jaune);
    text-shadow:3px 3px 0 var(--rose), 6px 6px 0 #000;
    transform:rotate(-1.5deg);
  }

  label{display:block;font-size:15px;color:#d9c6ee;margin-bottom:10px}

  input{
    width:100%;
    font-family:inherit;
    font-size:22px;
    padding:16px 18px;
    border:4px solid #000;
    border-radius:0;
    background:#fff;
    color:#000;
    text-align:center;
    box-shadow:8px 8px 0 rgba(0,0,0,.55);
    outline:none;
  }
  input:focus{border-color:var(--vert);box-shadow:8px 8px 0 var(--vert)}
  input::placeholder{color:#9a9a9a}

  button{
    margin-top:26px;
    width:100%;
    font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
    font-size:clamp(30px,8vw,46px);
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:18px 10px;
    color:#000;
    background:linear-gradient(180deg,#ffe873 0%,var(--jaune) 45%,#e0a800 100%);
    border:5px solid #000;
    box-shadow:0 10px 0 #8a6500, 0 10px 24px rgba(0,0,0,.5);
    cursor:pointer;
    transition:transform .06s, box-shadow .06s;
  }
  button:active{transform:translateY(8px);box-shadow:0 2px 0 #8a6500}
  button:focus-visible{outline:5px solid var(--vert);outline-offset:4px}

  /* ---- Résultat ---- */
  #resultat{margin-top:38px}
  .cadre{
    padding:34px 20px;
    border:10px double #000;
    font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
    line-height:1.02;
    text-transform:uppercase;
    animation:entree .35s cubic-bezier(.2,1.6,.4,1);
  }
  .court{font-size:clamp(44px,15vw,96px)}
  .moyen{font-size:clamp(30px,9vw,54px)}
  .long {font-size:clamp(24px,6.5vw,40px)}

  .nul{
    background:repeating-linear-gradient(45deg,#ff2e88 0 22px,#c00050 22px 44px);
    color:#fff;
    transform:rotate(-4deg);
    box-shadow:14px 14px 0 #000, 0 0 0 8px var(--jaune);
    text-shadow:5px 5px 0 #000;
  }
  .sang{
    background:repeating-linear-gradient(-45deg,#00e676 0 22px,#00a152 22px 44px);
    color:#04210f;
    transform:rotate(2.5deg);
    box-shadow:14px 14px 0 #000, 0 0 0 8px #fff;
    text-shadow:4px 4px 0 #fff;
  }
  .censure{
    background:#000;
    color:#fff;
    transform:rotate(-1deg);
    box-shadow:14px 14px 0 #444, 0 0 0 8px #fff;
    letter-spacing:.06em;
  }
  .censure .sous{color:#bdbdbd}
  .sous{
    display:block;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:15px;
    font-weight:400;
    text-transform:none;
    letter-spacing:.02em;
    margin-top:18px;
    text-shadow:none;
  }
  @keyframes entree{ from{transform:scale(.4) rotate(-20deg);opacity:0} }
  @media (prefers-reduced-motion:reduce){
    .cadre{animation:none}
    button{transition:none}
  }
</style>
</head>
<body>
<main>
  <h1>Est-ce que vous êtes une bonne personne&nbsp;?</h1>

  <label for="nom">Votre nom</label>
  <input id="nom" type="text" autocomplete="off" autocapitalize="words"
         spellcheck="false" placeholder="Tapez ici">

  <button id="btn" type="button">Tester</button>

  <div id="resultat" aria-live="polite"></div>
</main>

<script>
  // ton : "sang" = vert, "nul" = rose
  var VERDICTS = [
    { noms:["hugo","grogo","gogo"], texte:"Tié le sang toi !", ton:"sang" },
    { noms:["arnaud","onow"],       texte:"Va courir Bébou, tu dois faire sub 3h sur marathon. Love", ton:"sang" },
    { noms:["paulin"],              texte:"Envie de te croquer comme une de tes pizzas", ton:"sang" },
    { noms:["maxime"],              texte:"C'est un nom de gros baiseur ça", ton:"sang" },
    { noms:["maxence"],             texte:"Nope", ton:"nul" },
    { noms:["julie"],               texte:"T'es mignon Hugo mais la blague te concerne toi", ton:"sang" },
    { noms:["guillaume"],           texte:"Cheveux longs ou courts, tu restes mon étalon italien", ton:"sang" },
    { noms:["gregoire"],            texte:"GROS PD", ton:"nul" },
    { noms:["solenn"],              texte:"Tié pas mal non plus toi !", ton:"sang" },
    { noms:["berenger"],            texte:"Mon bon gros gaulliste bien gaulé", ton:"sang" },
    { noms:["axel"],                texte:"Chauve qui peut !", ton:"sang" },
    { noms:["nina"],                texte:"[Redacted]", ton:"censure" },
    { noms:["medin"],               texte:"Quel homme !", ton:"sang" },
    { noms:["mathilde"],            texte:"Femme à marier ! Indubitablement", ton:"sang" }
  ];

  var champ   = document.getElementById("nom");
  var sortie  = document.getElementById("resultat");

  function normalise(s){
    return s.trim().toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  }

  function taille(t){
    if (t.length <= 20) return "court";
    if (t.length <= 45) return "moyen";
    return "long";
  }

  function echappe(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function affiche(texte, ton, sousTitre){
    sortie.innerHTML =
      '<div class="cadre ' + ton + ' ' + taille(texte) + '">' +
        echappe(texte) +
        (sousTitre ? '<span class="sous">' + echappe(sousTitre) + '</span>' : '') +
      '</div>';
  }

  function tester(){
    var brut = champ.value;
    if (!brut.trim()){
      affiche("Un nom", "nul", "Il en faut un pour tester. C'est le principe.");
      champ.focus();
      return;
    }
    var cle = normalise(brut);
    for (var i = 0; i < VERDICTS.length; i++){
      if (VERDICTS[i].noms.indexOf(cle) !== -1){
        affiche(VERDICTS[i].texte, VERDICTS[i].ton, "Résultat officiel, contestation impossible.");
        return;
      }
    }
    affiche("Nullos", "nul", "Le test a parlé. Réessayez avec un meilleur nom.");
  }

  document.getElementById("btn").addEventListener("click", tester);
  champ.addEventListener("keydown", function(e){ if (e.key === "Enter") tester(); });
</script>
</body>
</html>
