<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berenger - V2</title>
<style>
:root{--paper:#E9EDF1;--panel:#fff;--ink:#1B2A41;--ink-soft:#425067;--block:#17212E;--accent:#C97A2B;--accent-soft:#F1DCBE;--ok:#3F7D5C;--danger:#B23A32;--muted:#6B7684;--line:rgba(27,42,65,0.15);--cell:38px;}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
.wrap{max-width:1000px;margin:0 auto;padding:24px;}
h1{font-family:Iowan Old Style,"Palatino Linotype",Georgia,serif;font-size:24px;margin:0;}
.ptitle-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px;}
.psound{display:none;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.psound.show{display:inline-flex;}
.psound:hover{filter:brightness(0.97);}
.psound.muted{background:var(--panel);border-color:var(--line);color:var(--muted);}
@media print{.psound{display:none !important;}}
.board{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
.gridwrap{display:flex;flex-direction:column;gap:10px;}
.clue-bar{display:flex;flex-direction:column;gap:6px;padding:8px 10px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;width:100%;box-sizing:border-box;font-size:13.5px;min-height:20px;}
.cb-row{display:none;align-items:flex-start;gap:8px;}
#pRightText,#pDownText{flex:1;min-width:0;font-size:14.5px;line-height:1.35;}
.cb-arrow{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-weight:700;font-size:13px;background:var(--accent);color:#fff;border-radius:5px;padding:3px 8px;flex:none;min-width:16px;text-align:center;}
.cb-empty{font-size:12.5px;color:var(--muted);}
.pgrid{display:grid;gap:2px;background:var(--line);border:2px solid var(--ink);width:max-content;}
.pcell{width:var(--cell);height:var(--cell);position:relative;background:var(--block);}
.pcell.letter{background:var(--panel);}
.pcell.def{background:var(--accent-soft);display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:2px;}
.pcell input{width:100%;height:100%;border:none;background:transparent;text-align:center;font-family:ui-monospace,"SF Mono",Consolas,monospace;font-weight:700;font-size:calc(var(--cell)*0.5);text-transform:uppercase;color:var(--ink);padding:0;}
.pcell input:focus{outline:2px solid var(--accent);outline-offset:-2px;}
.pcell.active-word{background:#DCE6F0;}
.pcell.correct input{color:var(--ok);}
.pcell.incorrect input{background:#FBEAE8;}
.pcell.def .mf-text{max-width:100%;min-width:0;overflow-wrap:break-word;word-break:normal;white-space:pre-wrap;}
.pcell.def .rc,.pcell.def .dc,.pcell.def .bc,.pcell.def .sc{flex:1 1 0;min-height:0;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.08;color:var(--ink);font-weight:600;word-break:normal;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
.pcell.def > *:not(:first-child){border-top:1px dashed rgba(27,42,65,0.28);}
.pclues{flex:1;min-width:240px;display:flex;flex-direction:column;gap:16px;}
.pcol{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;}
.pcol h3{margin:0 0 8px;font-size:13px;color:var(--ink-soft);border-bottom:1px solid var(--line);padding-bottom:6px;font-family:ui-monospace,"SF Mono",Consolas,monospace;}
.pclue{display:flex;gap:8px;padding:4px 0;font-size:13.5px;cursor:pointer;}
.pclue .pw{font-family:ui-monospace,"SF Mono",Consolas,monospace;color:var(--muted);min-width:56px;flex:none;letter-spacing:1px;}
.pclue.active{background:var(--accent-soft);border-radius:4px;}
.pactions{margin-top:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.pbtn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);}
.pbtn:hover{border-color:var(--ink-soft);}
.pbtn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.pstatus{font-size:12.5px;color:var(--muted);}
.psignature{margin-top:28px;text-align:center;font-size:11.5px;color:var(--muted);font-style:italic;}
.pwin{display:none;margin-top:18px;padding:14px 18px;border-radius:8px;background:#E4F0E9;border:1px solid var(--ok);flex-direction:column;gap:2px;}
.pwin.show{display:flex;animation:pwin-pop 0.45s ease-out;}
.pwin-title{font-size:17px;font-weight:700;color:var(--ok);}
.pwin-sub{font-size:13px;color:var(--ink-soft);}
@keyframes pwin-pop{0%{opacity:0;transform:scale(0.94);}100%{opacity:1;transform:scale(1);}}
.pmodal-overlay{position:fixed;inset:0;background:rgba(23,33,46,0.55);display:none;align-items:center;justify-content:center;z-index:50;}
.pmodal-overlay.show{display:flex;}
.pmodal{background:var(--panel);border-radius:8px;padding:20px 22px;max-width:320px;box-shadow:0 12px 32px rgba(0,0,0,0.25);}
.pmodal p{margin:0 0 16px;font-size:14px;color:var(--ink);}
.pmodal-row{display:flex;justify-content:flex-end;gap:8px;}
@media print{.pactions{display:none;}}
@media (max-width:720px){.board{flex-direction:column;}}
</style></head><body>
<div class="wrap">
<div class="ptitle-row"><h1 id="pTitle"></h1><button id="pSoundBadge" class="psound" type="button"><span id="pSoundIcon">🔊</span><span id="pSoundLabel">Son activé</span></button></div>

</div>

</div>

<div class="pmodal-row">

</div>
</div>

<script>
var data = JSON.parse(document.getElementById("puzzleData").textContent);
document.getElementById("pTitle").textContent = data.title;
document.title = data.title;
var rows = data.rows, cols = data.cols;
function idx(r,c){ return r*cols+c; }
var cellRefs = [];
var dir = "R";
function normalize(ch){ return ch.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase(); }
function wordAt(r,c,d){ var list = d==="R"?data.rightWords:data.downWords; for(var k=0;k<list.length;k++){ var w=list[k]; for(var j=0;j<w.cells.length;j++){ if(w.cells[j][0]===r && w.cells[j][1]===c) return w; } } return null; }
function canDir(r,c,d){ return !!wordAt(r,c,d); }
function fitDefText(el, maxPx, minPx){ var size=maxPx; el.style.fontSize=size+"px"; var guard=0; while((el.scrollHeight > el.clientHeight+0.5 || el.scrollWidth > el.clientWidth+0.5) && size>minPx && guard<80){ size-=0.5; el.style.fontSize=size+"px"; guard++; } }
var gridEl = document.getElementById("pGrid");
var cw = Math.max(34, Math.min(48, Math.floor(Math.min(window.innerWidth-40,620)/cols)));
document.documentElement.style.setProperty("--cell", cw+"px");
gridEl.style.gridTemplateColumns = "repeat(" + cols + ", var(--cell))";
for(var r=0;r<rows;r++){ var row=[]; for(var c=0;c<cols;c++){
  var i = idx(r,c);
  var div = document.createElement("div");
  div.className = "pcell " + data.types[i];
  gridEl.appendChild(div);
  if(data.types[i]==="letter"){
    var inp = document.createElement("input"); inp.setAttribute("autocomplete","off");
    inp.dataset.r=r; inp.dataset.c=c;
    inp.addEventListener("focus", onFocusCell);
    inp.addEventListener("keydown", onKeyCell);
    inp.addEventListener("input", onInputCell);
    div.appendChild(inp);
    row.push(inp);
  } else if(data.types[i]==="def"){
    var hasR = data.rightClue[i] && data.rightClue[i].trim()!=="";
    var hasD = data.downClue[i] && data.downClue[i].trim()!=="";
    var hasB = data.belowClue[i] && data.belowClue[i].trim()!=="";
    var hasS = data.besideClue[i] && data.besideClue[i].trim()!=="";
    var maxPx = cw*0.32, minPx = 3.8;
    var slots = [];
    function addBand(kind, text){ var band=document.createElement("span"); band.className=kind; var inner=document.createElement("span"); inner.className="mf-text"; inner.textContent=text; band.appendChild(inner); div.appendChild(band); return band; }
    if(hasR) slots.push(addBand("rc", data.rightClue[i]+" \u2192"));
    if(hasS) slots.push(addBand("sc", data.besideClue[i]+" \u2935"));
    if(hasD) slots.push(addBand("dc", data.downClue[i]+" \u2193"));
    if(hasB) slots.push(addBand("bc", data.belowClue[i]+" \u21B3"));
    slots.forEach(function(el){ fitDefText(el, maxPx, minPx); });
    var titleParts=[]; if(hasR) titleParts.push("\u2192 "+data.rightClue[i]); if(hasS) titleParts.push("\u2935 "+data.besideClue[i]); if(hasD) titleParts.push("\u2193 "+data.downClue[i]); if(hasB) titleParts.push("\u21B3 "+data.belowClue[i]);
    if(titleParts.length) div.title = titleParts.join("  |  ");
    row.push(null);
  } else { row.push(null); }
} cellRefs.push(row); }
function clearHighlight(){ document.querySelectorAll(".pcell.active-word").forEach(function(el){el.classList.remove("active-word");}); document.querySelectorAll(".pclue.active").forEach(function(el){el.classList.remove("active");}); }
function highlight(r,c){ clearHighlight(); var w = wordAt(r,c,dir); if(!w) return; w.cells.forEach(function(cc){ var el=cellRefs[cc[0]][cc[1]]; if(el) el.parentElement.classList.add("active-word"); }); var sel = document.querySelector('[data-key="' + dir + "_" + w.cells[0][0] + "_" + w.cells[0][1] + '"]'); if(sel) sel.classList.add("active"); }
function updateClueBar(r,c){
  var rw = wordAt(r,c,"R"), dw = wordAt(r,c,"D");
  var rowR=document.getElementById("pRowRight"), rowD=document.getElementById("pRowDown"), emptyMsg=document.getElementById("pEmptyMsg");
  rowR.style.display = rw ? "flex" : "none";
  rowD.style.display = dw ? "flex" : "none";
  if(rw) document.getElementById("pRightText").textContent = (rw.field==="belowClue"?"\u21B3 ":"") + (rw.clue || "(pas de définition)");
  if(dw) document.getElementById("pDownText").textContent = (dw.field==="besideClue"?"\u2935 ":"") + (dw.clue || "(pas de définition)");
  emptyMsg.style.display = (!rw && !dw) ? "block" : "none";
}
function onFocusCell(e){ var r=+e.target.dataset.r, c=+e.target.dataset.c; if(!canDir(r,c,dir)){ dir = dir==="R"?"D":"R"; } highlight(r,c); updateClueBar(r,c); }
function moveTo(r,c){ if(r<0||c<0||r>=rows||c>=cols) return; var el = cellRefs[r][c]; if(el){ el.focus(); } }
function skipMove(r,c,dr,dc){ var nr=r+dr, nc=c+dc; while(nr>=0&&nc>=0&&nr<rows&&nc<cols&&data.types[idx(nr,nc)]!=="letter"){ nr+=dr; nc+=dc; } moveTo(nr,nc); }
function onKeyCell(e){
  var r=+e.target.dataset.r, c=+e.target.dataset.c;
  if(e.key==="ArrowLeft"){ e.preventDefault(); skipMove(r,c,0,-1); return; }
  if(e.key==="ArrowRight"){ e.preventDefault(); skipMove(r,c,0,1); return; }
  if(e.key==="ArrowUp"){ e.preventDefault(); skipMove(r,c,-1,0); return; }
  if(e.key==="ArrowDown"){ e.preventDefault(); skipMove(r,c,1,0); return; }
  if(e.key===" "){ e.preventDefault(); if(canDir(r,c, dir==="R"?"D":"R")){ dir = dir==="R"?"D":"R"; highlight(r,c); updateClueBar(r,c);} return; }
  if(e.key==="Backspace" && !e.target.value){ e.preventDefault(); var dr=dir==="R"?0:-1, dc=dir==="R"?-1:0; var nr=r+dr, nc=c+dc; if(nr>=0&&nc>=0&&nr<rows&&nc<cols&&data.types[idx(nr,nc)]==="letter"){ cellRefs[nr][nc].value=""; moveTo(nr,nc);} }
}
function onInputCell(e){
  var r=+e.target.dataset.r, c=+e.target.dataset.c;
  var v = e.target.value; if(v){ v = normalize(v).slice(-1); e.target.value = v; }
  e.target.parentElement.classList.remove("correct","incorrect");
  var dr=dir==="R"?0:1, dc=dir==="R"?1:0; var nr=r+dr, nc=c+dc;
  if(v){ if(nr<rows && nc<cols && data.types[idx(nr,nc)]==="letter"){ moveTo(nr,nc); } }
  checkCompletion();
}
var solvedAlready = false, solutionRevealed = false;
var winAudio = data.audioData ? new Audio(data.audioData) : null;
var soundMuted = false;
(function initSoundBadge(){
  var badge = document.getElementById("pSoundBadge");
  if(!winAudio){ return; }  // no badge at all when the grid ships without a sound
  badge.classList.add("show");
  badge.title = "Couper ou remettre le son de fin";
  badge.addEventListener("click", function(){
    soundMuted = !soundMuted;
    badge.classList.toggle("muted", soundMuted);
    document.getElementById("pSoundIcon").textContent = soundMuted ? "\uD83D\uDD07" : "\uD83D\uDD0A";
    document.getElementById("pSoundLabel").textContent = soundMuted ? "Son coupé" : "Son activé";
    if(soundMuted && winAudio){ winAudio.pause(); winAudio.currentTime = 0; }
  });
})();
function isGridComplete(){
  for(var r=0;r<rows;r++){ for(var c=0;c<cols;c++){
    if(data.types[idx(r,c)]!=="letter") continue;
    var el = cellRefs[r][c];
    if(!el.value || normalize(el.value) !== data.solution[idx(r,c)]) return false;
  } }
  return true;
}
function checkCompletion(){
  if(solvedAlready || solutionRevealed) return;
  if(!isGridComplete()) return;
  solvedAlready = true;
  document.getElementById("pWin").classList.add("show");
  document.getElementById("pStatus").textContent = "";
  if(winAudio && !soundMuted){ winAudio.currentTime = 0; winAudio.play().catch(function(){}); }
}
function renderClues(){
  var rEl = document.getElementById("pRight"), dEl = document.getElementById("pDown");
  data.rightWords.forEach(function(w){ rEl.appendChild(clueRow(w,"R")); });
  data.downWords.forEach(function(w){ dEl.appendChild(clueRow(w,"D")); });
}
function clueRow(w,d){ var row=document.createElement("div"); row.className="pclue"; row.dataset.key=d+"_"+w.cells[0][0]+"_"+w.cells[0][1]; var n=document.createElement("span"); n.className="pw"; n.textContent = "("+w.cells.length+")"; var t=document.createElement("span"); var marker = w.field==="belowClue" ? "\u21B3 " : (w.field==="besideClue" ? "\u2935 " : ""); t.textContent = marker + (w.clue || "(pas de définition)"); row.appendChild(n); row.appendChild(t); row.addEventListener("click", function(){ dir=d; moveTo(w.cells[0][0], w.cells[0][1]); }); return row; }
renderClues();
document.getElementById("pVerify").addEventListener("click", function(){
  var total=0, correct=0;
  for(var r=0;r<rows;r++){ for(var c=0;c<cols;c++){ if(data.types[idx(r,c)]!=="letter") continue; total++; var el=cellRefs[r][c]; var sol=data.solution[idx(r,c)]; el.parentElement.classList.remove("correct","incorrect"); if(!el.value) continue; if(normalize(el.value)===sol){ el.parentElement.classList.add("correct"); correct++; } else { el.parentElement.classList.add("incorrect"); } } }
  document.getElementById("pStatus").textContent = correct + " / " + total + " cases correctes";
  checkCompletion();
});
document.getElementById("pSolve").addEventListener("click", function(){
  var overlay = document.getElementById("pModalOverlay");
  overlay.classList.add("show");
  function cleanup(){ overlay.classList.remove("show"); confirmBtn.removeEventListener("click", onConfirm); cancelBtn.removeEventListener("click", onCancel); }
  var confirmBtn = document.getElementById("pModalConfirm");
  var cancelBtn = document.getElementById("pModalCancel");
  function onConfirm(){
    cleanup();
    solutionRevealed = true;
    for(var r=0;r<rows;r++){ for(var c=0;c<cols;c++){ if(data.types[idx(r,c)]!=="letter") continue; var el=cellRefs[r][c]; el.value = data.solution[idx(r,c)]; el.disabled = true; el.parentElement.classList.remove("incorrect"); el.parentElement.classList.add("correct"); } }
    document.getElementById("pStatus").textContent = "Solution affichée";
  }
  function onCancel(){ cleanup(); }
  confirmBtn.addEventListener("click", onConfirm);
  cancelBtn.addEventListener("click", onCancel);
});
document.getElementById("pReset").addEventListener("click", function(){
  for(var r=0;r<rows;r++){ for(var c=0;c<cols;c++){ if(data.types[idx(r,c)]!=="letter") continue; var el=cellRefs[r][c]; el.value=""; el.disabled=false; el.parentElement.classList.remove("correct","incorrect"); } }
  document.getElementById("pStatus").textContent = "";
  solvedAlready = false; solutionRevealed = false;
  document.getElementById("pWin").classList.remove("show");
  if(winAudio){ winAudio.pause(); winAudio.currentTime = 0; }
});
</script>
