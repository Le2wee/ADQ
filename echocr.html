<style>
:root{
  --paper:#E6ECE3; --panel:#F6F8F2; --panel-line:#C6D0BE;
  --ink:#16211C; --ink-soft:#4C574C;
  --accent:#2F5D46; --accent-soft:#DCE6D6;
  --data:#2B4A6F; --warn:#9A2B2B; --warn-soft:#F1DCDA;
  --amber:#AD7C2C; --amber-soft:#F0E3C6;
  --brand-pink:#B14474; --brand-pink-soft:#F3DCE6;
  --radius:10px;
  --font-display:'IBM Plex Sans Condensed',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
body{padding:26px 18px 60px;}
:focus-visible{outline:2px solid var(--brand-pink);outline-offset:2px;border-radius:4px;}
.app{max-width:1280px;margin:0 auto;}

.topbar{margin-bottom:16px;}
.brandrow{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.brandrow img{height:30px;width:auto;display:block;}
.brandrow .brandline{height:2px;flex:1;background:linear-gradient(90deg,var(--brand-pink),transparent);border-radius:2px;}
h1{font-family:var(--font-display);font-size:23px;font-weight:700;margin:0;letter-spacing:-.01em;}
.sub{font-size:12.5px;color:var(--ink-soft);margin:2px 0 0;font-style:italic;}

.espece-bar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--panel-line);
  border-radius:var(--radius);padding:11px 14px;margin-bottom:16px;flex-wrap:wrap;}
.espece-bar .lab{font-family:var(--font-display);font-weight:700;font-size:12px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--accent);}

/* Dossier patient : sauvegarde et rechargement. */
.dossier-bar{display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--panel-line);border-radius:var(--radius);padding:10px 14px;
  margin-bottom:10px;flex-wrap:wrap;}
.dossier-bar .lab{font-family:var(--font-display);font-weight:700;font-size:12px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--accent);}
.dossier-bar #dossierZone{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.dossier-avis{margin:0 0 14px;padding:8px 12px;border-radius:0 6px 6px 0;font-size:12px;}
.dossier-avis.ok{background:var(--accent-soft);border-left:3px solid var(--accent);color:var(--accent);}
.dossier-avis.ko{background:var(--warn-soft);border-left:3px solid var(--warn);color:var(--warn);}
.modale{position:fixed;inset:0;background:rgba(22,33,28,.45);display:flex;
  align-items:center;justify-content:center;z-index:50;padding:20px;}
.modale-boite{background:var(--surface,#fff);border:1px solid var(--panel-line);
  border-radius:var(--radius);padding:18px 20px;max-width:460px;width:100%;
  max-height:80vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25);}
.modale-boite h3{font-family:var(--font-display);font-size:14px;margin:0 0 10px;color:var(--accent);}
.modale-boite .ligne{margin-bottom:9px;}
.modale-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
.liste-dossier{list-style:none;padding:0;margin:8px 0 0;}
.liste-dossier li{margin-bottom:5px;}
.liste-dossier button{width:100%;text-align:left;}
@media print{ .dossier-bar, .dossier-avis, .modale{display:none !important;} }

/* Série d'examen : même bandeau que l'espèce, posé au-dessus des organes. */
.serie-bar{display:flex;align-items:center;gap:8px;background:var(--accent-soft);
  border:1px solid var(--accent);border-radius:var(--radius);padding:10px 14px;
  margin-bottom:10px;flex-wrap:wrap;}
.serie-bar .lab{font-family:var(--font-display);font-weight:700;font-size:12px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--accent);}
.serie-bar #serieZone{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.serie-bar .check{margin-left:6px;}
.serie-avis{margin:0 0 16px;padding:8px 12px;background:var(--warn-soft);
  border-left:3px solid var(--warn);border-radius:0 6px 6px 0;
  font-size:12px;color:var(--warn);}
@media print{ .serie-bar, .serie-avis{display:none;} }

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
@media (max-width:900px){ .grid2{grid-template-columns:1fr;} }

.rein{background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--radius);padding:14px 15px;}
.rein-titre{font-family:var(--font-display);font-weight:700;font-size:14px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--accent);padding-bottom:8px;margin-bottom:11px;
  border-bottom:2px solid var(--panel-line);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.rein-D .rein-titre{color:var(--data);}

.bloc{margin-bottom:13px;}
.bloc-t{font-family:var(--font-display);font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink-soft);margin-bottom:6px;}

.ligne{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.ligne .nom{font-size:12.5px;min-width:112px;color:var(--ink-soft);}
.ligne .nom.large{min-width:146px;}

input[type=number],input[type=text]{font-family:var(--font-mono);font-size:12.5px;padding:5px 7px;
  border:1px solid var(--panel-line);border-radius:6px;background:#fff;color:var(--ink);width:76px;}
input[type=text]{width:100%;font-family:var(--font-body);}
input:disabled{background:var(--paper);color:var(--ink-soft);}
.unite{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);}

.verdict{font-family:var(--font-mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;
  border:1px solid transparent;white-space:nowrap;}
.v-normal{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.v-bas{background:var(--warn-soft);color:var(--warn);border-color:var(--warn);}
.v-haut{background:var(--amber-soft);color:var(--amber);border-color:var(--amber);}
.v-vide{background:var(--paper);color:var(--ink-soft);border-color:var(--panel-line);font-weight:400;}

.pill{font-family:var(--font-body);font-size:12px;padding:4px 10px;border:1px solid var(--panel-line);
  border-radius:20px;background:#fff;color:var(--ink);cursor:pointer;transition:all .12s;}
.pill:hover{border-color:var(--brand-pink);color:var(--brand-pink);}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
.pill[aria-pressed="true"].ano{background:var(--warn);border-color:var(--warn);}
.pill.mini{font-size:11.5px;padding:3px 9px;}
/* Ajouter / retirer un nœud : discrets, ils n'entrent pas dans la description
   de l'organe, ils ne font que gérer la liste. */
.btn-ajouter{border-style:dashed;color:var(--accent);border-color:var(--accent);}
.btn-ajouter:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.btn-retirer{border-color:var(--panel-line);color:var(--ink-soft);
  font-family:var(--font-mono);line-height:1;padding:3px 8px;margin-left:4px;}
.btn-retirer:hover{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);}
/* Remise à zéro : séparée des deux autres, et en teinte d'alerte au survol —
   elle détruit, elle ne doit pas se cliquer par inadvertance. */
.btn-raz{margin-left:10px;}
.btn-raz:hover{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--panel-line);
  border-radius:7px;overflow:hidden;background:var(--surface);}
.fleche{border:none;background:var(--panel);color:var(--accent);font-family:var(--font-mono);
  font-size:14px;font-weight:600;width:28px;cursor:pointer;transition:all .12s;line-height:1;}
.fleche:hover{background:var(--accent);color:var(--on-accent);}
.val-step{min-width:46px;padding:5px 6px;text-align:center;font-family:var(--font-mono);
  font-size:12.5px;font-weight:600;border-left:1px solid var(--panel-line);
  border-right:1px solid var(--panel-line);display:flex;align-items:center;justify-content:center;}
.val-step.vide{color:var(--ink-soft);font-weight:400;}

.sousbloc{margin:7px 0 4px;padding:9px 11px;background:var(--accent-soft);border-left:3px solid var(--accent);
  border-radius:0 6px 6px 0;}
.sousbloc.warnbox{background:var(--warn-soft);border-left-color:var(--warn);}
.sousbloc .bloc-t{color:var(--accent);margin-bottom:5px;}
.sousbloc.warnbox .bloc-t{color:var(--warn);}

/* Ligne libre : discrète tant qu'elle est vide, affirmée dès qu'elle porte
   du texte — elle part telle quelle dans le compte-rendu. */
.note-libre{margin-top:9px;padding-top:8px;border-top:1px dashed var(--panel-line);}
.note-libre input{width:100%;box-sizing:border-box;font:inherit;font-size:12.5px;
  padding:6px 9px;border:1px solid var(--panel-line);border-radius:6px;
  background:#fff;color:var(--ink);}
.note-libre input::placeholder{color:var(--ink-soft);opacity:.65;font-style:italic;}
.note-libre input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
.note-libre input:not(:placeholder-shown){border-color:var(--accent);
  box-shadow:inset 3px 0 0 var(--accent);}

.aide{font-size:11px;color:var(--ink-soft);font-style:italic;margin:3px 0 7px;line-height:1.4;}

.synthese{margin-top:16px;background:var(--panel);border:1px solid var(--panel-line);
  border-radius:var(--radius);padding:14px 16px;}
.synthese h2{font-family:var(--font-display);font-size:14px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--accent);margin:0 0 9px;padding-bottom:7px;border-bottom:2px solid var(--panel-line);}
.comp{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:10px;}
.comp-item{font-family:var(--font-mono);font-size:11.5px;padding:4px 10px;border-radius:6px;
  background:#fff;border:1px solid var(--panel-line);}
.comp-item.alerte{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600;}
.comp-item.ok{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

.cr{margin-top:16px;background:#fff;border:1px solid var(--panel-line);border-radius:var(--radius);overflow:hidden;}
.cr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;
  background:var(--panel);border-bottom:1px solid var(--panel-line);}
.cr-head h2{font-family:var(--font-display);font-size:13px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--accent);margin:0;}
.btn{font-family:var(--font-body);font-size:12px;padding:5px 13px;border:1px solid var(--accent);
  border-radius:20px;background:var(--accent);color:#fff;cursor:pointer;transition:all .12s;}
.btn:hover{background:var(--ink);border-color:var(--ink);}
.btn.ghost{background:#fff;color:var(--accent);}
.btn.ghost:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
#crTexte{font-family:var(--font-mono);font-size:12px;line-height:1.62;white-space:pre-wrap;
  padding:15px 17px;margin:0;color:var(--ink);}
/* Le compte-rendu se lit en diagonale : la taille et les anomalies ressortent */
#crTexte mark{background:none;color:inherit;padding:1px 3px;border-radius:3px;}
#crTexte mark.m-taille{background:var(--accent-soft);color:var(--accent);font-weight:600;}
#crTexte mark.m-ano{background:var(--warn-soft);color:var(--warn);font-weight:600;}
.cr-vide{color:var(--ink-soft);font-style:italic;}
/* ===================== EN-TÊTE CLINIQUE ET SIGNALEMENT ===================== */
.panneau{margin-bottom:14px;background:var(--panel);border:1px solid var(--panel-line);
  border-radius:var(--radius);overflow:hidden;}
.panneau-tete{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 14px;cursor:pointer;user-select:none;}
.panneau-tete h2{font-family:var(--font-display);font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:0;}
.panneau-tete .resume{font-size:11.5px;color:var(--ink-soft);font-style:italic;
  flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.panneau-tete .chev{font-family:var(--font-mono);color:var(--accent);font-size:12px;}
.panneau-corps{padding:4px 14px 13px;border-top:1px solid var(--panel-line);}
.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px 14px;}
.champ{display:flex;flex-direction:column;gap:3px;}
.champ label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
.champ input,.champ select{font-family:var(--font-body);font-size:12.5px;padding:5px 7px;
  border:1px solid var(--panel-line);border-radius:6px;background:#fff;color:var(--ink);width:100%;}
.champ .calc{font-family:var(--font-mono);font-size:11px;color:var(--accent);}
.logo-zone{display:flex;align-items:center;gap:10px;margin-top:10px;}
.logo-zone img{max-height:52px;max-width:180px;border:1px solid var(--panel-line);
  border-radius:4px;background:#fff;padding:3px;}

/* ===================== DOCUMENT IMPRIMABLE ===================== */
.doc{background:#fff;color:#16211C;padding:26px 30px;font-family:var(--font-body);}
.doc-entete{padding-bottom:10px;border-bottom:2px solid var(--brand-pink);}
.ent-haut{display:flex;align-items:center;justify-content:space-between;gap:20px;}
.ent-nom{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:.02em;
  text-transform:uppercase;color:var(--brand-pink);line-height:1.15;flex:1;}
.ent-nom.vide{font-size:13px;font-style:italic;text-transform:none;color:#4C574C;font-weight:400;}
.ent-logo{max-height:52px;max-width:150px;flex:0 0 auto;}
.ent-bas{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-top:7px;}
.ent-sites{font-size:11.5px;line-height:1.45;flex:1;}
.ent-site{padding:3px 0;}
.ent-site + .ent-site{border-top:1px solid #C6D0BE;}
.ent-site .rue{font-weight:600;}
.ent-divers{color:#4C574C;}
.ent-horaires{font-size:11px;line-height:1.45;text-align:right;color:#4C574C;flex:0 0 auto;}
.ent-h-titre{font-weight:600;color:#16211C;}
.ent-veto{margin-top:4px;font-weight:600;color:#16211C;}
.champ textarea{font-family:var(--font-body);font-size:12.5px;padding:5px 7px;
  border:1px solid var(--panel-line);border-radius:6px;background:#fff;color:var(--ink);
  width:100%;resize:vertical;}
.doc-titre{font-family:var(--font-display);font-size:15px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;text-align:center;margin:16px 0 13px;color:var(--accent);}
.doc-signalement{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px;}
.doc-signalement th,.doc-signalement td{border:1px solid #C6D0BE;padding:4px 8px;text-align:left;
  vertical-align:top;}
.doc-signalement th{background:#F0F4EC;font-weight:600;width:1%;white-space:nowrap;
  font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#4C574C;}
.doc-corps{font-size:12px;line-height:1.5;}
.doc-corps .org{font-family:var(--font-display);font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--accent);margin:0 0 3px;padding-bottom:2px;
  border-bottom:1px solid #C6D0BE;}
/* L'écart entre organes est porté par le conteneur, pas par le titre : le titre
   est désormais le premier enfant de son bloc, « :first-child » l'aurait visé
   partout et aurait collé tous les organes les uns aux autres. */
.doc-corps .bloc-organe{margin-top:11px;}
.doc-corps > .bloc-organe:first-child{margin-top:0;}
.doc-corps p{margin:0 0 1px;}
.doc-corps p.libre{margin:5px 0 2px;}
.doc-corps .bloc-synthese{margin-top:16px;padding:11px 13px;background:#F0F4EC;
  border-left:3px solid var(--accent);border-radius:0 5px 5px 0;}
.doc-corps .bloc-synthese .org{margin-top:0;border:none;padding:0;}
.doc-pied{margin-top:22px;padding-top:10px;border-top:1px solid #C6D0BE;
  display:flex;justify-content:space-between;align-items:flex-end;font-size:11.5px;gap:20px;}
.doc-pied .sign{text-align:right;}
.doc-pied .sign .trait{display:block;margin-top:26px;border-top:1px solid #16211C;
  min-width:170px;padding-top:3px;font-size:10.5px;color:#4C574C;}
.doc mark{padding:1px 3px;margin:0 -1px;border-radius:3px;font-weight:600;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;}
.doc mark.m-ano{background:#F7DDDA;color:#8E2020;}
.doc mark.m-ok{background:#DDE9D8;color:#2A5340;}
.doc-vide{padding:30px;color:var(--ink-soft);font-style:italic;text-align:center;}
/* ---- vignettes de saisie ---- */
.vignettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px;margin-bottom:6px;}
.vignette{border:1px solid var(--panel-line);border-radius:6px;padding:5px;background:var(--surface);}
.vignette img{width:100%;height:84px;object-fit:cover;border-radius:4px;display:block;background:#000;}
.vignette input{font-size:11px;padding:3px 5px;margin-top:4px;width:100%;
  border:1px solid var(--panel-line);border-radius:4px;background:var(--surface);color:var(--ink);}
.vignette-actions{display:flex;gap:3px;margin-top:4px;}
.vignette-actions .btn{font-size:10.5px;padding:2px 6px;flex:0 0 auto;}
.vignette-actions .btn:last-child{flex:1;}

/* ---- annexe d'images, en fin de compte-rendu ---- */
.doc-annexe{margin-top:18px;}
.doc-annexe .annexe-organe{font-family:var(--font-titre);font-size:12px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:#3C5C43;
  margin:13px 0 5px;padding-bottom:2px;border-bottom:1px solid #D7DFD2;
  break-after:avoid;page-break-after:avoid;}
.doc-images{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 6px;}
.doc-images figure{margin:0;break-inside:avoid;page-break-inside:avoid;}
.doc-images img{width:100%;display:block;border:1px solid #C6D0BE;border-radius:4px;background:#000;}
.doc-images figcaption{font-size:12px;font-weight:600;color:#23301F;
  margin-top:4px;line-height:1.35;}
.doc-images figcaption .num{color:#5A7A5E;font-weight:700;margin-right:5px;}


.synth-reglage{padding:10px 14px;border-top:1px solid var(--panel-line);
  display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;}
.synth-reglage textarea{flex:1 1 100%;min-height:76px;font-family:var(--font-body);
  font-size:13px;line-height:1.5;padding:8px 10px;border:1px solid var(--panel-line);
  border-radius:8px;background:var(--surface,#fff);color:var(--ink);resize:vertical;}
.synth-reglage .aide{margin:0;flex:1 1 100%;}

@media print{
  @page{size:A4;margin:14mm 15mm;}
  /* html porte aussi le fond de l'application : sans ça, un compte-rendu
     court laisse le bas de la page rempli de vert-gris. */
  html,body{background:#fff;padding:0;}
  .topbar,.panneau,.espece-bar,.grid2,#enteteZone,#patientZone,#vessieZone,
  #prostateZone,#uterusZone,#testicules,#foieZone2,#vbZone,#surrenales,#rateZone,
  #estomacZone,#intestinsZone,#pancreasZone,#nlZone,#vascZone,
  .synthese,.cr-head,#crTexte,.no-print{display:none !important;}
  .cr{margin:0;border:none;border-radius:0;}
  .doc{padding:0;}
  /* Rien ne se coupe au milieu : un organe, un groupe d'images, la synthèse
     et le pied de page basculent en entier sur la page suivante. */
  .doc-corps .org{break-after:avoid;page-break-after:avoid;}
  .doc-corps .bloc-organe{break-inside:avoid;page-break-inside:avoid;}
  .doc-corps .bloc-synthese{break-inside:avoid;page-break-inside:avoid;}
  .doc-entete{break-inside:avoid;page-break-inside:avoid;break-after:avoid;page-break-after:avoid;}
  .doc-titre{break-after:avoid;page-break-after:avoid;}
  .doc-annexe .org{break-after:avoid;page-break-after:avoid;}
  .doc-annexe .annexe-groupe{break-inside:avoid;page-break-inside:avoid;}
  .doc-annexe .annexe-organe{break-after:avoid;page-break-after:avoid;}
  .doc-signalement{break-inside:avoid;page-break-inside:avoid;}
  .doc-pied{break-inside:avoid;page-break-inside:avoid;}
  /* Un bloc plus haut qu'une page ne doit pas laisser une ligne seule
     en haut ou en bas. */
  .doc-corps p, .bloc-synthese p{orphans:3;widows:3;}
}

<script>
(function(){

// ===================== RÉFÉRENCES =====================
// Chat : longueur absolue. Chien : rapport rein/aorte, l'aorte servant d'étalon
// interne indépendant du format de l'animal.
const REF = {
  chat:  {type:'longueur', min:30,   max:45,   unite:'mm', lib:'longueur'},
  chien: {type:'ratio',    min:5.5,  max:9.2,  unite:'',   lib:'rapport rein/aorte'}
};
const BASSINET = [
  {max:2,   cle:'normal',   lib:'non dilaté'},
  {max:6,   cle:'legere',   lib:'dilatation légère'},
  {max:11,  cle:'moderee',  lib:'dilatation modérée'},
  {max:1e9, cle:'marquee',  lib:'dilatation marquée'}
];
// 0 vaut « moins de 1 mm », 11 vaut « plus de 10 mm »
function libBassinet(v){ return v===0 ? 'moins de 1 mm' : v+' mm'; }

function reinVide(){
  return {
    longueur:null,
    bassinetBase:true,
    // Pré-cochés sur la valeur normale pour accélérer le CR. C'est la LONGUEUR
    // qui dit si le rein a été examiné : on la mesure toujours. Ces trois axes
    // n'entrent donc pas dans ce test, sinon un rein jamais regardé
    // apparaîtrait décrit et normal.
    nonVu:false, nonVuMotif:null,
    contours:'reguliers', echoFoie:'iso', echoRate:'iso', jcm:'conservee',
    bassinet:0, uretere:false, uretereDiam:null, uretereSite:null,
    kystes:false, kystesQte:null, kystesNb:null, kystesTaille:null,
    lithiases:new Set(), lithiaseTaille:null, coneOmbre:null,
    infarctus:false,
    masse:false, masseL:null, masseH:null, masseP:null, masseLoc:null,
    masseEcho:null, masseHomo:null, masseContours:null, masseVasc:null,
    graisse:false, epanchement:false, halo:false
  };
}
const S = { espece:null, aorte:null, foieAnormal:false, D:reinVide(), G:reinVide(),
  vessie:null, prostate:null,
  uterus:null, ovD:null, ovG:null, tsD:null, tsG:null, foie:null, vb:null, srD:null, srG:null, rate:null,
  estomac:null, intestins:null, nl:null, vasc:null, pancreas:null, images:{},
  sexe:null, statut:null, poids:null, age:null, cycle:null,
  // Chez le chat castré la prostate n'est pas explorée en routine : le bloc
  // reste replié tant qu'on ne demande pas à l'ouvrir.
  prostateDepliee:false,
  entete:null, patient:null, ouvert:{entete:false, patient:true}, brut:false,
  // Série d'examen : filtre d'affichage. null = tous les organes.
  // protocoleAuCR : mentionne au pied du CR l'étendue réelle de l'examen.
  serie:null, protocoleAuCR:false, testiculesDeplies:false,
  // Ligne libre par organe : texte dicté, repris tel quel en fin de bloc.
  // Elle suffit à faire exister le bloc au CR, mais ne déclenche jamais les
  // phrases de normalité : l'outil n'a rien constaté, c'est l'opérateur qui parle.
  notes:{},
  // Synthèse : incluse ou non au document, et texte propre s'il a été réécrit.
  // texte null = on reprend la synthèse produite par l'outil.
  synthese:{inclure:true, texte:null} };

// Les lignes du CR sont injectées en innerHTML (surlignages V/M/Q). Un texte
// dicté doit donc être échappé, sinon un « < » disparaît et un chevron mal
// fermé emporte la mise en page du document.
function echapper(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Titre du bloc, nécessaire quand la ligne libre est le SEUL contenu de l'organe.
const TITRE_BLOC = {
  rein_G:'REIN GAUCHE', rein_D:'REIN DROIT', vessie:'VESSIE', prostate:'PROSTATE',
  testicule_G:'TESTICULE GAUCHE', testicule_D:'TESTICULE DROIT',
  uterus:'UTÉRUS', ovaire_G:'OVAIRE GAUCHE', ovaire_D:'OVAIRE DROIT',
  foie:'FOIE', vb:'VÉSICULE BILIAIRE',
  surrenale_G:'SURRÉNALE GAUCHE', surrenale_D:'SURRÉNALE DROITE',
  rate:'RATE', estomac:'ESTOMAC', intestins:'INTESTINS', pancreas:'PANCRÉAS',
  nl:'NŒUDS LYMPHATIQUES', vasc:'VAISSEAUX ET PÉRITOINE'
};
function noteDe(cle){ return (S.notes[cle]||'').trim(); }
// Accroche la ligne libre au bloc de l'organe. Si l'organe n'a rien produit,
// le bloc naît de la seule ligne libre — titre + phrase dictée, rien d'autre :
// surtout pas les phrases de normalité, que personne n'a constatées.
function avecNote(txt, cle){
  const n=noteDe(cle);
  if(!n) return txt;
  if(txt) return txt+'\n'+echapper(n);
  return TITRE_BLOC[cle] ? TITRE_BLOC[cle]+'\n'+echapper(n) : txt;
}

// ============ SÉRIES D'EXAMEN ============
// Un protocole d'échographie ne balaie pas tout l'abdomen : une urogénitale
// n'a que faire de l'estomac. La série filtre l'AFFICHAGE, jamais les données —
// masquer un champ ne doit pas effacer ce qui y a été saisi.
// Clés = celles de TITRE_BLOC et des zones de rendu.
const SERIES = [
  {k:'uro',      l:'Urogénitale',
   organes:['rein_G','rein_D','vessie','surrenale_G','surrenale_D',
            'prostate','testicule_G','testicule_D','uterus','ovaire_G','ovaire_D']},
  {k:'digestif', l:'Digestive',
   organes:['foie','vb','pancreas','estomac','intestins','nl']},
  {k:'urgence',  l:'Épanchement / urgence',
   t:'Recherche d’un épanchement et de sa cause : péritoine, foie, rate, reins, vessie',
   organes:['vasc','foie','rate','rein_G','rein_D','vessie']},
  {k:'senior',   l:'Dépistage sénior',
   organes:['rein_G','rein_D','vessie','foie','rate','surrenale_G','surrenale_D','nl',
            'prostate','testicule_G','testicule_D','uterus','ovaire_G','ovaire_D']}
  // Pas de série « abdomen complet » : elle ferait doublon avec « Tout », qui
  // est l'absence de filtre. Et la déclarer au CR affirmerait un balayage
  // exhaustif que rien ne vérifie.
];
function serieCourante(){ return SERIES.find(s=>s.k===S.serie) || null; }
// Phrase d'étendue, uniquement si l'opérateur l'a demandée. Elle n'affirme
// rien sur les organes non examinés : elle dit simplement qu'ils ne l'ont pas
// été, ce que le silence seul ne permet pas de distinguer d'un organe normal.
function mentionProtocole(){
  if(!S.protocoleAuCR) return null;
  const s=serieCourante();
  if(!s || !s.organes) return null;
  return 'Examen conduit selon un protocole ciblé ('+s.l.toLowerCase()+'). '+
    'Les organes non mentionnés dans ce compte-rendu n’ont pas été explorés.';
}
// Organe affiché ? Hors série choisie, non. Sans série, tout est affiché —
// c'est le comportement d'origine, et le défaut.
function organeDansSerie(cle){
  const s=serieCourante();
  if(!s || !s.organes) return true;
  return s.organes.indexOf(cle)!==-1;
}
// Organes hors série qui portent déjà une saisie : ils restent au compte-rendu,
// donc il faut le dire, sinon la donnée devient invisible sans disparaître.
function organesHorsSerieRemplis(){
  const s=serieCourante();
  if(!s || !s.organes) return [];
  const sondes=[
    ['rein_G',()=>reinExamine('G')||S.G.nonVu], ['rein_D',()=>reinExamine('D')||S.D.nonVu],
    ['vessie',()=>vessieExaminee()||S.vessie.nonVu],
    ['prostate',()=>prostateExaminee()||S.prostate.nonVu],
    ['testicule_G',()=>testiculeSaisi('G')], ['testicule_D',()=>testiculeSaisi('D')],
    ['uterus',()=>uterusSaisi()||S.uterus.nonVu],
    ['ovaire_G',()=>S.ovG.vu], ['ovaire_D',()=>S.ovD.vu],
    ['foie',()=>foieExamine()||S.foie.nonVu], ['vb',()=>vbExaminee()||S.vb.nonVu],
    ['surrenale_G',()=>S.srG.vu], ['surrenale_D',()=>S.srD.vu],
    ['rate',()=>rateExaminee()||S.rate.nonVu],
    ['estomac',()=>estomacExamine()||S.estomac.nonVu],
    ['intestins',()=>intestinsExamines()||S.intestins.nonVu],
    ['pancreas',()=>pancreasSaisi()||S.pancreas.nonVu],
    ['nl',()=>nlSaisis()||S.nl.nonVu], ['vasc',()=>vascExaminee()||S.vasc.nonVu]
  ];
  return sondes.filter(([cle,test])=>{
    if(organeDansSerie(cle)) return false;
    if(noteDe(cle)) return true;
    try{ return !!test(); }catch(e){ return false; }
  }).map(([cle])=>TITRE_BLOC[cle]||cle);
}
// Champ de saisie, posé en pied de chaque bloc d'organe. « input » enregistre
// sans redessiner (la frappe ne doit pas reconstruire le DOM) ; « change »
// déclenche le rendu à la sortie du champ, comme tous les autres champs.
function ligneLibre(box, cle){
  if(!box) return box;
  const d=document.createElement('div'); d.className='note-libre';
  const i=document.createElement('input'); i.type='text';
  i.value = S.notes[cle] || '';
  i.placeholder = 'Ligne libre — reprise telle quelle dans le compte-rendu';
  i.title = 'Texte ajouté en fin de bloc. Il fait apparaître l’organe au CR sans rien conclure à votre place.';
  i.setAttribute('aria-label','Ligne libre — '+(TITRE_BLOC[cle]||cle));
  i.addEventListener('input',()=>{ S.notes[cle]=i.value; });
  i.addEventListener('change',()=>{ S.notes[cle]=i.value; rendre(); });
  d.appendChild(i);
  box.appendChild(d);
  return box;
}

// ===================== CALCULS =====================
// Renvoie {valeur, verdict, texte} ou null si non calculable.
function biometrie(cote){
  const r=S[cote], e=S.espece;
  if(!e || r.nonVu || r.longueur==null) return null;
  const ref=REF[e];
  if(ref.type==='longueur'){
    const v=r.longueur;
    return {valeur:v, aff:v.toFixed(0)+' mm', ref:ref,
      verdict: v<ref.min?'bas':(v>ref.max?'haut':'normal')};
  }
  // chien : sans aorte, on ne peut pas conclure — la longueur seule ne veut rien dire
  if(S.aorte==null || S.aorte<=0) return {valeur:null, aff:nb(r.longueur,0)+' mm', ref:ref, verdict:null};
  const ratio=r.longueur/S.aorte;
  return {valeur:ratio, aff:nb(ratio), ref:ref,
    verdict: ratio<ref.min?'bas':(ratio>ref.max?'haut':'normal')};
}
// Un rein est considéré examiné dès que sa longueur est saisie — on la mesure
// toujours — ou qu'un élément autre que les valeurs par défaut est renseigné.
function reinExamine(cote){
  const r=S[cote];
  if(r.nonVu) return false;
  return r.longueur!=null ||
    !r.bassinetBase || r.uretere || r.kystes || r.lithiases.size || r.infarctus ||
    r.masse || r.graisse || r.epanchement || r.halo;
}
// Vrai dès qu'un élément anormal est saisi sur ce rein. Sert de garde-fou :
// le CR ne doit jamais conclure « sans anomalie » si l'un de ces champs parle.
function anomalieDecrite(cote){
  if(!reinExamine(cote)) return false;
  const r=S[cote], b=biometrie(cote);
  if(b && b.verdict && b.verdict!=='normal') return true;
  if(r.contours && r.contours!=='reguliers') return true;
  if(!S.foieAnormal && r.echoFoie==='hyper' && S.espece!=='chat') return true;
  if(S.foieAnormal && r.echoRate==='hyper') return true;
  if(r.jcm && r.jcm!=='conservee') return true;
  const cb=classeBassinet(r.bassinet);
  if(cb && cb.cle!=='normal') return true;
  if(r.uretere || r.kystes || r.lithiases.size || r.infarctus || r.masse) return true;
  if(r.graisse || r.epanchement || r.halo) return true;
  return false;
}
function classeBassinet(mm){
  if(mm==null) return null;
  return BASSINET.find(b=>mm<b.max) || BASSINET[BASSINET.length-1];
}

// ===================== FABRIQUE D'INTERFACE =====================
// Deux familles de pastilles, à ne pas confondre.
//  – Champ OPTIONNEL (défaut null) : le re-clic désélectionne et rend « non
//    renseigné », qui est une réponse valable.
//  – Champ à DÉFAUT (« conservée », « réguliers », « normale »…) : il vaut
//    toujours quelque chose, l'une des options est forcément vraie. Le laisser
//    retomber à null produisait deux fautes — une structure « non conservée »
//    là où rien n'avait été décoché volontairement, et un « undefined » imprimé
//    au compte-rendu quand le libellé était cherché dans une table. Le re-clic
//    y revient donc au défaut, et jamais à null : impossible de n'avoir aucune
//    option cochée, impossible d'en avoir deux.
function pastilles(parent, opts, lire, ecrire, ano, defaut){
  const aDefaut = defaut!==undefined && defaut!==null;
  opts.forEach(o=>{
    const b=document.createElement('button'); b.type='button';
    b.className='pill mini'+((ano&&ano.includes(o.v))?' ano':'');
    b.setAttribute('aria-pressed', lire()===o.v?'true':'false');
    b.textContent=o.l;
    if(o.t) b.title=o.t;
    b.addEventListener('click',()=>{
      const actuel=lire();
      if(actuel===o.v) ecrire(aDefaut ? defaut : null);
      else ecrire(o.v);
      rendre();
    });
    parent.appendChild(b);
  });
  // Filet de sécurité : si l'état arrive à null malgré tout (donnée restaurée,
  // réinitialisation partielle), on le remet au défaut plutôt que de laisser
  // le compte-rendu lire une case vide comme une anomalie.
  if(aDefaut && lire()==null) ecrire(defaut);
}
function interrupteur(parent, label, lire, ecrire, aide){
  const b=document.createElement('button'); b.type='button';
  b.className='pill mini'+(lire()?' ano':'');
  b.setAttribute('aria-pressed', lire()?'true':'false');
  b.textContent=label;
  if(aide) b.title=aide;
  b.addEventListener('click',()=>{ ecrire(!lire()); rendre(); });
  parent.appendChild(b);
}
// ============ QUANTITÉ D'UN ÉLÉMENT RÉPÉTÉ ============
// Compter n'est pas toujours possible en échographie : un amas déclive fait un
// seul cône d'ombre et masque ce qui est derrière, un parenchyme criblé de
// nodules confluents n'offre aucune limite nette. Un champ « Nombre » seul
// obligeait donc à inventer un chiffre ou à ne rien mettre — et ne rien mettre
// produisait un singulier, « un kyste », qui affirme un dénombrement.
// La quantité se dit d'abord en mots ; le chiffre ne s'affiche que s'il a un
// sens. Convention de nommage : <prefixe>Qte et <prefixe>Nb.
function ligneQuantite(parent, obj, prefixe, aide){
  const cQ=prefixe+'Qte', cN=prefixe+'Nb';
  const l=document.createElement('div'); l.className='ligne';
  l.innerHTML='<span class="nom">Quantité</span>';
  pastilles(l,[{v:'unique',l:'Unique'},
    {v:'plusieurs',l:'Plusieurs',t:'Dénombrables : préciser le nombre si possible'},
    {v:'multiples',l:'Multiples, non dénombrables',
     t:aide||'Trop nombreux ou trop confluents pour être comptés'}],
    ()=>obj[cQ],x=>obj[cQ]=x,['multiples']);
  parent.appendChild(l);
  // Un élément unique ou un amas innombrable : le champ chiffré n'a plus d'objet.
  if(obj[cQ]==='unique' || obj[cQ]==='multiples') obj[cN]=null;
  else champ(parent,'Nombre',()=>obj[cN],x=>obj[cN]=x,'','1');
  return l;
}
// Rend le groupe nominal ET le pluriel, dont dépendent les accords de la suite
// de la phrase : « mesurant » ou « le plus grand mesurant », « mobile » ou
// « mobiles ». Sans quantité ni nombre, on reste au pluriel : c'est le neutre,
// le singulier affirmerait qu'on en a compté un.
function libelleQuantite(obj, prefixe, mot, feminin){
  const q=obj[prefixe+'Qte'], n=obj[prefixe+'Nb'];
  const un = feminin?'une ':'un ';
  if(q==='unique')    return {t:un+mot, pluriel:false};
  if(q==='multiples') return {t:mot+'s multiples, non dénombrables', pluriel:true};
  if(n!=null)         return {t:n+' '+mot+(n>1?'s':''), pluriel:n>1};
  if(q==='plusieurs') return {t:'plusieurs '+mot+'s', pluriel:true};
  return {t:mot+'s', pluriel:true};
}
// L'adjectif d'échogénicité s'accorde avec le nombre de lésions décrites :
// « nodules multiples, hypoéchogènes », et non « hypoéchogène ».
function accordEcho(cle, pluriel){
  if(cle==='cible') return pluriel ? 'd’aspect en cible' : 'd’aspect en cible';
  const m = MOT[cle] || cle;
  if(!pluriel || /^d[’']/.test(m)) return m;          // « d’échogénicité mixte » invariable
  return m.endsWith('s') ? m : m+'s';
}
// « le plus grand mesurant 17 mm » au pluriel, « mesurant 17 mm » au singulier.
function mesureDuPlusGrand(pluriel, valeur, feminin, decimales){
  const tete = pluriel ? (feminin?', la plus grande mesurant ':', le plus grand mesurant ') : ', mesurant ';
  return tete + nb(valeur, decimales===undefined?0:decimales) + ' mm';
}

function champ(parent, nom, lire, ecrire, unite, pas, largeNom){
  const l=document.createElement('div'); l.className='ligne';
  const n=document.createElement('span'); n.className='nom'+(largeNom?' large':''); n.textContent=nom;
  l.appendChild(n);
  const i=document.createElement('input'); i.type='number'; i.step=pas||'0.1'; i.min='0';
  i.value = lire()==null ? '' : lire();
  i.placeholder='—';
  i.addEventListener('change',()=>{ const v=i.value===''?null:parseFloat(i.value); ecrire(isNaN(v)?null:v); rendre(); });
  l.appendChild(i);
  if(unite){ const u=document.createElement('span'); u.className='unite'; u.textContent=unite; l.appendChild(u); }
  parent.appendChild(l);
  return l;
}
function verdictTag(parent, texte, classe){
  const s=document.createElement('span');
  s.className='verdict v-'+(classe||'vide'); s.textContent=texte;
  parent.appendChild(s); return s;
}
// Deux situations qu'il ne faut pas confondre : un organe qu'on n'a pas
// exploré ne dit rien, un organe cherché et non retrouvé est un résultat.
// Seul le second alimente la synthèse.
function boutonsNonVu(parent, obj, feminin){
  const f=feminin?'e':'';
  [['nonExplore','Non explor'+(feminin?'ée':'é'),
    'L’organe n’a pas été exploré : le compte-rendu le mentionne tel quel, '+
    'sans en tirer la moindre hypothèse.', false],
   ['nonRetrouve','Cherché'+f+', non retrouvé'+f,
    'L’organe a été cherché et n’a pas été retrouvé : information à part entière, '+
    'dont la synthèse tire les conséquences.', true]
  ].forEach(([m,lib,aide,rouge])=>{
    const actif = obj.nonVu && obj.nonVuMotif===m;
    const b=document.createElement('button'); b.type='button';
    b.className='pill mini'+((rouge&&actif)?' ano':'');
    b.setAttribute('aria-pressed', actif?'true':'false');
    b.textContent=lib; b.title=aide;
    b.addEventListener('click',()=>{
      if(actif){ obj.nonVu=false; obj.nonVuMotif=null; }
      else { obj.nonVu=true; obj.nonVuMotif=m; }
      rendre();
    });
    parent.appendChild(b);
  });
}
function bloc(parent, titre){
  const d=document.createElement('div'); d.className='bloc';
  if(titre){ const t=document.createElement('div'); t.className='bloc-t'; t.textContent=titre; d.appendChild(t); }
  parent.appendChild(d); return d;
}
function sousBloc(parent, titre, warn){
  const d=document.createElement('div'); d.className='sousbloc'+(warn?' warnbox':'');
  const t=document.createElement('div'); t.className='bloc-t'; t.textContent=titre; d.appendChild(t);
  parent.appendChild(d); return d;
}

// ===================== RENDU D'UN REIN =====================
function rendreRein(cote){
  const r=S[cote];
  const box=document.createElement('div'); box.className='rein rein-'+cote;
  const t=document.createElement('div'); t.className='rein-titre';
  t.innerHTML='<span>Rein '+(cote==='D'?'droit':'gauche')+'</span>';
  const bio=biometrie(cote);
  if(bio && bio.verdict) {
    const v=document.createElement('span');
    v.className='verdict v-'+(bio.verdict==='normal'?'normal':(bio.verdict==='bas'?'bas':'haut'));
    v.textContent = bio.verdict==='normal'?'dans les limites'
      :(bio.verdict==='bas'?'taille diminuée':'taille augmentée');
    t.appendChild(v);
  }
  boutonsNonVu(t, r, false);
  box.appendChild(t);

  if(r.nonVu){
    const n=document.createElement('p'); n.className='aide';
    n.textContent = r.nonVuMotif==='nonRetrouve'
      ? 'Rein cherché et non retrouvé : la saisie est suspendue, la synthèse en tire '+
        'les hypothèses. Les valeurs déjà saisies sont conservées.'
      : 'Rein non exploré : la saisie est suspendue et le compte-rendu le mentionne '+
        'tel quel, sans hypothèse. Les valeurs déjà saisies sont conservées.';
    box.appendChild(n);
    return box;
  }

  // --- Biométrie ---
  const b1=bloc(box,'Biométrie');
  const lg=champ(b1,'Longueur',()=>r.longueur,v=>r.longueur=v,'mm','1');
  if(bio){
    if(bio.verdict) verdictTag(lg, bio.ref.lib+' '+bio.aff, bio.verdict==='normal'?'normal':(bio.verdict==='bas'?'bas':'haut'));
    else verdictTag(lg,'renseigner l’aorte','vide');
  }

  // --- Morphologie ---
  const b2=bloc(box,'Morphologie et échostructure');
  const l1=document.createElement('div'); l1.className='ligne';
  l1.innerHTML='<span class="nom">Contours</span>';
  pastilles(l1,[{v:'reguliers',l:'Réguliers'},{v:'irreguliers',l:'Irréguliers'},
    {v:'bosseles',l:'Bosselés',t:'Lymphome félin, polykystose, néoplasie multifocale'}],
    ()=>r.contours,v=>r.contours=v,['irreguliers','bosseles'],'reguliers');
  b2.appendChild(l1);

  // Une seule référence à la fois : le foie, sauf s’il est lui-même altéré —
  // un foie stéatosique est hyperéchogène et fait paraître le rein faussement
  // hypoéchogène. On bascule alors sur la rate, plus stable.
  const ref = S.foieAnormal ? 'rate' : 'foie';
  const l2=document.createElement('div'); l2.className='ligne';
  l2.innerHTML='<span class="nom">Cortex / '+ref+'</span>';
  if(ref==='foie')
    pastilles(l2,[{v:'hypo',l:'Hypo'},{v:'iso',l:'Iso'},
      {v:'hyper',l:'Hyper',t:S.espece==='chat'?'Peut être physiologique chez le chat (dépôt graisseux cortical)':'Néphropathie'}],
      ()=>r.echoFoie,v=>r.echoFoie=v, S.espece==='chat'?[]:['hyper'],'iso');
  else
    pastilles(l2,[{v:'hypo',l:'Hypo'},{v:'iso',l:'Iso'},
      {v:'hyper',l:'Hyper',t:'Anormal dans les deux espèces'}],
      ()=>r.echoRate,v=>r.echoRate=v,['hyper'],'iso');
  b2.appendChild(l2);

  const l4=document.createElement('div'); l4.className='ligne';
  l4.innerHTML='<span class="nom">Différenciation<br>cortico-médullaire</span>';
  pastilles(l4,[{v:'conservee',l:'Conservée'},{v:'diminuee',l:'Diminuée'},
    {v:'perdue',l:'Perdue',t:'Néphropathie avancée, infiltration'}],
    ()=>r.jcm,v=>r.jcm=v,['diminuee','perdue'],'conservee');
  b2.appendChild(l4);

  // --- Bassinet et uretère ---
  const b3=bloc(box,'Bassinet et voies urinaires');
  // Stepper à flèches : la valeur de base est « < 1 », puis on monte de 1 en 1.
  // Un input natif ne saurait pas afficher « < 1 », d’où les flèches maison.

  zb.appendChild(moins); zb.appendChild(val); zb.appendChild(plus);

    const ls=document.createElement('div'); ls.className='ligne';

    pastilles(ls,[{v:'proximal',l:'Proximal'},{v:'moyen',l:'Moyen'},
      {v:'distal',l:'Distal',t:'Le plus fréquent : calcul à la jonction urétéro-vésicale'},

  // --- Lésions focales ---

  if(r.kystes){

    champ(sk,'Plus grand',()=>r.kystesTaille,v=>r.kystesTaille=v,'mm','0.1');

  const ll=document.createElement('div'); ll.className='ligne';
  ll.innerHTML='<span class="nom">Lithiases</span>';
  [['nephrolithe','Néphrolithe','Dans le parenchyme'],
   ['pyelique','Pyélique','Dans le bassinet'],
   ['ureteral','Urétéral','Cause majeure d’obstruction chez le chat']].forEach(([v,l,t])=>{
    const bt=document.createElement('button'); bt.type='button';
    bt.className='pill mini'+(r.lithiases.has(v)?' ano':'');
    bt.setAttribute('aria-pressed', r.lithiases.has(v)?'true':'false');
    bt.textContent=l; bt.title=t;
    bt.addEventListener('click',()=>{ r.lithiases.has(v)?r.lithiases.delete(v):r.lithiases.add(v); rendre(); });

  b4.appendChild(ll);
  if(r.lithiases.size){

  if(r.masse){
    const sm=sousBloc(b4,'Caractérisation de la masse',true);

  // --- Périrénal ---

  blocImages(box,'rein_'+cote);

}

// ===================== SYNTHÈSE COMPARATIVE =====================
function synthese(){
  const bD=biometrie('D'), bG=biometrie('G');
  const items=[], lignes=[];

  // La comparaison ne porte que sur la taille, exprimée des deux façons :
  // les millimètres disent l’ampleur réelle, le pourcentage la met à l’échelle
  // de l’animal.
  if(bD && bG && bD.valeur!=null && bG.valeur!=null){
    const ecart=Math.abs(bD.valeur-bG.valeur)/Math.max(bD.valeur,bG.valeur)*100;
    const ecartMM=Math.abs(S.D.longueur-S.G.longueur);
    const asym=ecart>=15;
    items.push({t:'écart D/G : '+nb(ecartMM,0)+' mm · '+ecart.toFixed(0)+' %', c:asym?'alerte':'ok'});
    if(asym){
      const gros=bD.valeur>bG.valeur?'droit':'gauche';
      lignes.push('Asymétrie significative, le rein '+gros+' étant le plus volumineux : '+
        'cause unilatérale — obstruction, hydronéphrose, néoplasie, infarctus, '+
        'ou hypertrophie compensatrice.');
    } else {
      items.push({t:'reins symétriques', c:'ok'});
    }
    const vd=bD.verdict, vg=bG.verdict;
    if(vd==='bas' && vg==='bas')
      lignes.push('Deux petits reins symétriques : néphropathie chronique.');
    if(vd==='haut' && vg==='haut')
      lignes.push('Deux gros reins symétriques : atteinte aiguë ou infiltrante — '+
        (S.espece==='chat'?'lymphome rénal, PIF, IRA, pyélonéphrite.':'IRA, pyélonéphrite, lymphome, amyloïdose.'));
  }

  // Filet : le compte-rendu décrit la longueur sans la juger. Un rein hors norme
  // dont le voisin n'est pas mesuré ne serait relevé nulle part sans ceci.
  ['D','G'].forEach(c=>{
    const b=biometrie(c); if(!b || b.verdict==='normal') return;
    const autre=biometrie(c==='D'?'G':'D');
    if(autre) return;   // la comparaison D/G ci-dessus a déjà parlé
    const lib=c==='D'?'droit':'gauche';
    items.push({t:'rein '+lib+' '+(b.verdict==='haut'?'augmenté':'diminué'), c:'alerte'});
    lignes.push('Rein '+lib+' de taille '+(b.verdict==='haut'?'augmentée':'diminuée')+
      ', seul mesuré : '+(b.verdict==='haut'
        ? 'atteinte aiguë ou infiltrante — obstruction, pyélonéphrite, lymphome, '+
          'ou hypertrophie compensatrice'
        : 'néphropathie chronique, dysplasie, ou séquelle d’infarctus')+'.');
  });

  // Obstruction : c'est l'association qui compte, pas chaque signe isolé
  ['D','G'].forEach(c=>{
    if(!reinExamine(c)) return;
    const r=S[c], cb=classeBassinet(r.bassinet);
    const dilate = cb && cb.cle!=='normal';
    const lithU = r.lithiases.has('ureteral');
    if((dilate && r.uretere) || (r.uretere && lithU)){
      items.push({t:'obstruction suspectée — '+(c==='D'?'droite':'gauche'), c:'alerte'});
      lignes.push('Rein '+(c==='D'?'droit':'gauche')+' : dilatation pyélique et uretère visible'+
        (lithU?', avec lithiase urétérale':'')+
        ' — obstruction jusqu’à preuve du contraire.');
    } else if(dilate && !r.uretere){
      items.push({t:'pyélectasie isolée — '+(c==='D'?'droite':'gauche'), c:''});
      if(cb.cle==='legere')
        lignes.push('Rein '+(c==='D'?'droit':'gauche')+' : dilatation pyélique légère isolée, '+
          'peu spécifique — fluidothérapie, diurèse, PU/PD, pyélonéphrite débutante.');
      else
        lignes.push('Rein '+(c==='D'?'droit':'gauche')+' : dilatation pyélique '+
          (cb.cle==='moderee'?'modérée':'marquée')+' sans uretère visible — '+
          'pyélonéphrite ou obstruction intermittente.');
    }
    if(r.jcm==='perdue'){
      items.push({t:'différenciation perdue — '+(c==='D'?'droite':'gauche'), c:'alerte'});
      lignes.push('Rein '+(c==='D'?'droit':'gauche')+' : perte de la différenciation '+
        'cortico-médullaire — néphropathie avancée ou infiltration du parenchyme.');
    } else if(r.jcm==='diminuee'){
      items.push({t:'différenciation diminuée — '+(c==='D'?'droite':'gauche'), c:''});
    }
    if(r.masse){
      items.push({t:'masse rénale — '+(c==='D'?'droite':'gauche'), c:'alerte'});
      lignes.push('Rein '+(c==='D'?'droit':'gauche')+' : masse rénale — '+
        (S.espece==='chat'
          ? 'lymphome en premier lieu, puis carcinome ; kyste complexe, hématome ou abcès possibles.'
          : 'carcinome rénal en premier lieu, puis lymphome et hémangiosarcome ; kyste complexe ou hématome possibles.'));
    }
  });

  // Seul un rein cherché sans être retrouvé porte ces hypothèses : un rein
  // simplement non exploré ne dit rien.
  const introuvable = c=>S[c].nonVu && S[c].nonVuMotif==='nonRetrouve';
  if(introuvable('D') || introuvable('G')){
    const c=introuvable('D')?'droit':'gauche';
    items.push({t:'rein '+c+' non retrouvé', c:'alerte'});
    lignes.push('Rein '+c+' cherché et non retrouvé : chez un animal non obèse, agénésie, '+
      'atrophie terminale ou néphrectomie antérieure. Ne permet pas de conclure sur '+
      'l’appareil urinaire.');
    // Association forte : un seul rein qui porte toute la fonction s'hypertrophie.
    const autre = introuvable('D') ? 'G' : 'D';
    const bo = biometrie(autre);
    if(bo && bo.verdict==='haut')
      lignes.push('Rein '+(autre==='D'?'droit':'gauche')+' hypertrophié et seul visualisé : '+
        'hypertrophie compensatrice, signant une perte fonctionnelle ancienne du côté '+
        'opposé. Une infiltration ou une obstruction de ce rein restant reste à écarter.');
  }
  const bosD=reinExamine('D')&&S.D.contours==='bosseles',
        bosG=reinExamine('G')&&S.G.contours==='bosseles';
  if(bosD && bosG)
    lignes.push('Contours bosselés bilatéraux : '+(S.espece==='chat'
      ? 'lymphome rénal en premier lieu, puis polykystose (Persan, British) et néphrite interstitielle chronique.'
      : 'polykystose, néphrite chronique, néoplasie multifocale.'));

  const zc=document.getElementById('comparaison'); zc.innerHTML='';
  if(!items.length){
    const d=document.createElement('span'); d.className='comp-item';
    d.textContent='renseigner les deux reins pour la comparaison'; zc.appendChild(d);
  } else items.forEach(i=>{
    const d=document.createElement('span'); d.className='comp-item'+(i.c?' '+i.c:'');
    d.textContent=i.t; zc.appendChild(d);
  });

  const zi=document.getElementById('interpretation'); zi.innerHTML='';
  lignes.forEach(l=>{
    const p=document.createElement('p'); p.className='aide'; p.style.fontStyle='normal';
    p.style.fontSize='12.5px'; p.textContent=l; zi.appendChild(p);
  });
  // Le CR a besoin de savoir qu'une anomalie a été relevée, même si aucune
  // ligne d'interprétation n'a été produite : sans ça il conclurait
  // « sans anomalie » en décrivant pourtant une lésion.
  syntheseVessie(items, lignes);
  syntheseProstate(items, lignes);
  syntheseGenitale(items, lignes);
  syntheseTesticules(items, lignes);
  syntheseFoieVB(items, lignes);
  syntheseSurrenalesRate(items, lignes);
  syntheseDigestive(items, lignes);
  synthesePancreas(items, lignes);
  syntheseReserves(items, lignes);
  lignes.alerte = items.some(i=>i.c==='alerte') ||
    anomalieDecrite('D') || anomalieDecrite('G') || anomalieVessie() ||
    anomalieProstate() || anomalieGenitale() || anomalieTesticules() ||
    anomalieFoie() || anomalieVB() || anomalieSurrenales() || anomalieRate() ||
    anomalieEstomac() || anomalieIntestins() || anomaliePancreas() ||
    anomalieNL() || anomalieVasc();
  return lignes;
}

// ===================== COMPTE-RENDU =====================
// Le compte-rendu est un document français : séparateur décimal virgule.
function nb(v,d){ return v.toFixed(d===undefined?1:d).replace('.',','); }
// Élision devant voyelle ou h muet
function de(mot){ return /^[aeiouyéèêàâîôûh]/i.test(mot) ? "d\u2019"+mot : 'de '+mot; }

// ===================== VESSIE =====================
// Paroi : chez le chien l'épaisseur dépend de l'étirement, pas seulement de
// l'espèce. Une norme unique fait donc deux erreurs symétriques — elle déclare
// épaissie une vessie peu remplie et normale une vessie distendue.
// Bornes = moyenne ± 2 écarts-types : à 1 ET on classerait anormal un chien
// sain sur six. Chez le chat, une valeur unique, sans palier de réplétion.
const REF_PAROI = {
  chien:{ paliers:{ peu:{m:2.3, sd:0.4}, moderee:{m:1.6, sd:0.3},
                    tres:{m:1.4, sd:0.3}, globe:{m:1.4, sd:0.3} } },
  chat:{ fixe:{min:1.3, max:1.7} }
};
const REPL_LIB = { peu:'peu remplie', moderee:'modérément distendue',
                   tres:'très distendue', globe:'en globe' };
// Renvoie la fourchette applicable, ou null quand rien ne permet de trancher :
// chez le chien sans réplétion précisée, il n'y a pas de palier à appliquer.
function refParoiVessie(){
  const e=S.espece, v=S.vessie;
  if(!e) return null;
  if(e==='chat'){ const f=REF_PAROI.chat.fixe; return {min:f.min, max:f.max, palier:null}; }
  const p=REF_PAROI.chien.paliers[v.repletion];
  if(!p) return null;
  return {min:Math.max(0, +(p.m-2*p.sd).toFixed(1)), max:+(p.m+2*p.sd).toFixed(1),
          moy:p.m, sd:p.sd, palier:v.repletion};
}

function vessieVide(){
  return {
    nonVu:false, nonVuMotif:null,
    repletion:null,
    paroi:null,
    // Pré-cochée sur la valeur normale. Comme pour les reins, ce champ n'entre
    // pas dans le test « vessie examinée » : sinon elle paraîtrait explorée.
    stratification:'conservee',
    paroiCaractere:null, paroiSiege:null,
    contenu:new Set(),            // vide = anéchogène
    calculs:false, calculsQte:null, calculsNb:null, calculsTaille:null, calculsMobile:null,
    masse:false, masseL:null, masseH:null, masseSiege:null, masseImplant:null,
    masseEcho:null, masseHomo:null, masseContours:null, masseVasc:null,
    graisse:false, epanchement:false, rupture:false,
    // Pré-coché sur la valeur normale. Comme la stratification, il sort du test
    // « vessie examinée » : sinon elle paraîtrait explorée d'emblée.
    uretre:'normal',              // null | 'normal' | 'dilate'
    jets:new Set()                // 'D', 'G'
  };
}

// La réplétion commande l'interprétation de la paroi, dans les DEUX sens :
// vessie vide, la contraction épaissit la paroi ; vessie en très forte
// distension, l'étirement l'amincit et peut masquer un épaississement vrai.
function paroiVessie(){
  const v=S.vessie, e=S.espece;
  if(!e || v.nonVu || v.paroi==null) return null;
  // Vessie vide : la paroi contractée paraît épaissie et aucune référence ne
  // s'applique. C'est le seul cas où la mesure reste franchement non jugeable.
  if(v.repletion==='vide')
    return {valeur:v.paroi, ref:null, verdict:null, bloque:'vide'};
  const ref=refParoiVessie();
  // Chien sans réplétion précisée : la donnée manque pour choisir le palier.
  // On imprime la mesure et on dit ce qui manque, comme ailleurs dans l'outil.
  if(!ref) return {valeur:v.paroi, ref:null, verdict:null, bloque:'repletion'};
  // Une paroi fine n'est pas une anomalie : seul le dépassement compte.
  const verdict = v.paroi>ref.max ? 'haut' : 'normal';
  // Réserve conservée sur vessie très distendue : l'étirement peut masquer un
  // épaississement vrai. Elle ne vaut que pour une paroi jugée normale — une
  // paroi épaissie MALGRÉ l'étirement n'a pas besoin d'être relativisée.
  const reserve = (v.repletion==='tres'||v.repletion==='globe') && verdict!=='haut';
  return {valeur:v.paroi, ref:ref, verdict:verdict, reserve:reserve};
}

// Même principe que pour les reins : la réplétion est toujours appréciée, elle
// sert de garde-fou. La stratification pré-cochée n'en fait pas partie.
function vessieExaminee(){
  const v=S.vessie;
  if(v.nonVu) return false;
  return v.repletion!=null || v.paroi!=null || v.contenu.size || v.calculs ||
    v.masse || v.graisse || v.epanchement || v.rupture || v.uretre==='dilate' || v.jets.size;
}
function anomalieVessie(){
  const v=S.vessie;
  if(!vessieExaminee()) return false;
  const p=paroiVessie();
  if(p && p.verdict==='haut') return true;
  if(v.repletion==='globe') return true;
  // horsDefaut, et non « !== conservee » : une pastille décochée vaut null et
  // ne doit pas être lue comme une stratification perdue.
  if(horsDefaut(v.stratification,'conservee')) return true;
  if(v.paroiCaractere) return true;
  if(v.contenu.size || v.calculs || v.masse) return true;
  if(v.graisse || v.epanchement || v.rupture) return true;
  if(v.uretre==='dilate') return true;
  return false;
}

function rendreVessie(){
  const v=S.vessie;
  const box=document.createElement('div'); box.className='rein vessie';
  const t=document.createElement('div'); t.className='rein-titre';
  t.innerHTML='<span>Vessie</span>';
  const p=paroiVessie();
  if(p && p.verdict){
    const s=document.createElement('span');
    s.className='verdict v-'+(p.verdict==='haut'?'haut':'normal');
    s.textContent = p.verdict==='haut' ? 'paroi épaissie' : 'paroi dans les limites';
    t.appendChild(s);
  } else if(p && p.bloque){
    verdictTag(t, p.bloque==='repletion' ? 'réplétion à préciser' : 'paroi non interprétable','vide');
  }
  boutonsNonVu(t, v, true);
  box.appendChild(t);

  if(v.nonVu){
    const n=document.createElement('p'); n.className='aide';
    n.textContent = v.nonVuMotif==='nonRetrouve'
      ? 'Vessie cherchée et non retrouvée : la saisie est suspendue. Chez un animal '+
        'qui n’urine pas, c’est une rupture qu’il faut chercher.'
      : 'Vessie non explorée : la saisie est suspendue et le compte-rendu le mentionne '+
        'tel quel, sans hypothèse.';
    box.appendChild(n);
    return box;
  }

  // --- Réplétion, avant la paroi : c'est elle qui la rend interprétable ---
  const b0=bloc(box,'Réplétion');
  const lr=document.createElement('div'); lr.className='ligne';
  pastilles(lr,[{v:'vide',l:'Vide',t:'Paroi contractée : épaisseur non interprétable'},
    {v:'peu',l:'Peu remplie',t:S.espece==='chien'?'Référence chien : 2,3 ± 0,4 mm':''},
    {v:'moderee',l:'Modérément distendue',t:S.espece==='chien'?'Référence chien : 1,6 ± 0,3 mm':''},
    {v:'tres',l:'Très distendue',
      t:(S.espece==='chien'?'Référence chien : 1,4 ± 0,3 mm. ':'')+'Paroi étirée : un épaississement peut être masqué'},
    {v:'globe',l:'Globe',t:'Vessie qui ne se vide pas : obstruction, vessie neurologique, dysautonomie'}],
    ()=>v.repletion,x=>v.repletion=x,['vide','tres','globe']);
  b0.appendChild(lr);

  // --- Paroi ---
  const b1=bloc(box,'Paroi');
  const lp=champ(b1,'Épaisseur',()=>v.paroi,x=>v.paroi=x,'mm','0.1');
  if(p){
    if(p.verdict){
      verdictTag(lp,'référence '+nb(p.ref.min)+'–'+nb(p.ref.max),
        p.verdict==='haut'?'haut':'normal');
      if(p.reserve) verdictTag(lp,'étirement : sensibilité réduite','vide');
    }
    else verdictTag(lp, p.bloque==='vide' ? 'vessie vide'
                      : 'réplétion non précisée', 'vide');
  } else if(v.paroi==null){
    const r=refParoiVessie();
    if(r) verdictTag(lp,'référence '+nb(r.min)+'–'+nb(r.max),'vide');
    else if(S.espece==='chien') verdictTag(lp,'préciser la réplétion','vide');
  }

  // Dès que la mesure sort au-dessus de la référence, « Diffus » se coche : un
  // épaississement est diffus par défaut, le focal est ce qu'on va chercher.
  // Tant que la paroi n'est pas jugée épaissie, le champ reste optionnel et
  // peut rester vide — sinon on affirmerait un épaississement non constaté.
  if(p && p.verdict==='haut' && v.paroiCaractere==null) v.paroiCaractere='diffus';
  const lc=document.createElement('div'); lc.className='ligne';
  lc.innerHTML='<span class="nom">Épaississement</span>';
  pastilles(lc,[{v:'diffus',l:'Diffus'},
    {v:'focal',l:'Focal',t:'⚠ Ne pas confondre avec une papille urétérale, visible par intermittence au trigone'}],
    ()=>v.paroiCaractere,x=>v.paroiCaractere=x,['diffus','focal'],
    (p && p.verdict==='haut') ? 'diffus' : null);
  b1.appendChild(lc);

  if(v.paroiCaractere==='focal'){
    const ls=document.createElement('div'); ls.className='ligne';
    ls.innerHTML='<span class="nom">Siège</span>';
    pastilles(ls,[{v:'apex',l:'Apex',t:'Cranio-ventral : siège habituel de la cystite'},
      {v:'laterale',l:'Paroi latérale'},
      {v:'trigone',l:'Trigone / col',t:'Siège d’élection du carcinome à cellules transitionnelles'}],
      ()=>v.paroiSiege,x=>v.paroiSiege=x,['trigone']);
    b1.appendChild(ls);
  } else v.paroiSiege=null;

  const lst=document.createElement('div'); lst.className='ligne';
  lst.innerHTML='<span class="nom">Stratification</span>';
  lst.title='4 couches : muqueuse (hypo), sous-muqueuse (hyper), musculeuse (hypo), '+
    'séreuse (hyper). Plus difficile à distinguer que sur le tube digestif.';
  pastilles(lst,[{v:'conservee',l:'Conservée'},
    {v:'perdue',l:'Perdue',t:'Signe l’infiltration de la paroi'}],
    ()=>v.stratification,x=>v.stratification=x,['perdue'],'conservee');
  b1.appendChild(lst);

  // --- Contenu ---
  const b2=bloc(box,'Contenu');
  const lco=document.createElement('div'); lco.className='ligne';
  lco.innerHTML='<span class="nom">Aspect</span>';
  lco.title='Urines anéchogènes normalement. ⚠ Pseudo-boue : artefact de lobe '+
    'secondaire ou de réverbération, et image miroir du côlon descendant — '+
    'disparaît en changeant d’incidence, contrairement à un vrai dépôt.';
  [['corpusculaire','Corpusculaire en suspension','Tourbillonne et ne sédimente pas : cristaux, cellules, sang'],
   ['depot','Dépôt déclive','Sédimente, se déplace au repositionnement'],
   ['caillot','Caillot','Échogène, SANS cône d’ombre — c’est ce qui le sépare du calcul'],
   ['gaz','Gaz intra-luminal','Emphysème cystique : faire une glycémie']].forEach(([k,l,ti])=>{
    const b=document.createElement('button'); b.type='button';
    b.className='pill mini'+(v.contenu.has(k)?' ano':'');
    b.setAttribute('aria-pressed', v.contenu.has(k)?'true':'false');
    b.textContent=l; b.title=ti;
    b.addEventListener('click',()=>{ v.contenu.has(k)?v.contenu.delete(k):v.contenu.add(k); rendre(); });
    lco.appendChild(b);
  });
  b2.appendChild(lco);

  const lf=document.createElement('div'); lf.className='ligne';
  interrupteur(lf,'Calculs',()=>v.calculs,x=>v.calculs=x,
    'Structure échogène déclive avec cône d’ombre');
  interrupteur(lf,'Masse',()=>v.masse,x=>v.masse=x);
  b2.appendChild(lf);

  if(v.calculs){
    const sc=sousBloc(b2,'Calculs',true);
    // Compter les calculs n'est pas toujours possible : un amas déclive fait
    // un seul cône d'ombre et masque ce qu'il y a derrière. La quantité se dit
    // donc d'abord en mots, le chiffre ne vient que si on a vraiment pu compter.
    ligneQuantite(sc, v, 'calculs',
      'Amas déclive : le cône d’ombre du premier plan masque les suivants');
    champ(sc,'Plus grand',()=>v.calculsTaille,x=>v.calculsTaille=x,'mm','1');
    const lm=document.createElement('div'); lm.className='ligne';
    lm.innerHTML='<span class="nom">Mobilité</span>';
    pastilles(lm,[{v:'mobiles',l:'Mobiles'},
      {v:'fixes',l:'Fixes',t:'Un calcul fixe est enclavé — col, urètre — ou pris dans une paroi épaissie'}],
      ()=>v.calculsMobile,x=>v.calculsMobile=x,['fixes']);
    sc.appendChild(lm);
  } else { v.calculsQte=null; v.calculsNb=null; v.calculsTaille=null; v.calculsMobile=null; }

  if(v.masse){
    const sm=sousBloc(b2,'Caractérisation de la masse',true);
    const ld=document.createElement('div'); ld.className='ligne';
    ld.innerHTML='<span class="nom">Dimensions</span>';
    [['masseL','L'],['masseH','H']].forEach(([k,lab])=>{
      const i=document.createElement('input'); i.type='number'; i.step='1'; i.min='0';
      i.style.width='62px'; i.placeholder=lab; i.value=v[k]==null?'':v[k];
      i.addEventListener('change',()=>{ const x=i.value===''?null:parseFloat(i.value); v[k]=isNaN(x)?null:x; rendre(); });
      ld.appendChild(i);
    });
    const u=document.createElement('span'); u.className='unite'; u.textContent='mm'; ld.appendChild(u);
    sm.appendChild(ld);
    [['Siège','masseSiege',[{v:'apex',l:'Apex'},{v:'laterale',l:'Paroi latérale'},
        {v:'trigone',l:'Trigone / col'}]],
     ['Implantation','masseImplant',[{v:'sessile',l:'Sessile'},{v:'pediculee',l:'Pédiculée'}]],
     ['Échogénicité','masseEcho',[{v:'anecho',l:'Anéchogène'},{v:'hypo',l:'Hypoéchogène'},
        {v:'iso',l:'Isoéchogène'},{v:'hyper',l:'Hyperéchogène'},{v:'mixte',l:'Mixte'}]],
     ['Structure','masseHomo',[{v:'homogene',l:'Homogène'},{v:'heterogene',l:'Hétérogène'},
        {v:'cavitaire',l:'Cavitaire / nécrosée'}]],
     ['Contours','masseContours',[{v:'nets',l:'Nets'},{v:'flous',l:'Flous / infiltrants'}]],
     ['Vascularisation','masseVasc',[{v:'absente',l:'Absente',t:'Oriente vers un polype ou un caillot organisé'},
        {v:'peripherique',l:'Périphérique'},
        {v:'centrale',l:'Centrale / anarchique',t:'Oriente vers un processus tumoral'}]]
    ].forEach(([nom,cle,opts])=>{
      const l=document.createElement('div'); l.className='ligne';
      l.innerHTML='<span class="nom">'+nom+'</span>';
      pastilles(l,opts,()=>v[cle],x=>v[cle]=x,null,defautDe('vessie',cle));
      sm.appendChild(l);
    });
  } else { ['masseL','masseH','masseSiege','masseImplant','masseEcho','masseHomo',
    'masseContours','masseVasc'].forEach(k=>v[k]=null); }

  // --- Voies et périphérie ---
  const b3=bloc(box,'Voies et périphérie');
  const lu=document.createElement('div'); lu.className='ligne';
  lu.innerHTML='<span class="nom">Urètre proximal</span>';
  pastilles(lu,[{v:'normal',l:'Non dilaté'},
    {v:'dilate',l:'Dilaté',t:'Obstruction distale, ou reflux sur vessie de lutte'}],
    ()=>v.uretre,x=>v.uretre=x,['dilate'],'normal');
  b3.appendChild(lu);

  const lj=document.createElement('div'); lj.className='ligne';
  lj.innerHTML='<span class="nom">Jets urétéraux</span>';
  [['D','Droit'],['G','Gauche']].forEach(([k,l])=>{
    const b=document.createElement('button'); b.type='button';
    b.className='pill mini';
    b.setAttribute('aria-pressed', v.jets.has(k)?'true':'false');
    b.textContent=l; b.title='Un jet visualisé prouve la perméabilité de l’uretère de ce côté';
    b.addEventListener('click',()=>{ v.jets.has(k)?v.jets.delete(k):v.jets.add(k); rendre(); });
    lj.appendChild(b);
  });
  b3.appendChild(lj);

  const lpe=document.createElement('div'); lpe.className='ligne';
  interrupteur(lpe,'Graisse péri-vésicale hyperéchogène',()=>v.graisse,x=>v.graisse=x,
    'Stéatite réactionnelle : cystite sévère, rupture, péritonite');
  interrupteur(lpe,'Épanchement',()=>v.epanchement,x=>v.epanchement=x);
  interrupteur(lpe,'Perte de continuité pariétale',()=>v.rupture,x=>v.rupture=x,
    'Rupture vésicale : avec un épanchement, uro-abdomen jusqu’à preuve du contraire');
  b3.appendChild(lpe);

  blocImages(box,'vessie');
  return box;
}

function phraseVessie(){
  const v=S.vessie, L=[];
  if(v.nonVu) return 'VESSIE\n'+(v.nonVuMotif==='nonRetrouve'
    ? 'Recherchée, non retrouvée.' : 'Non explorée.');
  if(!vessieExaminee()) return null;

  const REPL={vide:'vide', peu:'peu remplie', moderee:'modérément distendue',
    tres:'très distendue', globe:'en globe'};
  const p=paroiVessie();
  // Une paroi non interprétable interdit de conclure à la normalité.
  const toutNormal = !anomalieVessie() && !(p && p.bloque);

  // Ordre de lecture du bloc, fixé : distension, contenu, paroi, urètre,
  // espace péri-vésical. On décrit la cavité avant sa paroi, puis ce qui
  // l'entoure. La masse suit la paroi, dont elle est une lésion ; les jets
  // urétéraux suivent l'urètre, avec lequel ils forment les voies.
  const examine = v.repletion || v.paroi!=null;

  // --- 1. Distension ---
  if(toutNormal){
    let s='Examen dans les limites de la normale.';
    if(v.repletion) s+=' Vessie '+REPL[v.repletion]+'.';
    L.push(s);
  } else if(v.repletion) L.push('Vessie '+Q(REPL[v.repletion], v.repletion==='globe')+'.');

  // --- 2. Contenu ---
  const cont=[];
  if(v.contenu.has('corpusculaire')) cont.push('éléments corpusculaires en suspension');
  if(v.contenu.has('depot')) cont.push('dépôt déclive');
  if(v.contenu.has('caillot')) cont.push('structure échogène mobile sans cône d’ombre, '+
    'compatible avec un caillot ou un calcul de petite taille non ombrant');
  if(v.contenu.has('gaz')) cont.push('gaz intra-luminal');
  if(v.calculs){
    const q=libelleQuantite(v, 'calculs', 'calcul', false);
    let s=q.t;
    if(v.calculsTaille!=null) s+=mesureDuPlusGrand(q.pluriel, v.calculsTaille, false, 0);
    if(v.calculsMobile) s+= v.calculsMobile==='mobiles'
      ? (q.pluriel?', mobiles':', mobile') : (q.pluriel?', fixes':', fixe');
    s+=', avec cône d’ombre';
    cont.push(s);
  }
  if(cont.length) L.push(M('Contenu : '+cont.join(' ; '),true)+'.');
  else if(examine) L.push('Contenu anéchogène.');

  // --- 3. Paroi ---
  if(p){
    if(toutNormal){
      if(v.paroi!=null) L.push('Paroi de '+V(nb(v.paroi)+' mm')+
        ' (référence '+nb(p.ref.min)+'–'+nb(p.ref.max)+').');
    } else if(p.verdict){
      const a = p.verdict==='haut';
      // Le caractère de l'épaississement se dit DANS la phrase de mesure :
      // « épaissie de façon diffuse », plutôt qu'une seconde ligne qui répète
      // ce que la première vient d'annoncer.
      let verdict = a ? 'épaissie' : 'dans les limites de la normale';
      if(a && v.paroiCaractere){
        verdict += v.paroiCaractere==='diffus' ? ' de façon diffuse' : ' de façon focale';
        if(v.paroiCaractere==='focal' && v.paroiSiege)
          verdict += ' ' + {apex:'au niveau de l’apex', laterale:'sur une paroi latérale',
            trigone:'au niveau du trigone'}[v.paroiSiege];
      }
      L.push('Paroi mesurée à '+(a? M(nb(v.paroi)+' mm',true) : V(nb(v.paroi)+' mm'))+
        ' (référence '+nb(p.ref.min)+'–'+nb(p.ref.max)+') : '+Q(verdict,a)+'.');
    } else {
      // La réserve d'interprétation est portée par la synthèse, pas par le
      // compte-rendu : ici on donne la mesure, rien de plus.
      L.push('Paroi mesurée à '+nb(v.paroi)+' mm.');
    }
  }
  // Caractérisations restantes. L'épaississement n'est redit ici que si la
  // phrase de mesure ne l'a pas déjà porté — paroi non mesurée, ou mesure non
  // interprétable : le caractère est alors la seule information disponible.
  const car=[];
  if(v.paroiCaractere && !(p && p.verdict==='haut')){
    let t='Épaississement '+(v.paroiCaractere==='diffus'?'diffus':'focal');
    if(v.paroiSiege) t+=' '+{apex:'de l’apex',laterale:'d’une paroi latérale',
      trigone:'du trigone'}[v.paroiSiege];
    car.push(M(t,true));
  }
  if(horsDefaut(v.stratification,'conservee')) car.push(M('stratification pariétale perdue',true));
  if(car.length){
    // Majuscule initiale, en sautant le surlignage : sans ça la phrase commence
    // en minuscule quand seule la stratification est en cause.
    let s=car.join(', ');
    s=s.replace(/^(<mark[^>]*>)?([a-zà-ÿ])/, function(x,b,c){ return (b||'')+c.toUpperCase(); });
    L.push(s+'.');
  }

  if(v.masse){
    const d=[v.masseL,v.masseH].filter(x=>x!=null);
    let s='Masse';
    if(v.masseImplant) s+=' '+(v.masseImplant==='sessile'?'sessile':'pédiculée');
    if(v.masseSiege) s+=' '+{apex:'de l’apex',laterale:'d’une paroi latérale',trigone:'du trigone'}[v.masseSiege];
    if(d.length) s+=' mesurant '+d.map(x=>nb(x,0)).join(' × ')+' mm';
    const q=[];
    if(v.masseEcho) q.push(MOT[v.masseEcho]);
    if(v.masseHomo) q.push(MOT[v.masseHomo]);
    if(v.masseContours) q.push('à contours '+MOT[v.masseContours]);
    if(v.masseVasc) q.push(MOT[v.masseVasc]);
    if(q.length) s+=', '+q.join(', ');
    L.push(M(s,true)+'.');
  }

  // --- 4. Urètre et voies ---
  if(v.uretre==='dilate') L.push('Urètre proximal '+M('dilaté',true)+'.');
  if(v.jets.size===2) L.push('Jets urétéraux visualisés des deux côtés.');
  else if(v.jets.size===1) L.push('Jet urétéral visualisé à '+(v.jets.has('D')?'droite':'gauche')+' seulement.');

  // --- 5. Espace péri-vésical ---
  const per=[];
  if(v.graisse) per.push('graisse péri-vésicale hyperéchogène');
  if(v.epanchement) per.push('épanchement');
  if(v.rupture) per.push('perte de continuité de la paroi');
  // Urètre normal et péri-vésical normal : deux mentions de routine sur une ligne.
  const uretreOk = v.uretre==='normal';
  if(per.length){
    if(uretreOk) L.push('Urètre proximal non dilaté.');
    L.push('Péri-vésical : '+M(per.join(', '),true)+'.');
  } else if(examine){
    L.push(uretreOk
      ? 'Urètre proximal non dilaté, espace péri-vésical sans particularité.'
      : 'Espace péri-vésical sans particularité.');
  } else if(uretreOk) L.push('Urètre proximal non dilaté.');

  return L.length ? 'VESSIE\n'+L.join('\n') : null;
}

// Associations vésicales : c'est le rapprochement qui conclut, pas le signe seul.
function syntheseVessie(items, lignes){
  const v=S.vessie;
  if(v.nonVu && v.nonVuMotif!=='nonRetrouve') return;
  if(v.nonVu){
    items.push({t:'vessie non retrouvée', c:'alerte'});
    lignes.push('Vessie cherchée et non retrouvée : vessie vide, ou rupture vésicale — elle se vide '+
      'dans l’abdomen et devient introuvable. À considérer en premier chez un animal qui '+
      'n’urine pas ou en abdomen douloureux.');
    return;
  }
  if(!vessieExaminee()) return;
  const p=paroiVessie();
  const epaissie = p && p.verdict==='haut';

  if(v.rupture && v.epanchement){
    items.push({t:'rupture vésicale suspectée', c:'alerte'});
    lignes.push('Perte de continuité de la paroi avec épanchement : rupture vésicale et '+
      'uro-abdomen jusqu’à preuve du contraire.');
  }
  if(v.contenu.has('gaz')){
    items.push({t:'gaz intra-vésical', c:'alerte'});
    lignes.push('Gaz intra-luminal : emphysème cystique, sur terrain glucosurique le plus '+
      'souvent. Un sondage récent peut aussi introduire de l’air.');
  }
  if(p && p.bloque==='vide'){
    items.push({t:'paroi non interprétable', c:''});
    lignes.push('Épaisseur pariétale non interprétable sur vessie vide : la paroi contractée '+
      'paraît épaissie. À recontrôler sur vessie modérément remplie avant toute conclusion.');
  }
  // La réplétion n'est pas un détail de confort : chez le chien elle commande
  // la fourchette de référence. Sans elle, la mesure reste une mesure.
  if(p && p.bloque==='repletion'){
    items.push({t:'réplétion à préciser', c:''});
    lignes.push('Épaisseur pariétale de '+nb(v.paroi)+' mm non rapportée à une référence : '+
      'chez le chien la norme dépend de la réplétion (peu remplie 2,3 ± 0,4 mm, '+
      'modérément distendue 1,6 ± 0,3 mm, très distendue 1,4 ± 0,3 mm). Préciser la '+
      'réplétion pour conclure.');
  }
  // Réserve, et non blocage : la mesure est confrontée à la norme du palier,
  // mais un épaississement débutant peut être lissé par l'étirement.
  if(p && p.reserve){
    items.push({t:'sensibilité réduite', c:''});
    lignes.push('Paroi dans les limites pour une vessie '+
      (v.repletion==='globe'?'en globe':'très distendue')+' (référence '+
      nb(p.ref.min)+'–'+nb(p.ref.max)+' mm), mais l’étirement amincit la paroi et peut '+
      'masquer un épaississement vrai : une paroi normale dans ces conditions '+
      'n’exclut pas une cystite. À recontrôler en réplétion modérée au moindre doute.');
  }
  // Le siège oriente plus que l'épaisseur
  if((epaissie || v.masse) && (v.paroiSiege==='trigone' || v.masseSiege==='trigone')){
    items.push({t:'lésion du trigone', c:'alerte'});
    lignes.push('Lésion du trigone : carcinome à cellules transitionnelles en premier lieu, '+
      'surtout si la stratification est perdue et les contours infiltrants.');
  } else if(epaissie && (v.paroiSiege==='apex'||v.paroiCaractere==='diffus') &&
            (v.contenu.has('corpusculaire')||v.contenu.has('depot'))){
    items.push({t:'cystite', c:''});
    lignes.push('Épaississement '+(v.paroiSiege==='apex'?'cranio-ventral':'diffus')+
      ' avec contenu en suspension : cystite. Si elle récidive, cause entretenante — '+
      'calcul, polype, diabète, anomalie anatomique.');
  }
  if(v.calculs){
    items.push({t:'lithiase vésicale', c:'alerte'});
    lignes.push('Lithiase vésicale'+(epaissie?' avec paroi épaissie — cystite lithiasique':'')+
      '. Chez le mâle, l’urètre est le siège de l’obstruction et échappe à la coupe '+
      'abdominale.');
  }
  if(v.repletion==='globe'){
    items.push({t:'globe vésical', c:'alerte'});
    lignes.push('Globe vésical'+(epaissie?', avec paroi épaissie signant une lutte ancienne':'')+
      ' : obstruction mécanique — calcul, bouchon, tumeur du col —, atteinte neurologique, '+
      'ou dysautonomie.');
  }
  if(v.uretre==='dilate' && !v.calculs){
    items.push({t:'urètre proximal dilaté', c:''});
    lignes.push('Urètre proximal dilaté sans calcul visualisé : bouchon ou sténose distale, '+
      'hors du champ de la coupe abdominale.');
  }
  // Filet : le compte-rendu ne porte plus de verdict sur la paroi. Si aucune
  // des situations ci-dessus n'a parlé, l'épaississement doit sortir ici.
  if(epaissie && !items.some(i=>/trigone|cystite|lithiase|globe/.test(i.t))){
    items.push({t:'paroi vésicale épaissie', c:''});
    lignes.push('Paroi vésicale épaissie'+
      (v.paroiSiege ? ' ('+({trigone:'trigone', apex:'cranio-ventrale',
        diffus:'diffuse'})[v.paroiSiege]+')' : '')+
      ' : cystite, infiltration tumorale si la stratification est perdue, '+
      'ou lutte chronique contre un obstacle d’aval.');
  }
  // Le jet urétéral croise directement l'uretère vu côté rein
  if(v.jets.size===1){
    const abs = v.jets.has('D') ? 'G' : 'D';
    if(S[abs] && (S[abs].uretere || (classeBassinet(S[abs].bassinet)||{}).cle!=='normal')){
      items.push({t:'jet absent du côté dilaté', c:'alerte'});
      lignes.push('Aucun jet urétéral à '+(abs==='D'?'droite':'gauche')+' alors que ce rein '+
        'est dilaté : argument de plus pour une obstruction urétérale de ce côté. '+
        'L’émission étant intermittente, une absence ne prouve rien.');
    }
  }
}

// ===================== PROSTATE =====================
// Aucune norme prostatique ne tient dans l'absolu : la taille attendue dépend du
// poids, de l'âge et surtout du statut — l'hyperplasie bénigne étant
// androgéno-dépendante, elle ne survit pas à la castration.
//   Entier  : formules de Ruel (converties en mm), poids en kg et âge en années.
//   Castré  : régression sur 72 chiens castrés ; l'âge n'y joue plus aucun rôle.
// L'outil CALCULE l'attendu et s'arrête là : le verdict petite/normale/grande
// reste une appréciation à l'écho, à croiser avec le reste du tableau.
// L'âge effectif : celui de la date de naissance si elle est connue, sinon le
// champ saisi. Tout ce qui parle d'âge passe par ici.
function ageEffectif(){
  const an=ageDepuisNaissance();
  return an!=null ? an : S.age;
}
function attenduProstate(){
  // L'âge vient de la date de naissance quand elle est connue : une seule
  // source de vérité, pas deux champs qui peuvent se contredire.
  const an=ageDepuisNaissance();
  const P=S.poids, A=(an!=null?an:S.age);
  if(S.espece!=='chien' || P==null) return null;
  if(S.statut==='castre')
    return {type:'castre', age:A, L:12.47+0.49*P, H:6.7+0.20*P};
  if(A==null) return null;
  return {type:'entier', age:A,
    L:    0.55*P + 1.43*A + 33.1,
    Larg: 0.47*P + 0.89*A + 34.5,
    Hs:   0.46*P + 0.69*A + 26.8,
    Ht:   0.44*P + 0.83*A + 22.5,
    V:    0.867*P + 1.885*A + 15.88};
}

function prostateVide(){
  return {
    nonVu:false,
    L:null, H:null, Larg:null,
    // Pré-cochés sur la valeur normale. Aucun n'entre dans le test
    // « prostate examinée » : ce sont les dimensions qui le déclenchent.
    taille:'normale', symetrie:'symetrique', contours:'nets',
    echo:'iso', structure:'homogene', bilobe:'conserve',
    cavites:false, cavitesQte:null, cavitesNb:null, cavitesTaille:null, cavitesContenu:null,
    paraprostatique:false,
    mineralisations:null,        // null | 'punctiformes' | 'grossieres'
    graisse:false,
    trigone:false
  };
}

function prostatePertinente(){
  return S.sexe==='male';
}
// Repliée par défaut chez le chat castré. Toute saisie déjà faite rouvre le
// bloc d'elle-même : une donnée ne doit pas disparaître derrière un pli.
function prostateRepliee(){
  if(!prostatePertinente()) return false;
  if(S.prostateDepliee) return false;
  if(S.prostate && (prostateExaminee() || S.prostate.nonVu)) return false;
  return S.espece==='chat' && S.statut==='castre';
}
function prostateExaminee(){
  const p=S.prostate;
  if(!prostatePertinente() || p.nonVu) return false;
  return p.L!=null || p.H!=null || p.Larg!=null ||
    p.cavites || p.paraprostatique || p.mineralisations!=null ||
    p.graisse || p.trigone;
}
function anomalieProstate(){
  const p=S.prostate;
  if(!prostateExaminee()) return false;
  if(p.taille!=='normale') return true;
  if(p.symetrie!=='symetrique' || p.contours!=='nets') return true;
  if(p.echo!=='iso' || p.structure!=='homogene' || p.bilobe!=='conserve') return true;
  if(p.cavites || p.paraprostatique || p.mineralisations!=null) return true;
  if(p.graisse || p.trigone) return true;
  return false;
}
