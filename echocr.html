function phraseProstate(){
  const p=S.prostate, L=[];
  if(!prostatePertinente()) return null;
  if(p.nonVu) return 'PROSTATE\nNon visualisée.';
  if(!prostateExaminee()) return null;

  // L'attendu reste à l'écran, dans l'encart : il sert à juger, pas à être lu
  // par le propriétaire ou le confrère. Le CR ne porte que la mesure et l'avis.
  const d=[p.L,p.H,p.Larg].filter(x=>x!=null);
  const APP={petite:'de petite taille', normale:'de taille normale', grande:'de taille augmentée'};
  const ano = p.taille==='grande';
  const dim=d.map(x=>nb(x,0)).join(' × ')+' mm';
  if(!anomalieProstate()){
    L.push('Examen dans les limites de la normale.'+
      (d.length?' Prostate de '+V(dim)+'.':''));
  } else if(d.length){
    L.push('Dimensions '+(ano? M(dim,true) : V(dim))+
      ' : prostate '+Q(APP[p.taille],ano)+'.');
  } else {
    L.push('Prostate '+Q(APP[p.taille],ano)+'.');
  }

  const m=[];
  m.push(p.symetrie==='symetrique' ? 'symétrique' : M('asymétrique',true));
  m.push(p.contours==='nets' ? 'contours nets' : M('contours '+MOT[p.contours],true));
  m.push(p.echo==='iso' ? 'parenchyme isoéchogène à la rate'
    : M('parenchyme '+MOT[p.echo]+' à la rate',true));
  m.push(p.structure==='homogene' ? 'homogène' : M('hétérogène',true));
  m.push(p.bilobe==='conserve' ? 'aspect bilobé conservé' : M('aspect bilobé perdu',true));
  let ligne=m.join(', ');
  ligne = ligne.replace(/^(<mark[^>]*>)?([a-zà-ÿ])/, function(x,b,c){ return (b||'')+c.toUpperCase(); });
  L.push(ligne+'.');

  const les=[];
  if(p.cavites){
    const q=libelleQuantite(p, 'cavites', 'cavité', true);
    let s=q.t;
    if(p.cavitesTaille!=null) s+=mesureDuPlusGrand(q.pluriel, p.cavitesTaille, true, 0);
    if(p.cavitesContenu) s+=p.cavitesContenu==='anecho'?', à contenu anéchogène':', à contenu échogène';
    les.push(s);
  }
  if(p.paraprostatique) les.push('kyste paraprostatique');
  if(p.mineralisations) les.push('minéralisations '+
    (p.mineralisations==='grossieres'?'grossières':'punctiformes'));
  if(les.length) L.push(M('Présence '+de(les[0])+(les.length>1?' ; '+les.slice(1).join(' ; '):''),true)+'.');
  else L.push('Pas de cavité ni de minéralisation visualisée.');

  const per=[];
  if(p.graisse) per.push('graisse péri-prostatique hyperéchogène');
  if(p.trigone) per.push('continuité lésionnelle avec le trigone vésical');
  if(per.length) L.push('Péri-prostatique : '+M(per.join(', '),true)+'.');
  else L.push('Espace péri-prostatique sans particularité.');

  return 'PROSTATE\n'+L.join('\n');
}

// La castration est le discriminant : l'HBP est androgéno-dépendante et régresse,
// la tumeur non. Un même signe ne vaut donc pas la même chose selon le statut.
function syntheseProstate(items, lignes){
  const p=S.prostate;
  if(!prostatePertinente()) return;
  if(p.nonVu){
    if(S.statut!=='castre'){
      items.push({t:'prostate non visualisée', c:''});
      lignes.push('Prostate non visualisée chez un mâle non castré : glande possiblement '+
        'intrapelvienne.');
    }
    return;
  }
  if(!prostateExaminee()) return;

  const castre = S.statut==='castre';
  const esp = S.espece==='chat' ? 'chat' : 'chien';
  const grande = p.taille==='grande';
  const suspecte = p.symetrie==='asymetrique' || p.structure==='heterogene' ||
    p.contours==='irreguliers' || p.contours==='bosseles';

  // Chez le castré, tout ce qui ressemble à de l'hyperplasie n'en est pas
  const alerteCastre = castre && (grande || p.mineralisations);
  if(alerteCastre){
    items.push({t:'prostate anormale chez un castré', c:'alerte'});
    lignes.push('Prostate '+(grande?'augmentée':'minéralisée')+' chez un '+esp+' castré : '+
      'l’hyperplasie bénigne régresse après castration et n’explique donc pas ce tableau. '+
      'CARCINOME PROSTATIQUE EN PREMIER LIEU. Source résiduelle d’androgènes également '+
      'à écarter — testicule ectopique, tumeur surrénalienne ou testiculaire.');
  } else if(!castre && grande && !suspecte && !p.mineralisations && !p.cavites){
    items.push({t:'prostate augmentée, aspect régulier', c:''});
    lignes.push('Prostate augmentée, symétrique et homogène chez un mâle entier : '+
      'hyperplasie bénigne, quasi constante avec l’âge. Un aspect régulier n’exclut pas '+
      'une tumeur débutante.');
  }
  if(suspecte && !alerteCastre){
    items.push({t:'prostate d’aspect suspect', c:'alerte'});
    lignes.push('Prostate asymétrique, hétérogène ou à contours irréguliers : '+
      'ce n’est plus le profil d’une hyperplasie simple — carcinome ou prostatite '+
      'chronique.'+
      (castre?' Chez un '+esp+' castré, où l’hyperplasie ne peut plus servir '+
        'd’explication, cet aspect pèse encore plus lourd en faveur de la tumeur.':''));
  }
  if(p.cavites && p.cavitesContenu==='echogene'){
    items.push({t:'abcès prostatique suspecté', c:'alerte'});
    lignes.push('Cavité prostatique à contenu échogène : abcès prostatique, surtout sur un '+
      'animal fébrile et douloureux.');
  }
  if(p.trigone){
    items.push({t:'envahissement du trigone', c:'alerte'});
    lignes.push('Continuité entre la lésion prostatique et le trigone vésical : '+
      'extension locale, en faveur du carcinome.');
  }
  if(p.graisse && !p.cavites){
    items.push({t:'stéatite péri-prostatique', c:''});
    lignes.push('Graisse péri-prostatique hyperéchogène : réaction inflammatoire de '+
      'voisinage — prostatite, abcès débutant ou processus infiltrant.');
  }
}

// ===================== UTÉRUS ET OVAIRES =====================
// Pas de norme fixe exploitable : le diamètre utérin dépend du gabarit et
// surtout de la parité, une multipare ayant durablement un utérus plus large
// sans rien de pathologique. L'outil reste donc descriptif — l'appréciation
// portée à l'écho vaut plus qu'un chiffre, et c'est elle qui remonte.
// Ce qui est fiable et binaire : un utérus normal hors gestation N'A PAS de
// liquide dans sa lumière.
const REPERE_GENITAL = {
  chien:{uterus:'corps 5 à 10 mm chez une nullipare de 11 kg', ovaire:'15 × 7 × 5 mm chez une chienne de 11 kg'},
  chat: {uterus:'3 à 4 mm de largeur',                          ovaire:'8 à 9 mm de longueur'}
};

function uterusVide(){

    taille:'normale',            // petit | normale | augmente
    paroi:'fine',                // fine | epaissie
    cornes:'symetriques',        // symetriques | asymetriques
    corps:null, corneD:null, corneG:null,
    contenu:new Set(),           // vide = lumière sans contenu liquidien
    hgk:false,
    moignon:false, moignonTaille:null, moignonContenu:null
  };
}
function ovaireVide(){
  return {
    // « Non visualisé » est l'état NORMAL en anœstrus : un ovaire au repos est
    // petit, homogène, et se confond avec l'intestin.
    vu:false,
    L:null, H:null,
    taille:'normale',
    follicules:false, folliculesQte:null, folliculesNb:null, folliculesTaille:null,
    corpsJaunes:false, corpsJaunesNb:null,
    kystes:false, kystesQte:null, kystesNb:null, kystesTaille:null,
    masse:false, masseL:null, masseH:null, masseEcho:null, masseHomo:null,
    masseContours:null, masseVasc:null,
    epanchement:false
  };
}

function genitalPertinent(){ return S.sexe==='femelle'; }
function uterusSaisi(){
  const u=S.uterus;
  if(u.nonVu) return false;
  return u.taille!=='normale' || u.paroi!=='fine' || u.cornes!=='symetriques' ||
    u.corps!=null || u.corneD!=null || u.corneG!=null ||
    u.contenu.size || u.hgk || u.moignon;
}
function ovaireSaisi(cote){
  const o=S['ov'+cote];
  return o.vu || o.follicules || o.corpsJaunes || o.kystes || o.masse || o.epanchement;
}
function genitalExamine(){
  if(!genitalPertinent()) return false;
  return S.uterus.nonVu || uterusSaisi() || ovaireSaisi('D') || ovaireSaisi('G');
}
function anomalieGenitale(){
  if(!genitalExamine()) return false;
  const u=S.uterus;
  if(!u.nonVu){
    if(u.taille!=='normale' || u.paroi!=='fine' || u.cornes!=='symetriques') return true;
    if(u.contenu.size || u.hgk || u.moignon) return true;
  }
  if(S.statut==='sterilisee' && !u.nonVu && uterusSaisi()) return true;
  return ['D','G'].some(c=>{
    const o=S['ov'+c];
    if(!ovaireSaisi(c)) return false;
    if(S.statut==='sterilisee') return true;    // tout reste ovarien est anormal
    return o.taille!=='normale' || o.kystes || o.masse || o.epanchement;
  });
}

  const lh=document.createElement('div'); lh.className='ligne';
  interrupteur(lh,'Hyperplasie glandulo-kystique',()=>u.hgk,x=>u.hgk=x,
    'Petites logettes anéchogènes de 1 à 4 mm dans l’endomètre — le lit du pyomètre');
  b2.appendChild(lh);

  if(ster){

    const lmo=document.createElement('div'); lmo.className='ligne';
    interrupteur(lmo,'Moignon visualisé',()=>u.moignon,x=>u.moignon=x,

        {v:'echogene',l:'Liquidien échogène'}],

function phraseUterus(){
  const u=S.uterus;
  if(!genitalPertinent() || !genitalExamine()) return null;
  if(u.nonVu) return 'UTÉRUS\n'+(S.statut==='sterilisee'
    ? 'Non visualisé, conforme au statut stérilisé.'
    : 'Non visualisé.');
  const L=[];
  /* Chez une stérilisée dont on n'a retrouvé qu'un moignon, decrire « uterus de
     taille normale, paroi fine » reviendrait a decrire un organe absent. */
  const moignonSeul = S.statut==='sterilisee' && u.moignon &&
    u.taille==='normale' && u.paroi==='fine' && u.cornes==='symetriques' &&
    !u.contenu.size && !u.hgk && u.corps==null && u.corneD==null && u.corneG==null;
  const APP={petit:'de petite taille', normale:'de taille normale', augmente:'de taille augmentée'};
  const ano = u.taille==='augmente';
  const d=[];
  if(u.corps!=null) d.push('corps '+nb(u.corps)+' mm');
  if(u.corneD!=null) d.push('corne droite '+nb(u.corneD)+' mm');
  if(u.corneG!=null) d.push('corne gauche '+nb(u.corneG)+' mm');
  const uterusNormal = !u.moignon && u.taille==='normale' && u.paroi==='fine' &&
    u.cornes==='symetriques' && !u.contenu.size && !u.hgk && S.statut!=='sterilisee';
  if(uterusNormal){
    L.push('Examen dans les limites de la normale.'+
      (d.length?' Mesures : '+V(d.join(', '))+'.':''));
  } else if(!moignonSeul)
    L.push('Utérus '+Q(APP[u.taille],ano)+
      (d.length?' ('+(ano? d.join(', ') : V(d.join(', ')))+')':'')+'.');

  if(u.cornes==='asymetriques')
    L.push('Cornes '+M('asymétriques',true)+' — atteinte segmentaire.');

  const cont=[];
  if(u.contenu.has('anecho')) cont.push('liquidien anéchogène');
  if(u.contenu.has('echogene')) cont.push('liquidien échogène, corpusculaire');
  if(u.contenu.has('gaz')) cont.push('gazeux');
  if(cont.length) L.push('Lumière à contenu '+
    M(cont.length>2 ? cont.slice(0,-1).join(', ')+' et '+cont[cont.length-1]
                    : cont.join(' et '), true)+'.');
  else if(!moignonSeul && !uterusNormal) L.push('Lumière sans contenu liquidien.');

  if(uterusNormal) L.push('Lumière sans contenu liquidien, paroi fine.');
  else if(!moignonSeul) L.push('Paroi '+(u.paroi==='epaissie' ? M('épaissie',true) : 'fine')+'.');
  if(u.hgk) L.push(M('Logettes anéchogènes intra-endométriales compatibles avec une '+
    'hyperplasie glandulo-kystique',true)+'.');

  if(u.moignon){
    let s='Moignon utérin '+M('visualisé',true);
    if(u.moignonTaille!=null) s+=', mesuré à '+nb(u.moignonTaille,0)+' mm';
    if(u.moignonContenu==='vide') s+=', sans contenu';
    else if(u.moignonContenu) s+=', à '+M('contenu liquidien '+
      (u.moignonContenu==='anecho'?'anéchogène':'échogène'),true);
    L.push(s+'.');
  }
  return 'UTÉRUS\n'+L.join('\n');
}

function phraseOvaire(cote){
  const o=S['ov'+cote];
  if(!genitalPertinent() || !genitalExamine()) return null;
  const nom='OVAIRE '+(cote==='D'?'DROIT':'GAUCHE');
  const ster = S.statut==='sterilisee';
  if(!o.vu){
    if(ster) return nom+'\nNon visualisé, conforme au statut stérilisé.';
    const C=S.cycle;
    if(C==='anoestrus' || C==null) return nom+'\nNon visualisé — habituel en anœstrus.';
    if(C==='dioestrus' || C==='oestrus' || C==='prooestrus')
      return nom+'\nNon visualisé, alors que la phase déclarée le rendrait '+
        'habituellement repérable : limite d’examen à mentionner.';
    return nom+'\nNon visualisé.';
  }
  const L=[];
  const APP={petit:'de petite taille', normale:'de taille normale', augmente:'de taille augmentée'};
  const ano = o.taille==='augmente' || ster;
  const d=[o.L,o.H].filter(x=>x!=null);
  const dimO=d.map(x=>nb(x)).join(' × ')+' mm';
  const anoO=o.taille==='augmente';
  L.push('Ovaire '+Q(APP[o.taille],anoO)+
    (d.length?' ('+(anoO? dimO : V(dimO))+')':'')+
    (ster?' — '+M('visualisé malgré le statut stérilisé',true):'')+'.');

  const st=[];
  if(o.follicules){
    const q=libelleQuantite(o, 'follicules', 'follicule', false);
    let s=q.t;
    if(o.folliculesTaille!=null) s+=mesureDuPlusGrand(q.pluriel, o.folliculesTaille, false, 0);
    st.push(s);
  }
  if(o.corpsJaunes) st.push('corps jaune'+((o.corpsJaunesNb||1)>1?'x':'')+
    (o.corpsJaunesNb!=null?' au nombre de '+o.corpsJaunesNb:''));
  if(o.kystes){
    const q=libelleQuantite(o, 'kystes', 'kyste', false);
    let s=q.t;
    if(o.kystesTaille!=null) s+=mesureDuPlusGrand(q.pluriel, o.kystesTaille, false, 0);
    st.push(s);
  }
  if(st.length) L.push('Présence '+de(st[0])+(st.length>1?' ; '+st.slice(1).join(' ; '):'')+'.');
  else L.push('Pas de follicule, de corps jaune ni de kyste visualisé.');

  if(o.masse){
    const dm=[o.masseL,o.masseH].filter(x=>x!=null);
    let s='Masse ovarienne';
    if(dm.length) s+=' mesurant '+dm.map(x=>nb(x,0)).join(' × ')+' mm';
    const q=[];
    if(o.masseEcho) q.push(MOT[o.masseEcho]);
    if(o.masseHomo) q.push(MOT[o.masseHomo]);
    if(o.masseContours) q.push('à contours '+MOT[o.masseContours]);
    if(o.masseVasc) q.push(MOT[o.masseVasc]);
    if(q.length) s+=', '+q.join(', ');
    L.push(M(s,true)+'.');
  }
  if(o.epanchement) L.push('Épanchement '+M('présent au contact',true)+'.');
  return nom+'\n'+L.join('\n');
}

// La stérilisation est ici le discriminant, comme la castration pour la prostate.
function syntheseGenitale(items, lignes){
  if(!genitalExamine()) return;
  const u=S.uterus, ster = S.statut==='sterilisee';
  const dioestrus = S.cycle==='dioestrus';
  const liqEcho = u.contenu.has('echogene');
  const liqAnecho = u.contenu.has('anecho');

  if(!u.nonVu && u.contenu.has('gaz')){
    items.push({t:'gaz intra-utérin', c:'alerte'});
    lignes.push('GAZ INTRA-UTÉRIN : mort fœtale avec emphysème, ou métrite gangreneuse à '+
      'germes anaérobies. Une manœuvre utérine récente peut aussi introduire de l’air.');
  }
  if(!u.nonVu && liqEcho){
    items.push({t:'pyomètre suspecté', c:'alerte'});
    lignes.push('Contenu utérin liquidien échogène'+
      (u.paroi==='epaissie'?' avec paroi épaissie':'')+
      (dioestrus?', en diœstrus':'')+' : pyomètre au premier plan.');
  } else if(!u.nonVu && liqAnecho && u.paroi==='fine'){
    items.push({t:'contenu utérin anéchogène', c:''});
    lignes.push('Contenu utérin liquidien anéchogène à paroi fine : hydromètre ou '+
      'mucomètre, avec un tableau général conservé par opposition au pyomètre.');
  }
  if(!u.nonVu && u.cornes==='asymetriques' && (liqEcho||liqAnecho)){
    items.push({t:'atteinte segmentaire', c:'alerte'});
    lignes.push('Distension d’une seule corne : atteinte segmentaire — pyomètre ou '+
      'hydromètre d’une corne. La corne saine peut faire croire à tort à un utérus normal.');
  }
  if(!u.nonVu && u.hgk && !liqEcho){
    items.push({t:'hyperplasie glandulo-kystique', c:''});
    lignes.push('Hyperplasie glandulo-kystique de l’endomètre : lit du pyomètre, sous '+
      'imprégnation progestéronique.');
  }
  // Chez la stérilisée, tout reliquat génital est une information forte
  if(ster && !u.nonVu && uterusSaisi()){
    items.push({t:'utérus visualisé chez une stérilisée', c:'alerte'});
    lignes.push('Structure utérine retrouvée chez une femelle stérilisée : moignon, '+
      'granulome du moignon, ou ovario-hystérectomie incomplète.'+
      (u.moignonContenu && u.moignonContenu!=='vide'
        ? ' Le contenu liquidien signe un pyomètre du moignon, lequel suppose du tissu '+
          'ovarien résiduel pour l’entretenir.'
        : ''));
  }
  ['D','G'].forEach(c=>{
    const o=S['ov'+c];
    if(!ovaireSaisi(c)) return;
    const lib = c==='D'?'droit':'gauche';
    if(ster){
      items.push({t:'reste ovarien — '+lib, c:'alerte'});
      lignes.push('Structure ovarienne '+(c==='D'?'droite':'gauche')+' chez une femelle '+
        'stérilisée : SYNDROME DU RESTE OVARIEN, d’autant plus si des chaleurs sont '+
        'rapportées.');
    }
    if(o.masse){
      items.push({t:'masse ovarienne — '+lib, c:'alerte'});
      lignes.push('Masse ovarienne '+(c==='D'?'droite':'gauche')+
        (o.epanchement?' avec épanchement au contact':'')+
        ' : tumeur de la granulosa en premier lieu, puis dysgerminome et '+
        'cystadénocarcinome.'+(o.epanchement?' L’épanchement fait craindre une '+
        'carcinomatose.':'')+' Les tumeurs de la granulosa sécrètent, d’où des chaleurs '+
        'persistantes ou une hyperplasie endométriale associée.');
    } else if(o.kystes){
      items.push({t:'kystes ovariens — '+lib, c:''});
      lignes.push('Kyste ovarien '+lib+' : folliculaire, il sécrète des œstrogènes et '+
        'entretient des chaleurs persistantes, avec risque d’hyperplasie endométriale et '+
        'd’aplasie médullaire ; lutéal, il maintient un diœstrus.');
    }
    if(!ster && o.follicules && S.cycle==='anoestrus'){
      items.push({t:'follicules en anœstrus déclaré — '+lib, c:''});
      lignes.push('Follicules visibles alors que la phase est notée anœstrus : phase mal '+
        'estimée, ou kystes.');
    }
  });
  if(!u.nonVu && u.taille==='augmente' && (S.ovD.epanchement||S.ovG.epanchement)){
    items.push({t:'rupture utérine à écarter', c:'alerte'});
    lignes.push('Utérus augmenté et épanchement abdominal : rupture utérine et péritonite '+
      'à écarter.');
  }
}

// ===================== TESTICULES =====================
// Pas de norme chiffrée utilisable : la taille suit le gabarit. Ce qui parle,
// c'est la COMPARAISON des deux côtés — une asymétrie est le premier signe
// d'une tumeur testiculaire, bien avant toute valeur absolue.
function testiculeVide(){
  return {
    vu:false,
    position:'scrotal',
    L:null, H:null,
    taille:'normale',
    // Pré-cochés sur la valeur normale ; aucun ne compte comme une saisie.
    echo:'homogene', mediastin:'visible', epididyme:'normal',
    masse:false, masseL:null, masseH:null, masseEcho:null, masseHomo:null,
    masseContours:null, masseVasc:null,
    calcifications:false, hydrocele:false
  };
}
function testiculePertinent(){ return S.sexe==='male'; }
// Chez le mâle castré les testicules ne sont plus là — sauf un ectopique
// retenu, qui existe et qu'il faut pouvoir décrire. On replie donc au lieu de
// masquer : un clic suffit à rouvrir, rien n'est rendu inaccessible.
function testiculesReplies(){
  if(!testiculePertinent()) return false;
  if(S.testiculesDeplies) return false;
  if(testiculeSaisi('G') || testiculeSaisi('D')) return false;
  if(S.tsG.nonVu || S.tsD.nonVu) return false;
  return S.statut==='castre';
}
function rendreTesticulesReplies(){
  const box=document.createElement('div'); box.className='rein prostate-repliee';
  const t=document.createElement('div'); t.className='rein-titre';
  t.innerHTML='<span>Testicules</span>';
  const b=document.createElement('button'); b.type='button'; b.className='pill mini';
  b.textContent='Déplier';
  b.title='Animal castré : à ouvrir si vous cherchez un testicule ectopique retenu';
  b.addEventListener('click',()=>{ S.testiculesDeplies=true; rendre(); });
  t.appendChild(b); box.appendChild(t);
  const a=document.createElement('p'); a.className='aide'; a.style.margin='0';
  a.textContent='Animal castré : rien n’en sera dit dans le compte-rendu. '+
    'À déplier pour décrire un testicule ectopique retenu.';
  box.appendChild(a);
  return box;
}
function testiculeSaisi(cote){
  const t=S['ts'+cote];
  return t.vu || t.masse || t.calcifications || t.hydrocele;
}
function testiculesExamines(){
  return testiculePertinent() && (testiculeSaisi('D') || testiculeSaisi('G'));
}
function anomalieTesticule(cote){
  const t=S['ts'+cote];
  if(!testiculeSaisi(cote)) return false;
  if(S.statut==='castre') return true;          // tout reliquat est anormal
  if(t.position!=='scrotal') return true;
  if(t.taille!=='normale') return true;
  if(t.echo!=='homogene' || t.mediastin!=='visible' || t.epididyme!=='normal') return true;
  if(t.masse || t.calcifications || t.hydrocele) return true;
  return false;
}
function anomalieTesticules(){
  if(!testiculesExamines()) return false;
  // Chez un entier, un seul testicule retrouvé fait suspecter une cryptorchidie.
  if(S.statut!=='castre' && testiculeSaisi('D')!==testiculeSaisi('G')) return true;
  return anomalieTesticule('D') || anomalieTesticule('G');
}

function phraseTesticule(cote){
  const t=S['ts'+cote];
  if(!testiculePertinent() || !testiculesExamines()) return null;
  const nom='TESTICULE '+(cote==='D'?'DROIT':'GAUCHE');
  const ster = S.statut==='castre';
  if(!t.vu) return nom+'\n'+(ster
    ? 'Non visualisé, conforme au statut castré.'
    : 'Non visualisé en position scrotale.');

  const L=[];
  const POS={scrotal:'en position scrotale', inguinal:'en position inguinale',
    abdominal:'en position abdominale'};
  const APP={petit:'de petite taille', normale:'de taille normale', augmente:'de taille augmentée'};
  const d=[t.L,t.H].filter(x=>x!=null);
  const dim=d.map(x=>nb(x,0)).join(' × ')+' mm';
  const anoT=t.taille!=='normale', anoP=t.position!=='scrotal';

  if(!anomalieTesticule(cote)){
    L.push('Examen dans les limites de la normale.'+
      (d.length?' Testicule de '+V(dim)+',':' Testicule')+' '+POS[t.position]+'.');
  } else {
    let s='Testicule '+Q(APP[t.taille],anoT);
    if(d.length) s+=' ('+(anoT? M(dim,true) : V(dim))+')';
    s+=', '+Q(POS[t.position],anoP);
    L.push(s+'.');
  }

  const m=[];
  m.push(t.echo==='homogene' ? 'parenchyme homogène' : M('parenchyme hétérogène',true));
  m.push(t.mediastin==='visible' ? 'médiastin testiculaire visible'
    : M('médiastin testiculaire non identifiable',true));
  let ligne=m.join(', ');
  ligne=ligne.replace(/^(<mark[^>]*>)?([a-zà-ÿ])/, function(x,b,c){ return (b||'')+c.toUpperCase(); });
  L.push(ligne+'.');

  if(t.masse){
    const dm=[t.masseL,t.masseH].filter(x=>x!=null);
    let s='Masse testiculaire';
    if(dm.length) s+=' mesurant '+dm.map(x=>nb(x,0)).join(' × ')+' mm';
    const q=[];
    if(t.masseEcho) q.push(MOT[t.masseEcho]);
    if(t.masseHomo) q.push(MOT[t.masseHomo]);
    if(t.masseContours) q.push('à contours '+MOT[t.masseContours]);
    if(t.masseVasc) q.push(MOT[t.masseVasc]);
    if(q.length) s+=', '+q.join(', ');
    L.push(M(s,true)+'.');
  }
  if(t.calcifications) L.push(M('Calcifications intra-testiculaires',true)+'.');
  if(!t.masse && !t.calcifications) L.push('Pas de masse ni de calcification visualisée.');

  const fin=[];
  fin.push(t.epididyme==='augmente' ? M('épididyme augmenté',true) : 'épididyme non augmenté');
  fin.push(t.hydrocele ? M('présence d’une hydrocèle',true) : 'pas d’hydrocèle');
  let der=fin.join(', ');
  der=der.replace(/^(<mark[^>]*>)?([a-zà-ÿ])/, function(x,b,c){ return (b||'')+c.toUpperCase(); });
  L.push(der+'.');

  return nom+'\n'+L.join('\n');
}

// Écart entre les deux testicules : c'est la comparaison qui révèle la tumeur,
// pas la mesure absolue.
function phraseEcartTesticules(){
  const D=S.tsD, G=S.tsG;
  if(!testiculesExamines() || !D.vu || !G.vu) return null;
  if(D.L==null || G.L==null) return null;
  const mm=Math.abs(D.L-G.L);
  const pc=mm/Math.max(D.L,G.L)*100;
  const ano=pc>=25;
  const chiffre=nb(mm,0)+' mm ('+pc.toFixed(0)+' %)';
  return '§Écart de '+(ano? M(chiffre,true) : V(chiffre))+' entre les deux testicules : '+
    Q(ano?'asymétrie significative':'symétrie conservée', ano)+'.';
}

function syntheseTesticules(items, lignes){
  if(!testiculesExamines()) return;
  const castre = S.statut==='castre';

  if(castre){
    items.push({t:'testicule retrouvé chez un castré', c:'alerte'});
    lignes.push('Tissu testiculaire retrouvé chez un mâle castré : castration incomplète '+
      'ou testicule ectopique laissé en place. Explique une prostate non involuée et '+
      'des comportements sexuels persistants.');
    return;
  }
  // Un seul testicule retrouvé chez un entier
  if(testiculeSaisi('D')!==testiculeSaisi('G')){
    const abs = testiculeSaisi('D') ? 'gauche' : 'droit';
    items.push({t:'testicule '+abs+' non retrouvé', c:'alerte'});
    lignes.push('Testicule '+abs+' non retrouvé en position scrotale : cryptorchidie. '+
      'Le testicule ectopique porte un risque tumoral nettement supérieur, et '+
      'un risque de torsion quand il est abdominal.');
  }
  ['D','G'].forEach(c=>{
    const t=S['ts'+c];
    if(!testiculeSaisi(c) || !t.vu) return;
    const lib = c==='D'?'droit':'gauche';
    if(t.position!=='scrotal'){
      items.push({t:'testicule '+lib+' ectopique', c:'alerte'});
      lignes.push('Testicule '+lib+' en position '+
        (t.position==='inguinal'?'inguinale':'abdominale')+' : cryptorchidie, avec un '+
        'risque tumoral nettement majoré'+
        (t.position==='abdominal'?' et un risque de torsion':'')+'.');
    }
    if(t.masse || t.echo==='heterogene' || t.taille==='augmente'){
      items.push({t:'lésion testiculaire — '+lib, c:'alerte'});
      lignes.push('Testicule '+lib+' '+(t.masse?'porteur d’une masse':'augmenté ou hétérogène')+
        ' : tumeur testiculaire — sertolinome, séminome ou tumeur à cellules de Leydig. '+
        'Le sertolinome sécrète des œstrogènes, d’où féminisation, alopécie symétrique '+
        'et aplasie médullaire ; l’atrophie du testicule controlatéral en est un argument.');
    }
    if(t.epididyme==='augmente'){
      items.push({t:'épididyme augmenté — '+lib, c:''});
      lignes.push('Épididyme '+lib+' augmenté : orchi-épididymite, ou extension d’un '+
        'processus testiculaire. Chez le chien, la brucellose est à écarter.');
    }
    if(t.hydrocele){
      items.push({t:'hydrocèle — '+lib, c:''});
      lignes.push('Hydrocèle '+lib+' : épanchement dans la vaginale — inflammation locale, '+
        'torsion, ou hypoprotéinémie dans un contexte général.');
    }
  });
}

// ===================== FOIE =====================
// Aucune mesure de taille exploitable. La seule règle fiable est un ORDRE :
//   rate > foie > cortex rénal, chez le chien comme chez le chat.
// L'outil fait donc saisir les deux comparaisons, et c'est leur concordance qui
// décide. Un foie plus échogène que la rate ET que le rein est hyperéchogène ;
// un foie iso ou moins échogène que le rein est hypoéchogène.
const REF_PORTE = {min:0.71, max:1.25};   // veine porte / aorte, diamètres maximaux

function foieVide(){
  return {
    nonVu:false,
    taille:'normale',          // petit | normale | augmente
    bords:'aigus',             // aigus | arrondis
    // Pré-cochés sur la normale, qui n'est PAS « iso » : le foie est
    // normalement moins échogène que la rate et plus que le cortex rénal.
    vsRate:'moins', vsRein:'plus',
    structure:'homogene',      // homogene | heterogene | reticule
    contours:'reguliers',      // reguliers | irreguliers | bosseles
    nodules:false, nodulesQte:null, nodulesNb:null, nodulesTaille:null, nodulesEcho:null,
    masse:false, masseL:null, masseH:null, masseEcho:null, masseHomo:null,
    masseContours:null, masseVasc:null,
    kystes:false, kystesQte:null, kystesNb:null, kystesTaille:null,
    susHepatiques:'normales',  // normales | dilatees
    porte:null,                // diamètre max de la veine porte, en mm
    epanchement:false, graisse:false
  };
}
// Échogénicité globale déduite des deux comparaisons.
function echoFoie(){
  const f=S.foie;
  const hyper = (f.vsRate==='plus' || f.vsRate==='iso') && f.vsRein==='plus' && f.vsRate!=='moins';
  const hypo  = f.vsRein!=='plus' || f.vsRate==='moins' && f.vsRein==='moins';
  if(f.vsRate==='moins' && f.vsRein==='plus') return 'normale';
  if(f.vsRate==='plus' || (f.vsRate==='iso' && f.vsRein==='plus')) return 'hyper';
  if(f.vsRein==='moins' || f.vsRein==='iso') return 'hypo';
  return 'normale';
}
// Rapport veine porte / aorte, sur les diamètres maximaux.
function rapportPorte(){
  const f=S.foie;
  if(f.porte==null || S.aorte==null || S.aorte<=0) return null;
  const r=f.porte/S.aorte;
  return {valeur:r, verdict: r<REF_PORTE.min?'bas':(r>REF_PORTE.max?'haut':'normal')};
}
function foieExamine(){
  const f=S.foie;
  if(f.nonVu) return false;
  return f.taille!=='normale' || f.bords!=='aigus' || echoFoie()!=='normale' ||
    f.structure!=='homogene' || f.contours!=='reguliers' ||
    f.nodules || f.masse || f.kystes || f.susHepatiques!=='normales' ||
    f.porte!=null || f.epanchement || f.graisse;
}
function anomalieFoie(){
  const f=S.foie;
  if(!foieExamine()) return false;
  if(f.taille!=='normale' || f.bords!=='aigus') return true;
  if(echoFoie()!=='normale') return true;
  if(f.structure!=='homogene' || f.contours!=='reguliers') return true;
  if(f.nodules || f.masse || f.kystes) return true;
  if(f.susHepatiques!=='normales' || f.epanchement || f.graisse) return true;
  const rp=rapportPorte();
  if(rp && rp.verdict!=='normal') return true;
  return false;
}

     ['Structure','masseHomo',[{v:'homogene',l:'Homogène'},{v:'heterogene',l:'Hétérogène'},
        {v:'cavitaire',l:'Cavitaire / nécrosée'}]],
     ['Contours','masseContours',[{v:'nets',l:'Nets'},{v:'flous',l:'Flous / infiltrants'}]],
     ['Vascularisation','masseVasc',[{v:'absente',l:'Absente'},
        {v:'peripherique',l:'Périphérique'},{v:'centrale',l:'Centrale / anarchique'}]]
    ].forEach(([nom,cle,opts])=>{
      const l=document.createElement('div'); l.className='ligne';
      l.innerHTML='<span class="nom">'+nom+'</span>';
      pastilles(l,opts,()=>f[cle],x=>f[cle]=x,null,defautDe('foie',cle));
      sm.appendChild(l);
    });
  } else { ['masseL','masseH','masseEcho','masseHomo','masseContours','masseVasc']
    .forEach(k=>f[k]=null); }

  const b4=bloc(box,'Vascularisation et périphérie');
  const lv=document.createElement('div'); lv.className='ligne';
  lv.innerHTML='<span class="nom">Veines sus-hépatiques</span>';
  pastilles(lv,[{v:'normales',l:'Normales'},
    {v:'dilatees',l:'Dilatées',t:'Congestion passive : insuffisance cardiaque droite, tamponnade'}],
    ()=>f.susHepatiques,x=>f.susHepatiques=x,['dilatees'],'normales');
  b4.appendChild(lv);
  const lp=champ(b4,'Veine porte',()=>f.porte,x=>f.porte=x,'mm','0.1',true);
  const rp=rapportPorte();
  if(rp) verdictTag(lp,'porte/aorte '+nb(rp.valeur,2)+' (0,71–1,25)',
    rp.verdict==='normal'?'normal':(rp.verdict==='bas'?'bas':'haut'));
  else if(f.porte!=null) verdictTag(lp,'renseigner l’aorte','vide');
  const lpe=document.createElement('div'); lpe.className='ligne';
  interrupteur(lpe,'Épanchement péri-hépatique',()=>f.epanchement,x=>f.epanchement=x);
  interrupteur(lpe,'Graisse hyperéchogène',()=>f.graisse,x=>f.graisse=x);
  b4.appendChild(lpe);

  blocImages(box,'foie');
  return box;
}

function phraseFoie(){
  const f=S.foie;
  if(f.nonVu) return 'FOIE\nNon exploré.';
  if(!foieExamine()) return null;
  const L=[];
  const TAILLE={petit:'de taille diminuée', normale:'de taille normale', augmente:'de taille augmentée'};
  const anoT=f.taille!=='normale';
  const eg=echoFoie();

  if(!anomalieFoie()){
    L.push('Examen dans les limites de la normale. Foie de taille normale, à bords aigus, '+
      'moins échogène que la rate et plus échogène que le cortex rénal.');
  } else {
    L.push('Foie '+Q(TAILLE[f.taille],anoT)+', à bords '+
      Q(f.bords==='aigus'?'aigus':'arrondis', f.bords!=='aigus')+'.');
    const e=[];
    e.push(f.vsRate==='moins' ? 'moins échogène que la rate'
      : M(f.vsRate==='iso'?'isoéchogène à la rate':'plus échogène que la rate',true));
    e.push(f.vsRein==='plus' ? 'plus échogène que le cortex rénal'
      : M(f.vsRein==='iso'?'isoéchogène au cortex rénal':'moins échogène que le cortex rénal',true));
    let s='Parenchyme '+e.join(', ');
    if(eg!=='normale') s+=' — '+M('foie globalement '+(eg==='hyper'?'hyperéchogène':'hypoéchogène'),true);
    L.push(s+'.');
    const STR={homogene:'homogène', heterogene:'hétérogène', reticule:'d’aspect réticulé'};
    const CTR={reguliers:'réguliers', irreguliers:'irréguliers', bosseles:'bosselés'};
    L.push('Structure '+Q(STR[f.structure], f.structure!=='homogene')+
      ', contours '+Q(CTR[f.contours], f.contours!=='reguliers')+'.');
  }

  const les=[];
  if(f.nodules){
    const q=libelleQuantite(f, 'nodules', 'nodule', false);
    let s=q.t;
    if(f.nodulesTaille!=null) s+=mesureDuPlusGrand(q.pluriel, f.nodulesTaille, false, 0);
    if(f.nodulesEcho) s+=', '+accordEcho(f.nodulesEcho, q.pluriel);
    les.push(s);
  }
  if(f.kystes){
    const q=libelleQuantite(f, 'kystes', 'kyste', false);
    let s=q.t;
    if(f.kystesTaille!=null) s+=mesureDuPlusGrand(q.pluriel, f.kystesTaille, false, 0);
    les.push(s);
  }
  if(les.length) L.push(M('Présence '+de(les[0])+(les.length>1?' ; '+les.slice(1).join(' ; '):''),true)+'.');
  else if(!f.masse) L.push('Pas de nodule ni de kyste visualisé.');

  if(f.masse){
    const d=[f.masseL,f.masseH].filter(x=>x!=null);
    let s='Masse hépatique';
    if(d.length) s+=' mesurant '+d.map(x=>nb(x,0)).join(' × ')+' mm';
    const q=[];
    if(f.masseEcho) q.push(MOT[f.masseEcho]);
    if(f.masseHomo) q.push(MOT[f.masseHomo]);
    if(f.masseContours) q.push('à contours '+MOT[f.masseContours]);
    if(f.masseVasc) q.push(MOT[f.masseVasc]);
    if(q.length) s+=', '+q.join(', ');
    L.push(M(s,true)+'.');
  }

  const rp=rapportPorte();
  const vasc=[];
  vasc.push(f.susHepatiques==='normales' ? 'veines sus-hépatiques normales'
    : M('veines sus-hépatiques dilatées',true));
  if(rp) vasc.push('rapport veine porte / aorte '+
    (rp.verdict==='normal'? V(nb(rp.valeur,2)) : M(nb(rp.valeur,2),true))+' (0,71–1,25)');
  let lv=vasc.join(', ');
  lv=lv.replace(/^(<mark[^>]*>)?([a-zà-ÿ])/, function(x,b,c){ return (b||'')+c.toUpperCase(); });
  L.push(lv+'.');

  const per=[];
  if(f.epanchement) per.push('épanchement péri-hépatique');
  if(f.graisse) per.push('graisse hyperéchogène');
  if(per.length) L.push('Péri-hépatique : '+M(per.join(', '),true)+'.');
  else L.push('Espace péri-hépatique sans particularité.');

  return 'FOIE\n'+L.join('\n');
}

// ===================== VÉSICULE BILIAIRE =====================
// Paroi : chat < 1 mm, au-delà bon prédicteur de maladie vésiculaire ; chien
// < 3 mm, seuil moins bien établi. Cholédoque : chez le chien il n'est
// normalement PAS visible — le voir suffit à dire qu'il est dilaté.
const REF_VB = { chien:{paroi:3.0, chol:3.0}, chat:{paroi:1.0, chol:4.0} };

function vbVide(){
  return {
    nonVu:false,
    distension:'normale',      // vide | normale | distendue
    paroi:null,
    doubleContour:false,
    contenu:new Set(),         // boue | calcul | gaz
    calculTaille:null,
    mucocele:false, mucoceleAspect:null,   // stellaire | kiwi
    rupture:false,
    choledoque:'non_vu',       // non_vu | visualise
    choledoqueDiam:null
  };
}
function paroiVB(){
  const v=S.vb, e=S.espece;
  if(!e || v.nonVu || v.paroi==null) return null;
  const max=REF_VB[e].paroi;
  return {valeur:v.paroi, max:max, verdict: v.paroi>max?'haut':'normal'};
}
function choledoqueVB(){
  const v=S.vb, e=S.espece;
  if(!e || v.nonVu || v.choledoque!=='visualise') return null;
  const max=REF_VB[e].chol;
  if(v.choledoqueDiam==null) return {diam:null, max:max, verdict:e==='chien'?'haut':null};
  return {diam:v.choledoqueDiam, max:max,
    verdict: v.choledoqueDiam>max ? 'haut' : (e==='chien'?'haut':'normal')};
}
function vbExaminee(){
  const v=S.vb;
  if(v.nonVu) return false;
  return v.distension!=='normale' || v.paroi!=null || v.doubleContour ||
    v.contenu.size || v.mucocele || v.rupture || v.choledoque==='visualise';
}
function anomalieVB(){
  const v=S.vb;
  if(!vbExaminee()) return false;
  const p=paroiVB();
  if(p && p.verdict==='haut') return true;
  if(v.doubleContour || v.mucocele || v.rupture) return true;
  if(v.contenu.has('calcul') || v.contenu.has('gaz')) return true;
  if(v.choledoque==='visualise') return true;
  if(v.distension==='distendue') return true;
  return false;
}

function rendreVB(){
  const v=S.vb;
  const box=document.createElement('div'); box.className='rein vb';
  const t=document.createElement('div'); t.className='rein-titre';
  t.innerHTML='<span>Vésicule biliaire</span>';
  const bnv=document.createElement('button'); bnv.type='button';
  bnv.className='pill mini'+(v.nonVu?' ano':'');
  bnv.setAttribute('aria-pressed', v.nonVu?'true':'false');
  bnv.textContent='Non visualisée';
  bnv.addEventListener('click',()=>{ v.nonVu=!v.nonVu; rendre(); });
  t.appendChild(bnv);
  box.appendChild(t);
  if(v.nonVu) return box;

  const b1=bloc(box,'Distension et paroi');
  const ld=document.createElement('div'); ld.className='ligne';
  ld.innerHTML='<span class="nom">Distension</span>';
  pastilles(ld,[{v:'vide',l:'Vide'},{v:'normale',l:'Normale'},
    {v:'distendue',l:'Distendue',t:'Jeûne prolongé, ou obstruction d’aval'}],
    ()=>v.distension,x=>v.distension=x,['distendue'],'normale');
  b1.appendChild(ld);
  const lp=champ(b1,'Paroi',()=>v.paroi,x=>v.paroi=x,'mm','0.1');
  const p=paroiVB();
  if(p) verdictTag(lp,'référence < '+nb(p.max)+' mm', p.verdict==='haut'?'haut':'normal');
  else if(S.espece) verdictTag(lp,'référence < '+nb(REF_VB[S.espece].paroi)+' mm','vide');
  const lc=document.createElement('div'); lc.className='ligne';
  interrupteur(lc,'Double contour',()=>v.doubleContour,x=>v.doubleContour=x,
    'Œdème pariétal, et non inflammation : hypoalbuminémie, insuffisance cardiaque droite, anaphylaxie');
  b1.appendChild(lc);

  const b2=bloc(box,'Contenu');
  const lco=document.createElement('div'); lco.className='ligne';
  [['boue','Boue biliaire','Très fréquente et souvent sans signification sur un animal par ailleurs normal'],
   ['calcul','Calcul(s)','Avec cône d’ombre'],
   ['gaz','Gaz','Cholécystite emphysémateuse, ou reflux duodénal']].forEach(([k,l,ti])=>{
    const b=document.createElement('button'); b.type='button';
    b.className='pill mini'+(v.contenu.has(k)?' ano':'');
    b.setAttribute('aria-pressed', v.contenu.has(k)?'true':'false');
    b.textContent=l; b.title=ti;
    b.addEventListener('click',()=>{ v.contenu.has(k)?v.contenu.delete(k):v.contenu.add(k); rendre(); });
    lco.appendChild(b);
  });
  b2.appendChild(lco);
  if(v.contenu.has('calcul')) champ(b2,'Plus grand calcul',()=>v.calculTaille,x=>v.calculTaille=x,'mm','1',true);
  else v.calculTaille=null;

  const lm=document.createElement('div'); lm.className='ligne';
  interrupteur(lm,'Mucocèle',()=>v.mucocele,x=>v.mucocele=x,
    'Contenu immobile organisé, ne se déplaçant pas au repositionnement');
  interrupteur(lm,'Perte de continuité pariétale',()=>v.rupture,x=>v.rupture=x,
    'Rupture vésiculaire : péritonite biliaire, urgence chirurgicale');
  b2.appendChild(lm);
  if(v.mucocele){
    const sm=sousBloc(b2,'Mucocèle',true);
    const la=document.createElement('div'); la.className='ligne';
    la.innerHTML='<span class="nom">Aspect</span>';
    pastilles(la,[{v:'stellaire',l:'Stellaire',t:'Forme précoce'},
      {v:'kiwi',l:'En kiwi',t:'Forme évoluée : risque de rupture plus élevé'}],
      ()=>v.mucoceleAspect,x=>v.mucoceleAspect=x,['stellaire','kiwi']);
    sm.appendChild(la);
  } else v.mucoceleAspect=null;

  const b3=bloc(box,'Canal cholédoque');
  const lch=document.createElement('div'); lch.className='ligne';
  lch.innerHTML='<span class="nom">Cholédoque</span>';
  pastilles(lch,[{v:'non_vu',l:'Non visualisé',
      t:S.espece==='chien'?'État normal : chez le chien il n’est pas visible':'Fréquent'},
    {v:'visualise',l:'Visualisé',
      t:S.espece==='chien'?'Le voir suffit à dire qu’il est dilaté':'Mesurer : référence ≤ 4 mm, obstruction au-delà de 5 mm'}],
    ()=>v.choledoque,x=>v.choledoque=x,['visualise'],'non_vu');
  b3.appendChild(lch);
  if(v.choledoque==='visualise'){
    const sc=sousBloc(b3,'Cholédoque visualisé',true);
    const lcd=champ(sc,'Diamètre',()=>v.choledoqueDiam,x=>v.choledoqueDiam=x,'mm','0.1');
    const c=choledoqueVB();
    if(c && c.diam!=null) verdictTag(lcd,'référence ≤ '+nb(c.max)+' mm',
      c.verdict==='haut'?'haut':'normal');
  } else v.choledoqueDiam=null;

  blocImages(box,'vb');
  return box;
}

function phraseVB(){
  const v=S.vb;
  if(v.nonVu) return 'VÉSICULE BILIAIRE\nNon visualisée.';
  if(!vbExaminee()) return null;
  const L=[];
  const DIST={vide:'vide', normale:'de distension normale', distendue:'distendue'};
  const p=paroiVB();

  if(!anomalieVB()){
    let s='Examen dans les limites de la normale. Vésicule '+DIST[v.distension];
    if(p) s+=', paroi de '+V(nb(p.valeur)+' mm')+' (référence < '+nb(p.max)+' mm)';
    L.push(s+'.');
  } else {
    L.push('Vésicule '+Q(DIST[v.distension], v.distension==='distendue')+'.');
    if(p) L.push('Paroi mesurée à '+(p.verdict==='haut'? M(nb(p.valeur)+' mm',true) : V(nb(p.valeur)+' mm'))+
      ' (référence < '+nb(p.max)+' mm) : '+
      Q(p.verdict==='haut'?'épaissie':'dans les limites de la normale', p.verdict==='haut')+'.');
    if(v.doubleContour) L.push(M('Double contour pariétal',true)+', en faveur d’un œdème.');
  }

  const cont=[];
  if(v.mucocele) cont.push('immobile et organisé'+
    (v.mucoceleAspect?', d’aspect '+(v.mucoceleAspect==='kiwi'?'en kiwi':'stellaire'):'')+
    ', compatible avec une mucocèle biliaire');
  if(v.contenu.has('boue')) cont.push('boue biliaire');
  if(v.contenu.has('calcul')) cont.push('calcul'+
    (v.calculTaille!=null?' mesurant '+nb(v.calculTaille,0)+' mm':'')+', avec cône d’ombre');
  if(v.contenu.has('gaz')) cont.push('gaz intra-luminal');
  if(cont.length){
    const grave = v.mucocele || v.contenu.has('calcul') || v.contenu.has('gaz');
    const s='Contenu : '+cont.join(' ; ');
    L.push((grave? M(s,true) : s)+'.');
  } else if(!anomalieVB()===false || v.paroi!=null) L.push('Contenu anéchogène.');

  if(v.rupture) L.push(M('Perte de continuité de la paroi vésiculaire',true)+'.');

  const c=choledoqueVB();
  if(c){
    let s='Canal cholédoque '+M('visualisé',true);
    if(c.diam!=null) s+=', mesuré à '+(c.verdict==='haut'? M(nb(c.diam)+' mm',true) : V(nb(c.diam)+' mm'))+
      ' (référence ≤ '+nb(c.max)+' mm)';
    L.push(s+'.');
  } else L.push('Canal cholédoque non visualisé.');

  return 'VÉSICULE BILIAIRE\n'+L.join('\n');
}

function syntheseFoieVB(items, lignes){
  const f=S.foie, v=S.vb;
  // --- Foie ---
  if(foieExamine() && !f.nonVu){
    const eg=echoFoie();
    if(eg==='hyper'){
      items.push({t:'foie hyperéchogène', c:''});
      lignes.push('Foie globalement hyperéchogène : stéatose, imprégnation cortisonique, '+
        'cirrhose ou infiltration — lymphome et mastocytose comprises.');
    } else if(eg==='hypo'){
      items.push({t:'foie hypoéchogène', c:''});
      lignes.push('Foie globalement hypoéchogène : infiltration lymphomateuse, hépatite aiguë, '+
        'ou congestion passive.');
    }
    if(f.susHepatiques==='dilatees'){
      items.push({t:'veines sus-hépatiques dilatées', c:'alerte'});
      lignes.push('Veines sus-hépatiques dilatées'+(f.epanchement?' avec épanchement':'')+
        ' : congestion passive — insuffisance cardiaque droite, tamponnade, ou obstruction '+
        'de la veine cave caudale.');
    }
    const rp=rapportPorte();
    if(rp && rp.verdict==='bas'){
      items.push({t:'rapport porte/aorte bas', c:'alerte'});
      lignes.push('Rapport veine porte / aorte à '+nb(rp.valeur,2)+', sous la borne de 0,71'+
        (f.taille==='petit'?', sur un foie de petite taille':'')+
        ' : shunt porto-systémique extra-hépatique au premier plan.');
    }
    if(f.nodules && f.nodulesEcho==='cible'){
      items.push({t:'nodules en cible', c:'alerte'});
      lignes.push('Nodules hépatiques en cible : l’aspect en cocarde est un argument fort '+
        'pour une métastase, bien plus que pour une hyperplasie nodulaire.');
    } else if(f.nodules){
      items.push({t:'nodules hépatiques', c:''});
      lignes.push('Nodules hépatiques : hyperplasie nodulaire bénigne en premier lieu chez '+
        'un chien âgé, mais métastases et nodules de régénération partagent cette image.');
    }
    if(f.masse){
      items.push({t:'masse hépatique', c:'alerte'});
      lignes.push('Masse hépatique : carcinome hépatocellulaire, hémangiosarcome, '+
        'tumeur biliaire ou métastase.');
    }
    if(f.contours==='bosseles'){
      items.push({t:'contours hépatiques bosselés', c:''});
      lignes.push('Contours hépatiques bosselés : cirrhose avec nodules de régénération, '+
        'ou atteinte néoplasique multifocale.');
    }
  }
  // --- Vésicule ---
  if(!vbExaminee() || v.nonVu) return;
  if(v.mucocele){
    items.push({t:'mucocèle biliaire', c:'alerte'});
    lignes.push('Contenu vésiculaire immobile et organisé : mucocèle biliaire'+
      (v.mucoceleAspect==='kiwi'?', d’aspect en kiwi, donc évoluée':'')+
      '. Le risque est la rupture avec péritonite biliaire. Chez le chien, elle accompagne '+
      'volontiers un hyperadrénocorticisme, une hypothyroïdie ou une hyperlipidémie.');
  }
  if(v.rupture){
    items.push({t:'rupture vésiculaire', c:'alerte'});
    lignes.push('Perte de continuité de la paroi vésiculaire'+
      (f.epanchement||v.contenu.size?' avec épanchement':'')+
      ' : rupture et péritonite biliaire jusqu’à preuve du contraire.');
  }
  const p=paroiVB();
  if(p && p.verdict==='haut'){
    if(v.doubleContour){
      items.push({t:'œdème pariétal vésiculaire', c:''});
      lignes.push('Paroi vésiculaire épaissie à double contour : œdème pariétal, et non '+
        'inflammation — hypoalbuminémie, insuffisance cardiaque droite, anaphylaxie, '+
        'hypertension portale.');
    } else {
      items.push({t:'paroi vésiculaire épaissie', c:''});
      lignes.push('Paroi vésiculaire épaissie sans double contour : cholécystite.');
    }
  }
  const c=choledoqueVB();
  if(c && c.verdict==='haut'){
    items.push({t:'cholédoque dilaté', c:'alerte'});
    lignes.push('Canal cholédoque dilaté'+
      (S.espece==='chien'?' — chez le chien, le voir suffit à l’affirmer':'')+
      ' : obstruction biliaire extra-hépatique — pancréatite, néoplasie duodénale ou '+
      'pancréatique, lithiase enclavée.');
  }
  if(v.contenu.has('gaz')){
    items.push({t:'gaz intra-vésiculaire', c:'alerte'});
    lignes.push('Gaz dans la vésicule : cholécystite emphysémateuse, sur terrain diabétique '+
      'le plus souvent. Un reflux duodénal peut aussi en introduire.');
  }
  // La boue est banale : le dire évite qu'elle soit sur-interprétée à la lecture.
  if(v.contenu.has('boue') && !v.mucocele && !anomalieVB()){
    items.push({t:'boue biliaire isolée', c:''});
    lignes.push('Boue biliaire isolée, sans épaississement pariétal ni dilatation des voies : '+
      'constatation banale, sans signification clinique propre.');
  }
}

// ===================== SURRÉNALES ET RATE =====================
// ┌──────────────────────────────────────────────────────────────────────────┐
// │ VALEURS DE RÉFÉRENCE SURRÉNALIENNES — un seul endroit à modifier.        │
// │ Chien et chat : valeurs de Bébou (08/10/2026), épaisseur du pôle caudal. │
// │ Restent données de mémoire, non confirmées par lui : la borne basse      │

const REF_SURRENALE = {
  chien:{
    paliers:[ {jusqua:10, max:6.0}, {jusqua:30, max:7.4}, {jusqua:1e9, max:9.0} ],
    bas:3.0,            // sous cette épaisseur : hypocorticisme — À CONFIRMER
    tumeur:20.0         // au-delà, unilatéralement : tumeur — À CONFIRMER
  },
  chat:{
    poleMin:3.5, poleMax:4.5,   // au-delà de 4,5 : adrénomégalie
    tumeur:10.0         // À CONFIRMER
  }
};

function surrenaleVide(){
  return {
    vu:false,
    L:null, pole:null,
    forme:'normale',           // normale | arrondie | deformee
    echo:'normale',            // normale | heterogene
    mineralisations:false,
    masse:false, masseL:null, masseH:null, masseEcho:null, masseHomo:null,
    masseContours:null, masseVasc:null,
    invasion:false
  };
}
// Borne haute du pôle caudal, selon l'espèce et le poids.
function borneSurrenale(){
  if(S.espece==='chat') return {max:REF_SURRENALE.chat.poleMax,
    min:REF_SURRENALE.chat.poleMin,
    lib:nb(REF_SURRENALE.chat.poleMin)+'–'+nb(REF_SURRENALE.chat.poleMax)+' mm'};
  if(S.espece!=='chien' || S.poids==null) return null;
  const p=REF_SURRENALE.chien.paliers.find(x=>S.poids<=x.jusqua);
  return {max:p.max, min:REF_SURRENALE.chien.bas,
    lib:'≤ '+nb(p.max)+' mm pour '+nb(S.poids,0)+' kg'};
}
function surrenaleVerdict(cote){
  const s=S['sr'+cote], b=borneSurrenale();
  if(!b || s.pole==null) return null;
  if(s.pole>b.max) return {verdict:'haut', b:b};
  if(s.pole<b.min) return {verdict:'bas', b:b};
  return {verdict:'normal', b:b};
}
function surrenaleSaisie(cote){
  const s=S['sr'+cote];
  return s.vu || s.masse || s.mineralisations || s.invasion;
}
function surrenalesExaminees(){ return surrenaleSaisie('D') || surrenaleSaisie('G'); }
function anomalieSurrenale(cote){
  const s=S['sr'+cote];
  if(!surrenaleSaisie(cote)) return false;
  const v=surrenaleVerdict(cote);
  if(v && v.verdict!=='normal') return true;
  if(s.forme!=='normale' || s.echo!=='normale') return true;
  if(s.masse || s.invasion) return true;
  // Chez le chat, les minéralisations sont banales : elles ne comptent pas.
  if(s.mineralisations && S.espece!=='chat') return true;
  return false;
}
function anomalieSurrenales(){
  return surrenalesExaminees() &&
    (anomalieSurrenale('D') || anomalieSurrenale('G'));
}

function rendreSurrenale(cote){
  const s=S['sr'+cote];
  const box=document.createElement('div'); box.className='rein surrenale-'+cote;
  const t=document.createElement('div'); t.className='rein-titre';
  t.innerHTML='<span>Surrénale '+(cote==='D'?'droite':'gauche')+'</span>';
  const v=surrenaleVerdict(cote);
  if(v && v.verdict!=='normal')
    verdictTag(t, v.verdict==='haut'?'épaissie':'fine', v.verdict==='haut'?'haut':'bas');
  pastilles(t,[{v:false,l:'Non visualisée',
      t:'Fréquent, surtout à droite et chez un animal en surpoids'},
    {v:true,l:'Visualisée'}],()=>s.vu,x=>s.vu=x===null?false:x,[]);
  box.appendChild(t);
  if(!s.vu){
    const n=document.createElement('p'); n.className='aide';
    n.textContent='Non visualisée : fréquent, et sans valeur en soi. La droite, coiffée '+
      'par la veine cave, échappe plus souvent que la gauche.';
    box.appendChild(n);
    return box;
  }

  const b1=bloc(box,'Mesures');
  const b=borneSurrenale();
  const rep=document.createElement('p'); rep.className='aide'; rep.style.marginTop='0';
  rep.innerHTML = b ? '<em>Pôle caudal '+b.lib+'</em>'
    : '<em>Renseigner l’espèce et le poids pour obtenir la borne</em>';
  b1.appendChild(rep);
  champ(b1,'Longueur',()=>s.L,x=>s.L=x,'mm','0.1');
  const lp=champ(b1,'Pôle caudal',()=>s.pole,x=>s.pole=x,'mm','0.1');
  if(v) verdictTag(lp, v.verdict==='normal'?'dans la norme'
    :(v.verdict==='haut'?'au-dessus de la borne':'sous la borne'),
    v.verdict==='normal'?'normal':(v.verdict==='haut'?'haut':'bas'));

  const b2=bloc(box,'Aspect');
  [['Forme','forme',[{v:'normale',l:S.espece==='chat'?'Ovale / haricot':'Haltère'},
      {v:'arrondie',l:'Arrondie',t:'Perte de la forme bipolaire : premier signe d’un processus'},
      {v:'deformee',l:'Déformée'}],['arrondie','deformee']],
   ['Échostructure','echo',[{v:'normale',l:'Homogène, hypoéchogène à la graisse'},
      {v:'heterogene',l:'Hétérogène'}],['heterogene']]
  ].forEach(([nom,cle,opts,ano])=>{
    const l=document.createElement('div'); l.className='ligne';
    l.innerHTML='<span class="nom">'+nom+'</span>';
    pastilles(l,opts,()=>s[cle],x=>s[cle]=x,ano,defautDe('surrenale',cle));
    b2.appendChild(l);
  });
  const lm=document.createElement('div'); lm.className='ligne';
  interrupteur(lm,'Minéralisations',()=>s.mineralisations,x=>s.mineralisations=x,
    S.espece==='chat'
      ? 'Banales chez le chat : jusqu’à 30 % des adultes sains, sans signification'
      : 'Signification non établie chez le chien');
  interrupteur(lm,'Masse',()=>s.masse,x=>s.masse=x);
  interrupteur(lm,'Invasion vasculaire',()=>s.invasion,x=>s.invasion=x,
    'Veine phrénico-abdominale ou veine cave caudale : c’est ce champ qui décide de la chirurgie');
  b2.appendChild(lm);

  if(s.masse){
    const sm=sousBloc(b2,'Caractérisation de la masse',true);
    const ld=document.createElement('div'); ld.className='ligne';
    ld.innerHTML='<span class="nom">Dimensions</span>';
    [['masseL','L'],['masseH','H']].forEach(([k,lab])=>{
      const i=document.createElement('input'); i.type='number'; i.step='1'; i.min='0';
      i.style.width='62px'; i.placeholder=lab; i.value=s[k]==null?'':s[k];
      i.addEventListener('change',()=>{ const x=i.value===''?null:parseFloat(i.value); s[k]=isNaN(x)?null:x; rendre(); });
      ld.appendChild(i);
    });
    const u=document.createElement('span'); u.className='unite'; u.textContent='mm'; ld.appendChild(u);
    sm.appendChild(ld);
    [['Échogénicité','masseEcho',[{v:'anecho',l:'Anéchogène'},{v:'hypo',l:'Hypoéchogène'},
        {v:'iso',l:'Isoéchogène'},{v:'hyper',l:'Hyperéchogène'},{v:'mixte',l:'Mixte'}]],
     ['Structure','masseHomo',[{v:'homogene',l:'Homogène'},{v:'heterogene',l:'Hétérogène'},
        {v:'cavitaire',l:'Cavitaire / nécrosée'}]],
     ['Contours','masseContours',[{v:'nets',l:'Nets'},{v:'flous',l:'Flous / infiltrants'}]],
     ['Vascularisation','masseVasc',[{v:'absente',l:'Absente'},
        {v:'peripherique',l:'Périphérique'},{v:'centrale',l:'Centrale / anarchique'}]]
    ].forEach(([nom,cle,opts])=>{
      const l=document.createElement('div'); l.className='ligne';
      l.innerHTML='<span class="nom">'+nom+'</span>';
      pastilles(l,opts,()=>s[cle],x=>s[cle]=x,null,defautDe('surrenale',cle));
      sm.appendChild(l);
    });
  } else { ['masseL','masseH','masseEcho','masseHomo','masseContours','masseVasc']
    .forEach(k=>s[k]=null); }

  blocImages(box,'surrenale_'+cote);
  return box;
}

function phraseSurrenale(cote){
  const s=S['sr'+cote];
  if(!surrenalesExaminees()) return null;
  const nom='SURRÉNALE '+(cote==='D'?'DROITE':'GAUCHE');
  if(!s.vu) return nom+'\nNon visualisée.';
  const L=[];
  const v=surrenaleVerdict(cote);
  const d=[];
  if(s.L!=null) d.push('longueur '+nb(s.L)+' mm');
  if(s.pole!=null) d.push('pôle caudal '+nb(s.pole)+' mm');
  const anoD = v && v.verdict!=='normal';

  if(!anomalieSurrenale(cote)){
    L.push('Examen dans les limites de la normale.'+
      (d.length?' Mesures : '+V(d.join(', '))+'.':''));
  } else {
    let t = d.length
      ? 'Mesures : '+(anoD? M(d.join(', '),true) : V(d.join(', ')))
      : 'Surrénale';
    if(v) t+=' — surrénale '+Q(v.verdict==='haut'?'épaissie'
      :(v.verdict==='bas'?'fine':'dans les limites de la normale'), anoD);
    L.push(t+'.');
    const FORME={normale:S.espece==='chat'?'ovale':'en haltère',
      arrondie:'arrondie', deformee:'déformée'};
    L.push('Forme '+Q(FORME[s.forme], s.forme!=='normale')+
      ', échostructure '+Q(s.echo==='normale'?'homogène':'hétérogène', s.echo!=='normale')+'.');
  }

  if(s.masse){
    const dm=[s.masseL,s.masseH].filter(x=>x!=null);
    let t='Masse surrénalienne';
    if(dm.length) t+=' mesurant '+dm.map(x=>nb(x,0)).join(' × ')+' mm';
    const q=[];
    if(s.masseEcho) q.push(MOT[s.masseEcho]);
    if(s.masseHomo) q.push(MOT[s.masseHomo]);
    if(s.masseContours) q.push('à contours '+MOT[s.masseContours]);
    if(s.masseVasc) q.push(MOT[s.masseVasc]);
    if(q.length) t+=', '+q.join(', ');
    L.push(M(t,true)+'.');
  }
  if(s.invasion) L.push(M('Invasion de la veine phrénico-abdominale ou de la veine cave caudale',true)+'.');
  if(s.mineralisations) L.push(S.espece==='chat'
    ? 'Minéralisations, banales chez le chat et sans signification clinique.'
    : M('Minéralisations surrénaliennes',true)+'.');
  return nom+'\n'+L.join('\n');
}

// Pas de mesure utilisable. La rate est l'organe abdominal le PLUS échogène :
// c'est le sommet de la règle rate > foie > cortex rénal.
function rateVide(){
  return {
    nonVu:false,
    taille:'normale',          // normale | augmentee
    contours:'reguliers',      // reguliers | irreguliers | bosseles
    structure:'homogene',      // homogene | heterogene | mitee
    echo:'normale',            // normale | diminuee | augmentee
    nodules:false, nodulesQte:null, nodulesNb:null, nodulesTaille:null, nodulesEcho:null,
    masse:false, masseL:null, masseH:null, masseEcho:null, masseHomo:null,
    masseContours:null, masseVasc:null,
    infarctus:false,
    veine:'normale',           // normale | dilatee | thrombosee
    epanchement:false
  };
}
function rateExaminee(){
  const r=S.rate;
  if(r.nonVu) return false;
  return r.taille!=='normale' || r.contours!=='reguliers' || r.structure!=='homogene' ||
    r.echo!=='normale' || r.nodules || r.masse || r.infarctus ||
    r.veine!=='normale' || r.epanchement;
}
function anomalieRate(){ return rateExaminee(); }
