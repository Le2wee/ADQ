function dateFr(iso){
  if(!iso) return '';
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d.getTime())) return iso;
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
const LIB_STATUT={entier:'entier', castre:'castré', sterilisee:'stérilisée'};
const LIB_CYCLE={anoestrus:'anœstrus', prooestrus:'proœstrus', oestrus:'œstrus',
  dioestrus:'diœstrus', postpartum:'post-partum'};

function ligneSignalement(){
  const p=S.patient, L=[];
  const esp = S.espece==='chien'?'Chien':(S.espece==='chat'?'Chat':'');
  const sx  = S.sexe==='male'?'Mâle':(S.sexe==='femelle'?'Femelle':'');
  const st  = S.statut ? LIB_STATUT[S.statut] : '';
  const sexe = [sx, st].filter(x=>x).join(' ');
  const rc=libRace();
  if(esp||rc) L.push(['Espèce et race',[esp,rc].filter(x=>x).join(' — ')]);
  if(sexe) L.push(['Sexe',sexe]);
  const ag=ageAffiche();
  if(p.naissance) L.push(['Date de naissance',
    [dateFr(p.naissance), ag?'('+ag+')':''].filter(x=>x).join(' ')]);
  else if(ag) L.push(['Âge',ag]);
  if(S.poids!=null) L.push(['Poids',nb(S.poids)+' kg']);
  if(S.cycle) L.push(['Phase du cycle',LIB_CYCLE[S.cycle]]);
  if(p.identification) L.push(['Identification',p.identification]);
  return L;
}

// Le CR est produit en lignes de texte : on les remonte en blocs balisés, en
// repérant les titres d'organe, pour que l'impression ait une vraie structure.
function docCorps(blocs, synth){
  const d=document.createElement('div'); d.className='doc-corps';
  blocs.forEach(x=>{
    const b=x.t;
    if(b.charAt(0)==='§'){
      const p=document.createElement('p'); p.className='libre';
      p.innerHTML=b.slice(1); d.appendChild(p); return;
    }
    // Titre et lignes réunis dans un même conteneur : c'est lui qu'on empêche
    // de se couper à l'impression. Sans ça, un organe peut perdre la moitié de
    // sa description au bas d'une page.
    const lignes=b.split('\n');
    const sec=document.createElement('section'); sec.className='bloc-organe';
    const h=document.createElement('div'); h.className='org';
    h.textContent=lignes[0]; sec.appendChild(h);
    lignes.slice(1).forEach(l=>{
      const p=document.createElement('p'); p.innerHTML=l; sec.appendChild(p);
    });
    d.appendChild(sec);
  });
  if(synth && synth.length){
    const s=document.createElement('div'); s.className='bloc-synthese';
    const h=document.createElement('div'); h.className='org'; h.textContent='Synthèse';
    s.appendChild(h);
    synth.forEach(l=>{ const p=document.createElement('p'); p.textContent=l; s.appendChild(p); });
    d.appendChild(s);
  }
  // Les images ferment le document : intercalées dans le texte, elles coupaient
  // la lecture des organes. Groupées par organe et numérotées en annexe, le
  // compte-rendu se lit d'un trait et les clichés restent repérables.
  const groupes=blocs.filter(x=>(x.img||[]).length);
  if(groupes.length){
    const a=document.createElement('div'); a.className='doc-annexe';
    const h=document.createElement('div'); h.className='org'; h.textContent='Images';
    a.appendChild(h);
    let n=0;
    groupes.forEach(x=>{
      const grp=document.createElement('section'); grp.className='annexe-groupe';
      const titre=x.t.charAt(0)==='§' ? '' : x.t.split('\n')[0];
      if(titre){
        const o=document.createElement('div'); o.className='annexe-organe';
        o.textContent=titre; grp.appendChild(o);
      }
      const g=document.createElement('div'); g.className='doc-images';
      x.img.forEach(o=>{
        n++;
        const fig=document.createElement('figure');
        const i=document.createElement('img'); i.src=o.src; i.alt=''; fig.appendChild(i);
        const c=document.createElement('figcaption');
        const num=document.createElement('span'); num.className='num';
        num.textContent='Fig. '+n; c.appendChild(num);
        if(o.legende) c.appendChild(document.createTextNode('— '+o.legende));
        fig.appendChild(c);
        g.appendChild(fig);
      });
      grp.appendChild(g);
      a.appendChild(grp);
    });
    d.appendChild(a);
  }
  return d;
}

function rendreDocument(blocs, synth){

  if(!blocs.length){
    z.className='doc-vide';

  z.className='doc';

  });

    sites.appendChild(d);
  }
  bas.appendChild(sites);

  const dr=document.createElement('div'); dr.className='ent-horaires';
  if(e.horaires){

    });

  bas.appendChild(dr);

  z.appendChild(te);

  const ti=document.createElement('div'); ti.className='doc-titre';
  ti.textContent='Compte-rendu d’échographie abdominale'; z.appendChild(ti);

  const tb=document.createElement('table'); tb.className='doc-signalement';
  const rows=[];
  if(p.nom||p.proprietaire) rows.push(['Animal',
    [p.nom, p.proprietaire?p.proprietaire.toUpperCase():''].filter(x=>x).join(' - ')]);
  ligneSignalement().forEach(r=>rows.push(r));
  if(p.dossier) rows.push(['Dossier',p.dossier]);
  if(p.motif) rows.push(['Motif',p.motif]);

  rows.forEach(([k,v])=>{
    const tr=document.createElement('tr');
    const th=document.createElement('th'); th.textContent=k; tr.appendChild(th);
    const td=document.createElement('td'); td.textContent=v; tr.appendChild(td);
    tb.appendChild(tr);
  });
  z.appendChild(tb);

  z.appendChild(docCorps(blocs, synth));

  const pi=document.createElement('div'); pi.className='doc-pied';
  // Étendue de l'examen, si elle a été déclarée. Elle lève l'ambiguïté du
  // silence : un organe dont le CR ne dit rien n'est pas un organe normal.
  const prot=mentionProtocole();
  if(prot){ const pr=document.createElement('div'); pr.textContent=prot; pi.appendChild(pr); }
  const g=document.createElement('div');
  g.textContent='Compte-rendu établi au vu des images réalisées le '+dateFr(p.dateExamen)+
    '. Interprétation à replacer dans le contexte clinique.';
  pi.appendChild(g);
  const s=document.createElement('div'); s.className='sign';
  s.innerHTML=(e.veto?e.veto:'')+'<span class="trait">Signature</span>';
  pi.appendChild(s);
  z.appendChild(pi);
}

// Texte brut pour le copier-coller, sans la mise en page.
function crTexteBrut(blocs, synth){
  const T=['COMPTE-RENDU D’ÉCHOGRAPHIE ABDOMINALE',''];
  const e=S.entete, p=S.patient;
  if(e.nom) T.push(e.nom);
  [[e.site1,e.tel1],[e.site2,e.tel2]].forEach(([ad,tl])=>{
    const l=[ad,tl].filter(x=>x).join(' — '); if(l) T.push(l);
  });
  if(e.veto) T.push(e.veto);
  if(e.nom||e.veto) T.push('');
  const p1=[];
  if(p.nom) p1.push(p.nom);
  if(p.proprietaire) p1.push(p.proprietaire.toUpperCase());
  if(p1.length) T.push(p1.join(' - '));
  ligneSignalement().forEach(([k,v])=>T.push(k+' : '+v));
  if(p.dossier) T.push('Dossier : '+p.dossier);
  if(p.motif) T.push('Motif : '+p.motif);
  T.push('Date de l’examen : '+dateFr(p.dateExamen));
  T.push('');
  blocs.forEach(x=>{
    T.push(x.t.replace(/^§/,'').replace(/<[^>]+>/g,''));
    T.push('');
  });
  if(synth && synth.length){ T.push('SYNTHÈSE'); synth.forEach(l=>T.push(l)); T.push(''); }
  { const prot=mentionProtocole(); if(prot){ T.push(prot); T.push(''); } }
  // Même ordre que le document : les images ferment le compte-rendu.
  const groupes=blocs.filter(x=>(x.img||[]).length);
  if(groupes.length){
    T.push('IMAGES');
    let n=0;
    groupes.forEach(x=>{
      const titre=x.t.charAt(0)==='§' ? '' : x.t.split('\n')[0];
      if(titre) T.push(titre);
      x.img.forEach(o=>{ n++; T.push('  Fig. '+n+(o.legende?' — '+o.legende:'')); });
    });
  }
  return T.join('\n');
}

// Écart de taille entre les deux reins : le millimètre dit l'ampleur réelle,
// le pourcentage la met à l'échelle de l'animal.
function phraseEcartReins(){
  const bD=biometrie('D'), bG=biometrie('G');
  if(S.D.nonVu || S.G.nonVu) return null;
  if(!bD || !bG || bD.valeur==null || bG.valeur==null) return null;
  if(S.D.longueur==null || S.G.longueur==null) return null;
  const mm=Math.abs(S.D.longueur-S.G.longueur);
  const pc=Math.abs(bD.valeur-bG.valeur)/Math.max(bD.valeur,bG.valeur)*100;
  const ano=pc>=15;
  const chiffre=nb(mm,0)+' mm ('+pc.toFixed(0)+' %)';
  return '§Écart de '+(ano? M(chiffre,true) : V(chiffre))+' entre les deux reins : '+
    Q(ano?'asymétrie significative':'symétrie conservée', ano)+'.';
}
function phraseRein(cote){
  const r=S[cote], L=[];
  let uretereNormal=false;
  const nom='REIN '+(cote==='D'?'DROIT':'GAUCHE');
  if(r.nonVu) return nom+'\n'+(r.nonVuMotif==='nonRetrouve'
    ? 'Recherché, non retrouvé.' : 'Non exploré.');
  if(!reinExamine(cote)) return null;
  const bio=biometrie(cote);
  // Rein sans aucune anomalie : la conclusion passe en tête, les chiffres suivent.
  const toutNormal = !anomalieDecrite(cote);
  if(bio){
    if(bio.verdict && toutNormal){
      let s='Examen dans les limites de la normale. Rein de '+V(nb(r.longueur,0)+' mm')+' de long';
      s += S.espece==='chat'
        ? ' (référence 30–45)'
        : ', rapport rein/aorte '+V(bio.aff)+' (référence 5,5–9,2)';
      L.push(s+'.');
    } else if(bio.verdict){
      const q = bio.verdict==='normal'?'dans les limites de la normale'
        :(bio.verdict==='bas'?'de taille diminuée':'de taille augmentée');
      const ano = bio.verdict!=='normal';
      const lg = ano ? M(nb(r.longueur,0)+' mm',true) : V(nb(r.longueur,0)+' mm');
      const rp = ano ? M(bio.aff,true) : V(bio.aff);
      L.push(S.espece==='chat'
        ? 'Longueur '+lg+' (référence 30–45) : '+Q(q,ano)+'.'
        : 'Longueur '+lg+', rapport rein/aorte '+rp+' (référence 5,5–9,2) : '+Q(q,ano)+'.');
    } else L.push('Longueur '+nb(r.longueur,0)+' mm — rapport rein/aorte non calculable, aorte non mesurée.');
  }

  const m=[];
  if(r.contours){
    const a = r.contours!=='reguliers';
    m.push(a ? M('contours '+MOT[r.contours],true) : 'contours '+MOT[r.contours]);
  }
  // Un cortex hyperéchogène au foie reste physiologique chez le chat
  if(!S.foieAnormal && r.echoFoie){
    if(r.echoFoie==='iso') m.push('échogénicité normale');
    else {
      const a = r.echoFoie==='hyper' && S.espece!=='chat';
      const t='cortex '+MOT[r.echoFoie]+' au foie';
      m.push(a? M(t,true) : t);
    }
  }
  if(S.foieAnormal && r.echoRate){
    if(r.echoRate==='iso') m.push('échogénicité normale (comparée à la rate, foie non interprétable)');
    else {
      const t='cortex '+MOT[r.echoRate]+' à la rate (foie non interprétable)';
      m.push(r.echoRate==='hyper'? M(t,true) : t);
    }
  }
  if(m.length){
    let s=m.join(', ');
    s = s.replace(/^(<mark[^>]*>)?([a-zà-ÿ])/, function(x,b,c){ return (b||'')+c.toUpperCase(); });
    L.push(s+'.');
  }
  if(r.jcm){
    const a = r.jcm!=='conservee';
    L.push('Différenciation cortico-médullaire '+(a? M(MOT[r.jcm],true) : MOT[r.jcm])+'.');
  }

  const cb=classeBassinet(r.bassinet);
  if(cb){
    const a = cb.cle!=='normal';
    L.push('Bassinet mesuré à '+(a? M(libBassinet(r.bassinet),true) : V(libBassinet(r.bassinet)))+
      ' : '+Q(cb.lib,a)+'.');
  }
  if(r.uretere){
    let s='Uretère '+M('visible',true)+(r.uretereDiam!=null?', '+M('dilaté à '+nb(r.uretereDiam,0)+' mm',true):'');
    if(r.uretereSite) s+=', rupture de calibre '+(r.uretereSite==='moyen'?MOT.moyen_u:MOT[r.uretereSite]);
    L.push(s+'.');
  } else if(cb) uretereNormal=true;

  const les=[];
  if(r.kystes){
    const q=libelleQuantite(r, 'kystes', 'kyste', false);
    let s=q.t;
    if(r.kystesTaille!=null) s+=mesureDuPlusGrand(q.pluriel, r.kystesTaille, false, 0);
    les.push(s);
  }
  if(r.lithiases.size){
    let s=[...r.lithiases].map(x=>MOT[x]).join(' et ');
    if(r.lithiaseTaille!=null) s+=' mesurant jusqu’à '+nb(r.lithiaseTaille)+' mm';
    if(r.coneOmbre) s+=(r.coneOmbre==='oui'?', avec cône d’ombre':', sans cône d’ombre');
    les.push(s);
  }
  if(r.infarctus) les.push('encoches corticales compatibles avec des infarctus');
  if(les.length) L.push(M('Présence '+de(les[0])+(les.length>1?' ; '+les.slice(1).join(' ; '):''),true)+'.');
  else if(bio || cb) L.push('Pas de lithiase, de kyste ni d’infarctus visualisé.');

  if(r.masse){
    const d=[r.masseL,r.masseH,r.masseP].filter(x=>x!=null);
    let s='Masse';
    if(r.masseLoc) s+=' située '+MOT[r.masseLoc];
    if(d.length) s+=(r.masseLoc?', mesurant ':' mesurant ')+d.map(x=>nb(x,0)).join(' × ')+' mm';
    const q=[];
    if(r.masseEcho) q.push(MOT[r.masseEcho]);
    if(r.masseHomo) q.push(MOT[r.masseHomo]);
    if(r.masseContours) q.push('à contours '+MOT[r.masseContours]);
    if(r.masseVasc) q.push(MOT[r.masseVasc]);
    if(q.length) s+=', '+q.join(', ');
    L.push(M(s,true)+'.');
  }

  const p=[];
  if(r.graisse) p.push('graisse périrénale hyperéchogène');
  if(r.epanchement) p.push('épanchement périrénal');
  if(r.halo) p.push('halo périrénal anéchogène');
  if(p.length){
    if(uretereNormal) L.push('Uretère non visible.');
    L.push('Espace périrénal : '+M(p.join(', '),true)+'.');
  } else if(uretereNormal && bio) L.push('Uretère non visible, espace périrénal sans particularité.');
  else if(uretereNormal) L.push('Uretère non visible.');
  else if(bio) L.push('Espace périrénal sans particularité.');

  return L.length ? nom+'\n'+L.join('\n') : null;
}

// Synthèse réellement imprimée : celle que Bébou a réécrite s'il l'a fait,
// sinon celle que l'outil produit. Décochée, elle ne sort nulle part.
function syntheseEffective(auto){
  if(!S.synthese.inclure) return [];
  if(S.synthese.texte==null) return auto;
  return S.synthese.texte.split('\n').map(l=>l.trim()).filter(l=>l);
}
// Panneau de réglage, visible à l'écran seulement.
function rendreReglageSynthese(auto){
  const z=document.getElementById('syntheseReglage'); z.innerHTML='';
  if(!S.espece) return;
  z.className='synth-reglage no-print';

  const b=document.createElement('button'); b.type='button';
  b.className='pill mini';
  b.setAttribute('aria-pressed', S.synthese.inclure?'true':'false');
  b.textContent = S.synthese.inclure ? 'Synthèse incluse' : 'Synthèse retirée';
  b.title='Retirer la synthèse du document imprimé et du texte brut';
  b.addEventListener('click',()=>{ S.synthese.inclure=!S.synthese.inclure; rendre(); });
  z.appendChild(b);

  if(S.synthese.texte!=null){
    const r=document.createElement('button'); r.type='button'; r.className='btn ghost';
    r.textContent='Rétablir la synthèse automatique';
    r.addEventListener('click',()=>{ S.synthese.texte=null; rendre(); });
    z.appendChild(r);
  }
  if(!S.synthese.inclure){
    const a=document.createElement('p'); a.className='aide';
    a.textContent='La synthèse n’apparaît ni dans le document, ni à l’impression, '+
      'ni dans le texte brut.';
    z.appendChild(a);
    return;
  }

  const t=document.createElement('textarea');
  t.value = S.synthese.texte!=null ? S.synthese.texte : auto.join('\n');
  t.placeholder='Synthèse — une ligne par paragraphe';
  // Pas de rendu à chaque frappe : le champ serait recréé sous le curseur.
  t.addEventListener('input',()=>{ S.synthese.texte=t.value; });
  t.addEventListener('blur',()=>{ S.synthese.texte=t.value; rendre(); });
  z.appendChild(t);
  const a=document.createElement('p'); a.className='aide';
  a.textContent = S.synthese.texte!=null
    ? 'Synthèse réécrite. L’outil ne la met plus à jour tant qu’elle n’est pas rétablie.'
    : 'Synthèse produite par l’outil. La modifier ici la fige : elle ne suivra plus la saisie.';
  z.appendChild(a);
}

// ===================== BOUCLE DE RENDU =====================
// ===================== DOSSIER PATIENT : SAUVEGARDE LOCALE =====================
// Une page web ne peut pas écrire librement sur le disque. Deux chemins :
//  – File System Access API (Chrome/Edge) : l'utilisateur désigne UNE fois un
//    dossier, le navigateur retient l'autorisation, et l'app y écrit ensuite
//    sans dialogue. C'est le fonctionnement décrit, et le seul qui le permette.
//  – partout ailleurs : téléchargement d'un .json et relecture par un <input
//    type="file">. Moins confortable, mais universel.
// Le chemin est choisi au lancement selon ce que le navigateur offre réellement.
const FORMAT_DOSSIER = 1;
const DOSSIER_DB = 'echo-dossier';
const supporteDisque = (typeof window!=='undefined') &&
  typeof window.showDirectoryPicker === 'function';
let racineDossier = null;          // FileSystemDirectoryHandle
let dossierAvisTimer = null;

// --- sérialisation : les Set ne survivent pas à JSON.stringify ---
function versJSON(v){
  if(v instanceof Set) return {__set:[...v].map(versJSON)};
  if(Array.isArray(v)) return v.map(versJSON);
  if(v && typeof v==='object'){
    const o={}; Object.keys(v).forEach(k=>{ o[k]=versJSON(v[k]); }); return o;
  }
  return v;
}
function depuisJSON(v){
  if(v && typeof v==='object' && Array.isArray(v.__set)) return new Set(v.__set.map(depuisJSON));
  if(Array.isArray(v)) return v.map(depuisJSON);
  if(v && typeof v==='object'){
    const o={}; Object.keys(v).forEach(k=>{ o[k]=depuisJSON(v[k]); }); return o;
  }
  return v;
}
// Les images pèsent l'essentiel du fichier. Les omettre reste possible, mais
// on garde la trace de leur nombre : un examen rechargé sans ses clichés ne
// doit pas faire croire qu'il n'en comportait pas.
function instantane(avecImages){
  const copie = versJSON(S);
  let omises = 0;
  if(!avecImages){
    Object.keys(copie.images||{}).forEach(k=>{
      omises += (copie.images[k]||[]).length;
      copie.images[k] = (copie.images[k]||[]).map(im=>({src:null, legende:im.legende||''}));
    });
  }
  return {format:FORMAT_DOSSIER, app:'echo-abdominale',
          enregistre:new Date().toISOString(), imagesOmises:omises, etat:copie};
}
// Reconstruit l'état à partir d'un fichier. Un fichier plus ancien, tronqué ou
// écrit par une version antérieure ne doit pas faire tomber l'application : tout
// organe absent est recréé vierge, et ce qui manque reste vide plutôt que
// d'empêcher la lecture du reste.
const ORGANES_MODELE = [
  ['D',reinVide],['G',reinVide],['vessie',vessieVide],['prostate',prostateVide],
  ['uterus',uterusVide],['ovD',ovaireVide],['ovG',ovaireVide],
  ['tsD',testiculeVide],['tsG',testiculeVide],
  ['foie',foieVide],['vb',vbVide],['srD',surrenaleVide],['srG',surrenaleVide],
  ['rate',rateVide],['estomac',estomacVide],['intestins',intestinsVide],
  ['nl',nlVide],['vasc',vascVide],['pancreas',pancreasVide],
  ['entete',lireEntete],['patient',patientVide]
];
function appliquerInstantane(doc){
  if(!doc || typeof doc!=='object') throw new Error('fichier illisible');
  if(doc.app && doc.app!=='echo-abdominale') throw new Error('fichier d’une autre application');
  if(!doc.etat || typeof doc.etat!=='object') throw new Error('fichier sans examen enregistré');
  const e = depuisJSON(doc.etat);
  // S est const : on le vide et on le re-remplit, sans le réassigner.
  Object.keys(S).forEach(k=>{ delete S[k]; });
  Object.keys(e).forEach(k=>{ S[k]=e[k]; });
  // Un organe manquant ou d'un type inattendu repart de son modèle vierge.
  ORGANES_MODELE.forEach(([cle,modele])=>{
    if(!S[cle] || typeof S[cle]!=='object' || Array.isArray(S[cle])) S[cle]=modele();
  });
  if(!S.images || typeof S.images!=='object') S.images={};
  if(!S.notes || typeof S.notes!=='object') S.notes={};
  if(!S.ouvert || typeof S.ouvert!=='object') S.ouvert={entete:false, patient:true};
  if(!S.synthese || typeof S.synthese!=='object') S.synthese={inclure:true, texte:null};
  // Les groupes ganglionnaires et les segments digestifs sont des sous-objets :
  // ils manquent aussi dans un fichier antérieur à leur introduction.
  GROUPES_NL.forEach(g=>{
    if(!S.nl[g.k] || typeof S.nl[g.k]!=='object') S.nl[g.k]={vu:false, noeuds:[noeudNLVide()]};
    const o=S.nl[g.k];
    if(!Array.isArray(o.noeuds) || !o.noeuds.length) o.noeuds=[noeudNLVide()];
  });
  SEGMENTS.forEach(s=>{
    if(!S.intestins[s.k] || typeof S.intestins[s.k]!=='object') S.intestins[s.k]=segmentVide();
  });
  LOBES_PANCREAS.forEach(l=>{
    if(!S.pancreas[l.k] || typeof S.pancreas[l.k]!=='object')
      S.pancreas[l.k]={vu:false, ep:null, echo:'normale', contours:'reguliers'};
  });
  rendre();
}

// --- nommage : un sous-dossier par patient ---
function assainir(t){
  return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^A-Za-z0-9 _-]/g,' ').replace(/\s+/g,' ').trim().slice(0,60);
}
function nomDossierPatient(){
  const p=S.patient||{};
  const bouts=[assainir(p.proprietaire).toUpperCase(), assainir(p.nom)].filter(x=>x);
  return bouts.join('-') || 'Sans-nom';
}
function nomFichierExamen(){
  const d=(S.patient && S.patient.dateExamen) || new Date().toISOString().slice(0,10);
  return assainir(d)+'.json';
}

// --- mémoire du dossier choisi, entre deux sessions ---
function idbDossier(action, valeur){
  return new Promise((ok,ko)=>{
    if(!window.indexedDB) return ok(null);
    const r=indexedDB.open(DOSSIER_DB,1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('h'); };
    r.onerror=()=>ok(null);
    r.onsuccess=()=>{
      const db=r.result;
      let tx;
      try{ tx=db.transaction('h', action==='lire'?'readonly':'readwrite'); }
      catch(e){ return ok(null); }
      const st=tx.objectStore('h');
      const q = action==='lire' ? st.get('racine') : st.put(valeur,'racine');
      q.onsuccess=()=>ok(action==='lire'?q.result:true);
      q.onerror=()=>ok(null);
    };
  });
}
async function reprendreDossier(){
  if(!supporteDisque) { rendreBarreDossier(); return; }
  try{
    const h=await idbDossier('lire');
    if(h && await h.queryPermission({mode:'readwrite'})==='granted') racineDossier=h;
  }catch(e){}
  rendreBarreDossier();
}
async function choisirDossier(){
  try{
    const h=await window.showDirectoryPicker({id:'echo-abdo', mode:'readwrite'});
    if(await h.requestPermission({mode:'readwrite'})!=='granted') return false;
    racineDossier=h; await idbDossier('ecrire',h);
    rendreBarreDossier();
    return true;
  }catch(e){ return false; }   // l'utilisateur a annulé : rien à signaler
}
async function racinePrete(){
  if(!supporteDisque) return false;
  if(racineDossier){
    try{
      if(await racineDossier.queryPermission({mode:'readwrite'})==='granted') return true;
      if(await racineDossier.requestPermission({mode:'readwrite'})==='granted') return true;
    }catch(e){}
    racineDossier=null;
  }
  return await choisirDossier();
}

function avisDossier(texte, ok){
  const z=document.getElementById('dossierAvis'); if(!z) return;
  z.hidden=false; z.className='dossier-avis '+(ok?'ok':'ko'); z.textContent=texte;
  if(dossierAvisTimer) clearTimeout(dossierAvisTimer);
  if(ok) dossierAvisTimer=setTimeout(()=>{ z.hidden=true; }, 6000);
}

// --- enregistrement ---
async function enregistrerExamen(avecImages){
  const doc=instantane(avecImages);
  const texte=JSON.stringify(doc);
  const sousDossier=nomDossierPatient(), fichier=nomFichierExamen();
  if(await racinePrete()){
    try{
      const d=await racineDossier.getDirectoryHandle(sousDossier,{create:true});
      // Un même patient réexaminé le même jour : on ne remplace pas en silence.
      let nom=fichier, n=2;
      while(await existeFichier(d,nom)) nom=fichier.replace(/\.json$/,'')+'_'+(n++)+'.json';
      const f=await d.getFileHandle(nom,{create:true});
      const w=await f.createWritable();
      await w.write(texte); await w.close();
      avisDossier('Enregistré : '+sousDossier+' / '+nom+
        (doc.imagesOmises?' — '+doc.imagesOmises+' image(s) non incluses':''), true);
      return;
    }catch(e){ avisDossier('Écriture impossible : '+e.message, false); return; }
  }
  // Repli universel : téléchargement.
  const b=new Blob([texte],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=sousDossier+'_'+fichier;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  avisDossier('Fichier téléchargé : '+a.download+
    (doc.imagesOmises?' — '+doc.imagesOmises+' image(s) non incluses':''), true);
}
async function existeFichier(d, nom){
  try{ await d.getFileHandle(nom); return true; }catch(e){ return false; }
}

// --- rechargement ---
async function chargerDepuisFichier(file){
  try{
    const doc=JSON.parse(await file.text());
    appliquerInstantane(doc);
    avisDossier('Examen rechargé'+(doc.imagesOmises
      ? ' — attention : '+doc.imagesOmises+' image(s) n’avaient pas été enregistrées' : '')+'.',
      !doc.imagesOmises);
  }catch(e){ avisDossier('Lecture impossible : '+e.message, false); }
}
async function listerDossier(){
  if(!await racinePrete()) return null;
  const out=[];
  try{
    for await (const [nom,h] of racineDossier.entries()){
      if(h.kind!=='directory') continue;
      const fichiers=[];
      for await (const [fn,fh] of h.entries())
        if(fh.kind==='file' && /\.json$/i.test(fn)) fichiers.push({nom:fn, h:fh});
      if(fichiers.length){ fichiers.sort((a,b)=>b.nom.localeCompare(a.nom)); out.push({patient:nom, fichiers:fichiers}); }
    }
  }catch(e){ avisDossier('Lecture du dossier impossible : '+e.message, false); return null; }
  out.sort((a,b)=>a.patient.localeCompare(b.patient));
  return out;
}

// --- modale générique ---
function modale(titre, remplir){
  const fond=document.createElement('div'); fond.className='modale';
  const b=document.createElement('div'); b.className='modale-boite';
  const h=document.createElement('h3'); h.textContent=titre; b.appendChild(h);
  const fermer=()=>fond.remove();
  remplir(b, fermer);
  fond.appendChild(b);
  fond.addEventListener('click',e=>{ if(e.target===fond) fermer(); });
  document.addEventListener('keydown',function esc(e){
    if(e.key==='Escape'){ fermer(); document.removeEventListener('keydown',esc); }
  });
  document.body.appendChild(fond);
  return fermer;
}
function boutonModale(parent, libelle, action, primaire){
  const b=document.createElement('button'); b.type='button';
  b.className='pill'+(primaire?' ano':'');
  b.textContent=libelle; b.addEventListener('click',action);
  parent.appendChild(b); return b;
}

function dialogueEnregistrer(){
  const nbImg=(typeof toutesImages==='function')?toutesImages():0;
  modale('Enregistrer l’examen',(b,fermer)=>{
    const p=document.createElement('p'); p.className='aide'; p.style.margin='0 0 10px';
    p.textContent='Destination : '+nomDossierPatient()+' / '+nomFichierExamen()+
      (supporteDisque && racineDossier ? '' : ' (téléchargement)');
    b.appendChild(p);
    let avec=true;
    const l=document.createElement('div'); l.className='ligne';
    if(nbImg){
      const c=document.createElement('span'); c.className='check';
      c.setAttribute('role','checkbox'); c.setAttribute('tabindex','0');
      c.setAttribute('aria-checked','true');
      c.innerHTML='<span class="box"></span>Inclure les '+nbImg+' image'+(nbImg>1?'s':'')+
        ' (fichier plus lourd)';
      const f=()=>{ avec=!avec; c.setAttribute('aria-checked',avec?'true':'false'); };
      c.addEventListener('click',f);
      c.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); f(); } });
      l.appendChild(c);
    } else {
      const s=document.createElement('span'); s.className='aide'; s.style.margin='0';
      s.textContent='Aucune image dans cet examen.'; l.appendChild(s);
    }
    b.appendChild(l);
    const act=document.createElement('div'); act.className='modale-actions';
    boutonModale(act,'Annuler',fermer);
    boutonModale(act,'Enregistrer',()=>{ fermer(); enregistrerExamen(nbImg?avec:true); }, true);
    b.appendChild(act);
  });
}

function examenRempli(){
  // Assez de saisie pour qu'un écrasement soit une perte.
  return !!(S.espece || (S.patient && S.patient.nom) ||
    ['D','G'].some(c=>reinExamine(c)) || vessieExaminee() || foieExamine() ||
    rateExaminee() || estomacExamine() || intestinsExamines() || nlSaisis());
}
function dialogueCharger(){
  modale('Recharger un examen',(b,fermer)=>{
    const avert=document.createElement('p'); avert.className='aide'; avert.style.margin='0 0 10px';
    avert.textContent = examenRempli()
      ? '⚠ L’examen en cours sera remplacé. Enregistrez-le d’abord si vous voulez le garder.'
      : 'Choisissez l’examen à rouvrir.';
    b.appendChild(avert);

    const zl=document.createElement('div'); b.appendChild(zl);
    if(supporteDisque){
      const ch=document.createElement('p'); ch.className='aide'; ch.style.margin='0 0 8px';
      ch.textContent='Lecture du dossier…'; zl.appendChild(ch);
      listerDossier().then(liste=>{
        zl.innerHTML='';
        if(!liste){ return; }
        if(!liste.length){
          const v=document.createElement('p'); v.className='aide'; v.style.margin='0';
          v.textContent='Aucun examen enregistré dans ce dossier pour l’instant.';
          zl.appendChild(v); return;
        }
        liste.forEach(g=>{
          const t=document.createElement('div'); t.className='bloc-t'; t.textContent=g.patient;
          zl.appendChild(t);
          const ul=document.createElement('ul'); ul.className='liste-dossier';
          g.fichiers.forEach(f=>{
            const li=document.createElement('li');
            const bt=document.createElement('button'); bt.type='button'; bt.className='pill mini';
            bt.textContent=f.nom.replace(/\.json$/,'');
            bt.addEventListener('click',async()=>{
              fermer(); chargerDepuisFichier(await f.h.getFile());
            });
            li.appendChild(bt); ul.appendChild(li);
          });
          zl.appendChild(ul);
        });
      });
    }

    const act=document.createElement('div'); act.className='modale-actions';
    const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
    inp.style.display='none';
    inp.addEventListener('change',()=>{ if(inp.files[0]){ fermer(); chargerDepuisFichier(inp.files[0]); } });
    b.appendChild(inp);
    boutonModale(act,'Annuler',fermer);
    boutonModale(act,'Ouvrir un fichier…',()=>inp.click());
    b.appendChild(act);
  });
}

// ---------- REMISE À ZÉRO ----------
// Efface le patient et tout l'examen, et RIEN d'autre. L'en-tête de clinique,
// le dossier d'enregistrement choisi et la série en cours sont des réglages
// de poste, pas des données du patient : les perdre à chaque animal ferait
// de la RAZ un bouton qu'on évite d'utiliser.
function remiseAZero(){
  ORGANES_MODELE.forEach(([cle,modele])=>{
    if(cle==='entete') return;              // réglage de clinique, conservé
    S[cle]=modele();
  });
  S.espece=null; S.aorte=null; S.foieAnormal=false;
  S.sexe=null; S.statut=null; S.poids=null; S.age=null; S.cycle=null;
  S.prostateDepliee=false; S.testiculesDeplies=false;
  S.images={}; S.notes={};
  S.synthese={inclure:true, texte:null};
  S.brut=false;
  S.ouvert={entete:S.ouvert&&S.ouvert.entete||false, patient:true};
  rendre();
}
function dialogueRAZ(){
  const rempli=examenRempli();
  modale('Nouvel examen',(b,fermer)=>{
    const p=document.createElement('p'); p.className='aide'; p.style.margin='0 0 10px';
    p.textContent = rempli
      ? 'L’examen en cours va être effacé : patient, mesures, images et lignes libres. '+
        'Cette action est irréversible.'
      : 'Rien n’est saisi pour l’instant : il n’y a rien à effacer.';
    b.appendChild(p);
    const g=document.createElement('p'); g.className='aide'; g.style.margin='0 0 10px';
    g.textContent='Conservés : en-tête de clinique, dossier d’enregistrement et série en cours.';
    b.appendChild(g);
    const act=document.createElement('div'); act.className='modale-actions';
    boutonModale(act,'Annuler',fermer);
    // La vraie sécurité n'est pas de redemander, c'est de proposer de sauver.
    if(rempli) boutonModale(act,'Enregistrer d’abord…',()=>{ fermer(); dialogueEnregistrer(); });
    boutonModale(act, rempli?'Effacer l’examen':'Repartir à zéro', ()=>{
      fermer(); remiseAZero();
      avisDossier('Examen effacé. En-tête de clinique et dossier conservés.', true);
    }, true);
    b.appendChild(act);
  });
}

function rendreBarreDossier(){
  const z=document.getElementById('dossierZone'); if(!z) return;
  z.innerHTML='';
  const bs=document.createElement('button'); bs.type='button'; bs.className='pill';
  bs.textContent='Enregistrer';
  bs.title='Enregistre l’examen complet : saisies, en-tête, synthèse et, au choix, les images';
  bs.addEventListener('click',dialogueEnregistrer);
  z.appendChild(bs);
  const bc=document.createElement('button'); bc.type='button'; bc.className='pill';
  bc.textContent='Recharger…';
  bc.title='Rouvre un examen enregistré pour le relire ou le modifier';
  bc.addEventListener('click',dialogueCharger);
  z.appendChild(bc);
  const bz=document.createElement('button'); bz.type='button'; bz.className='pill btn-raz';
  bz.textContent='Nouvel examen';
  bz.title='Efface le patient et toutes les saisies ; demande confirmation avant';
  bz.addEventListener('click',dialogueRAZ);
  z.appendChild(bz);
  // « Changer de dossier » n'apparaît qu'une fois un dossier choisi : avant, le
  // premier enregistrement le demande lui-même, et le bouton n'aurait servi
  // qu'à faire douter de l'ordre des opérations.
  if(supporteDisque && racineDossier){
    const bd=document.createElement('button'); bd.type='button'; bd.className='pill';
    bd.textContent='Changer de dossier';
    bd.title='Désigne un autre dossier de rangement ; un sous-dossier par patient y sera créé';
    bd.addEventListener('click',choisirDossier);
    z.appendChild(bd);
  }
  const et=document.getElementById('dossierEtat');
  if(et){
    et.textContent = !supporteDisque
      ? 'navigateur sans accès disque : les examens sont téléchargés puis rouverts à la main'
      : (racineDossier ? 'dossier : ' + racineDossier.name + ' — un sous-dossier par patient'
                       : 'le premier enregistrement vous demandera où ranger les examens');
  }
}

function rendre(){
  const memo=focusAvant();
  const ze=document.getElementById('especeZone'); ze.innerHTML='';
  [{v:'chien',l:'Chien'},{v:'chat',l:'Chat'}].forEach(o=>{
    const b=document.createElement('button'); b.type='button'; b.className='pill';
    b.setAttribute('aria-pressed', S.espece===o.v?'true':'false'); b.textContent=o.l;
    b.addEventListener('click',()=>{ S.espece = S.espece===o.v?null:o.v; rendre(); });
    ze.appendChild(b);
  });
  const zf=document.getElementById('foieZone'); zf.innerHTML='';
  {
    const b=document.createElement('button'); b.type='button';
    b.className='pill'+(S.foieAnormal?' ano':'');
    b.setAttribute('aria-pressed', S.foieAnormal?'true':'false');
    b.textContent='Foie d\u2019aspect anormal';
    b.title='Un foie stéatosique ou infiltré est hyperéchogène : il ne peut plus servir de référence. La comparaison bascule alors sur la rate.';
    b.addEventListener('click',()=>{ S.foieAnormal=!S.foieAnormal; rendre(); });
    zf.appendChild(b);
  }
  const ze2=document.getElementById('enteteZone'); ze2.innerHTML='';
  ze2.appendChild(rendreEntete());
  const zpa=document.getElementById('patientZone'); zpa.innerHTML='';
  zpa.appendChild(rendreSignalement());

  const zs=document.getElementById('sexeZone'); zs.innerHTML='';
  [{v:'male',l:'Mâle'},{v:'femelle',l:'Femelle'}].forEach(o=>{
    const b=document.createElement('button'); b.type='button'; b.className='pill';
    b.setAttribute('aria-pressed', S.sexe===o.v?'true':'false'); b.textContent=o.l;
    b.addEventListener('click',()=>{ S.sexe = S.sexe===o.v?null:o.v; rendre(); });
    zs.appendChild(b);
  });
  const zst=document.getElementById('statutZone'); zst.innerHTML='';
  const fem = S.sexe==='femelle';
  (fem ? [{v:'entier',l:'Entière'},{v:'sterilisee',l:'Stérilisée'}]
       : [{v:'entier',l:'Entier'},{v:'castre',l:'Castré'}]).forEach(o=>{
    const b=document.createElement('button'); b.type='button'; b.className='pill';
    b.setAttribute('aria-pressed', S.statut===o.v?'true':'false'); b.textContent=o.l;
    b.title='La prostate ne s’interprète pas de la même façon : l’hyperplasie bénigne '+
      'régresse après castration, la tumeur non.';
    b.addEventListener('click',()=>{ S.statut = S.statut===o.v?null:o.v; rendre(); });
    zst.appendChild(b);
  });
  const zcy=document.getElementById('cycleZone'); zcy.innerHTML='';
  if(fem){
    [{v:'anoestrus',l:'Anœstrus'},{v:'prooestrus',l:'Proœstrus'},{v:'oestrus',l:'Œstrus'},
     {v:'dioestrus',l:'Diœstrus'},{v:'postpartum',l:'Post-partum'}].forEach(o=>{
      const b=document.createElement('button'); b.type='button'; b.className='pill mini';
      b.setAttribute('aria-pressed', S.cycle===o.v?'true':'false'); b.textContent=o.l;
      b.title='Conditionne l’interprétation : un utérus large est banal en diœstrus, '+
        'suspect en anœstrus.';
      b.addEventListener('click',()=>{ S.cycle = S.cycle===o.v?null:o.v; rendre(); });
      zcy.appendChild(b);
    });
  } else S.cycle=null;

  const ipo=document.getElementById('poids'); ipo.value = S.poids==null?'':S.poids;
  const iag=document.getElementById('age');   iag.value = S.age==null?'':S.age;

  const ia=document.getElementById('aorte');
  ia.disabled = !S.espece;
  ia.value = S.aorte==null?'':S.aorte;
  document.getElementById('aorteAide').textContent = S.espece==='chien'
    ? 'rapport rein/aorte et rapport porte/aorte — diamètre maximal'
    : (S.espece==='chat' ? 'sert au rapport porte/aorte ; inutile pour le rein' : '');

  // Un foie hyper ou hypoéchogène ne peut plus servir d'étalon au cortex rénal :
  // la comparaison bascule d'office sur la rate.
  if(!S.foie.nonVu && foieExamine() && echoFoie()!=='normale') S.foieAnormal=true;

  // La série filtre l'affichage de chaque zone. Le contenu de S n'est jamais
  // touché : un organe masqué garde sa saisie et reste au compte-rendu.
  const zone=(id, cle, produire)=>{
    const z=document.getElementById(id); z.innerHTML='';
    z.hidden = !organeDansSerie(cle);
    if(!z.hidden) produire(z);
    return z;
  };

  const zr=document.getElementById('reins'); zr.innerHTML='';
  zr.hidden = !organeDansSerie('rein_G');
  if(!zr.hidden){
    zr.appendChild(ligneLibre(rendreRein('G'),'rein_G'));
    zr.appendChild(ligneLibre(rendreRein('D'),'rein_D'));
  }

  zone('vessieZone','vessie', z=>z.appendChild(ligneLibre(rendreVessie(),'vessie')));

  // Prostate repliée : pas de champ libre, le bloc n'est qu'un bouton de
  // dépliage. Déplier d'abord, écrire ensuite.
  zone('prostateZone','prostate', z=>{
    if(prostateRepliee()) z.appendChild(rendreProstateRepliee());
    else if(prostatePertinente()) z.appendChild(ligneLibre(rendreProstate(),'prostate'));
  });

  zone('foieZone2','foie', z=>z.appendChild(ligneLibre(rendreFoie(),'foie')));
  zone('vbZone','vb', z=>z.appendChild(ligneLibre(rendreVB(),'vb')));

  const zsr=document.getElementById('surrenales'); zsr.innerHTML='';
  zsr.hidden = !organeDansSerie('surrenale_G');
  if(!zsr.hidden){
    zsr.appendChild(ligneLibre(rendreSurrenale('G'),'surrenale_G'));
    zsr.appendChild(ligneLibre(rendreSurrenale('D'),'surrenale_D'));
  }
  zone('rateZone','rate', z=>z.appendChild(ligneLibre(rendreRate(),'rate')));
  zone('estomacZone','estomac', z=>z.appendChild(ligneLibre(rendreEstomac(),'estomac')));
  zone('intestinsZone','intestins', z=>z.appendChild(ligneLibre(rendreIntestins(),'intestins')));
  zone('pancreasZone','pancreas', z=>z.appendChild(ligneLibre(rendrePancreas(),'pancreas')));
  zone('nlZone','nl', z=>z.appendChild(ligneLibre(rendreNL(),'nl')));
  zone('vascZone','vasc', z=>z.appendChild(ligneLibre(rendreVasc(),'vasc')));

  const zt=document.getElementById('testicules'); zt.innerHTML='';
  zt.hidden = !organeDansSerie('testicule_G');
  if(!zt.hidden && testiculePertinent()){
    if(testiculesReplies()) zt.appendChild(rendreTesticulesReplies());
    else {
      zt.appendChild(ligneLibre(rendreTesticule('G'),'testicule_G'));
      zt.appendChild(ligneLibre(rendreTesticule('D'),'testicule_D'));
    }
  }

  const zu=document.getElementById('uterusZone'); zu.innerHTML='';
  const zo=document.getElementById('ovaires'); zo.innerHTML='';
  zu.hidden = !organeDansSerie('uterus');
  zo.hidden = !organeDansSerie('ovaire_G');
  if(genitalPertinent()){
    if(!zu.hidden) zu.appendChild(ligneLibre(rendreUterus(),'uterus'));
    if(!zo.hidden){
      zo.appendChild(ligneLibre(rendreOvaire('G'),'ovaire_G'));
      zo.appendChild(ligneLibre(rendreOvaire('D'),'ovaire_D'));
    }
  }

  rendreBarreSerie();
  genererCR(synthese());
  focusApres(memo);
}

// Barre de sélection, posée au-dessus des organes. Elle affiche aussi les
// organes hors série qui portent une saisie : masqués à l'écran, ils restent
// au compte-rendu, et ce décalage doit se voir.
function rendreBarreSerie(){
  const z=document.getElementById('serieZone'); if(!z) return;
  z.innerHTML='';
  const cur=serieCourante();
  const tout=document.createElement('button'); tout.type='button';
  tout.className='pill'+(cur?'':' actif');
  tout.setAttribute('aria-pressed', cur?'false':'true');
  tout.textContent='Tout';
  tout.title='Aucun filtre : tous les organes sont affichés';
  tout.addEventListener('click',()=>{ S.serie=null; rendre(); });
  z.appendChild(tout);
  SERIES.forEach(s=>{
    const b=document.createElement('button'); b.type='button';
    b.className='pill'+(S.serie===s.k?' actif':'');
    b.setAttribute('aria-pressed', S.serie===s.k?'true':'false');
    b.textContent=s.l; if(s.t) b.title=s.t;
    b.addEventListener('click',()=>{ S.serie = S.serie===s.k ? null : s.k; rendre(); });
    z.appendChild(b);
  });
  if(cur){
    const c=document.createElement('span'); c.className='check';
    c.setAttribute('role','checkbox'); c.setAttribute('tabindex','0');
    c.setAttribute('aria-checked', S.protocoleAuCR?'true':'false');
    c.title='Ajoute au pied du compte-rendu l’étendue réelle de l’examen : '+
      'le silence sur un organe ne se confond plus avec « organe normal »';
    c.innerHTML='<span class="box"></span>Mentionner le protocole au CR';
    const f=()=>{ S.protocoleAuCR=!S.protocoleAuCR; rendre(); };
    c.addEventListener('click',f);
    c.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); f(); } });
    z.appendChild(c);
  }
  const hs=organesHorsSerieRemplis();
  const av=document.getElementById('serieAvis');
  if(av){
    if(hs.length){
      av.hidden=false;
      av.textContent='⚠ Hors série mais renseigné'+(hs.length>1?'s':'')+', et donc '+
        'toujours au compte-rendu : '+hs.join(', ').toLowerCase()+
        '. Repasser sur « Tout » pour les revoir.';
    } else av.hidden=true;
  }
}
