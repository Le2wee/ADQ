function phraseRate(){
  const r=S.rate;
  if(r.nonVu) return 'RATE\nNon explorée.';
  if(!rateExaminee()) return null;
  const L=[];
  const TAILLE={normale:'de taille normale', augmentee:'de taille augmentée'};
  const CTR={reguliers:'réguliers', irreguliers:'irréguliers', bosseles:'bosselés'};
  const STR={homogene:'homogène', heterogene:'hétérogène', mitee:'d’aspect mité, en nid d’abeille'};
  const ECH={normale:'conservée', diminuee:'diminuée', augmentee:'augmentée'};

  L.push('Rate '+Q(TAILLE[r.taille], r.taille!=='normale')+
    ', contours '+Q(CTR[r.contours], r.contours!=='reguliers')+'.');
  L.push('Échogénicité '+Q(ECH[r.echo], r.echo!=='normale')+
    ', structure '+Q(STR[r.structure], r.structure!=='homogene')+'.');

  const les=[];
  if(r.nodules){
    const q=libelleQuantite(r, 'nodules', 'nodule', false);
    let s=q.t;
    if(r.nodulesTaille!=null) s+=mesureDuPlusGrand(q.pluriel, r.nodulesTaille, false, 0);
    if(r.nodulesEcho) s+=', '+accordEcho(r.nodulesEcho, q.pluriel);
    les.push(s);
  }
  if(r.infarctus) les.push('zones hypoéchogènes périphériques compatibles avec des infarctus');
  if(les.length) L.push(M('Présence '+de(les[0])+(les.length>1?' ; '+les.slice(1).join(' ; '):''),true)+'.');
  else if(!r.masse) L.push('Pas de nodule ni d’infarctus visualisé.');

  if(r.masse){
    const d=[r.masseL,r.masseH].filter(x=>x!=null);
    let s='Masse splénique';
    if(d.length) s+=' mesurant '+d.map(x=>nb(x,0)).join(' × ')+' mm';
    const q=[];
    if(r.masseEcho) q.push(MOT[r.masseEcho]);
    if(r.masseHomo) q.push(MOT[r.masseHomo]);
    if(r.masseContours) q.push('à contours '+MOT[r.masseContours]);
    if(r.masseVasc) q.push(MOT[r.masseVasc]);
    if(q.length) s+=', '+q.join(', ');
    L.push(M(s,true)+'.');
  }

  const fin=[];
  fin.push(r.veine==='normale' ? 'veine splénique normale'
    : M('veine splénique '+(r.veine==='dilatee'?'dilatée':'thrombosée'),true));
  fin.push(r.epanchement ? M('épanchement de voisinage',true) : 'pas d’épanchement de voisinage');
  let der=fin.join(', ');
  der=der.replace(/^(<mark[^>]*>)?([a-zà-ÿ])/, function(x,b,c){ return (b||'')+c.toUpperCase(); });
  L.push(der+'.');

  return 'RATE\n'+L.join('\n');
}

function syntheseSurrenalesRate(items, lignes){
  // --- Surrénales ---
  if(surrenalesExaminees()){
    const vD=surrenaleVerdict('D'), vG=surrenaleVerdict('G');
    const hautD = vD && vD.verdict==='haut', hautG = vG && vG.verdict==='haut';
    const basD  = vD && vD.verdict==='bas',  basG  = vG && vG.verdict==='bas';
    if(hautD && hautG){
      items.push({t:'surrénales épaissies, symétriques', c:'alerte'});
      lignes.push('Deux surrénales épaissies et symétriques : hyperadrénocorticisme '+
        'hypophyso-dépendant au premier plan.');
    } else if((hautD && !hautG) || (hautG && !hautD)){
      const g = hautD?'droite':'gauche', a = hautD?'gauche':'droite';
      const autre = S['sr'+(hautD?'G':'D')];
      items.push({t:'surrénale '+g+' épaissie isolément', c:'alerte'});
      lignes.push('Surrénale '+g+' épaissie alors que la '+a+' ne l’est pas'+
        ((hautD?basG:basD)?', celle-ci étant même atrophiée':'')+
        ' : tumeur surrénalienne sécrétante'+
        (S.espece==='chat'?', et chez le chat hyperaldostéronisme en premier lieu':
          ' — adénome, adénocarcinome ou phéochromocytome')+'.');
    }
    if(basD && basG){
      items.push({t:'surrénales fines', c:'alerte'});
      lignes.push('Deux surrénales fines : hypocorticisme. Une imprégnation cortisonique '+
        'exogène donne la même image.');
    }
    ['D','G'].forEach(c=>{
      const s=S['sr'+c];
      if(!surrenaleSaisie(c)) return;
      const lib=c==='D'?'droite':'gauche';
      if(s.masse){
        items.push({t:'masse surrénalienne — '+lib, c:'alerte'});
        lignes.push('Masse surrénalienne '+lib+' : adénome, adénocarcinome ou '+
          'phéochromocytome'+(S.espece==='chat'?', ou adénome sécrétant de l’aldostérone':'')+'.');
      }
      if(s.invasion){
        items.push({t:'invasion vasculaire — '+lib, c:'alerte'});
        lignes.push('Invasion de la veine phrénico-abdominale ou de la veine cave caudale '+
          'par la lésion surrénalienne '+lib+' : signe de malignité, et le phéochromocytome '+
          'en est le premier pourvoyeur.');
      }
    });
  }
  // --- Rate ---
  const r=S.rate;
  if(!rateExaminee() || r.nonVu) return;
  if(r.masse){
    items.push({t:'masse splénique', c:'alerte'});
    lignes.push('Masse splénique'+(r.epanchement?' avec épanchement abdominal':'')+' : '+
      (S.espece==='chien'
        ? 'hémangiosarcome au premier plan'+(r.epanchement?', l’épanchement faisant craindre une rupture':'')+
          ', mais hématome, hyperplasie nodulaire et lymphome partagent cette image'
        : 'lymphome et mastocytose en premier lieu chez le chat')+'.');
  }
  if(r.structure==='mitee'){
    items.push({t:'rate mitée', c:'alerte'});
    lignes.push('Rate d’aspect mité ou en nid d’abeille : lymphome et mastocytose '+
      'en premier lieu.');
  }
  if(r.nodules && !r.masse){
    items.push({t:'nodules spléniques', c:''});
    lignes.push('Nodules spléniques : hyperplasie nodulaire bénigne en premier lieu chez '+
      'un chien âgé, mais hémangiosarcome et lymphome donnent la même image.');
  }
  if(r.taille==='augmentee' && r.echo==='diminuee' && r.contours!=='reguliers'){
    items.push({t:'torsion splénique à écarter', c:'alerte'});
    lignes.push('Rate très augmentée, hypoéchogène et à contours modifiés : torsion '+
      'splénique à écarter — l’absence de flux au Doppler la confirme.');
  } else if(r.taille==='augmentee'){
    items.push({t:'splénomégalie', c:''});
    lignes.push('Splénomégalie'+(S.espece==='chat'
      ? ' : chez le chat, elle est plus souvent pathologique que chez le chien — '+
        'lymphome, mastocytose, hyperplasie lymphoïde'
      : ' : congestion, notamment sous sédation, hyperplasie lymphoïde, infiltration '+
        'néoplasique ou hématopoïèse extramédullaire')+'.');
  }
  if(r.veine==='thrombosee'){
    items.push({t:'thrombose splénique', c:'alerte'});
    lignes.push('Veine splénique thrombosée : état d’hypercoagulabilité — néphropathie '+
      'protéinurique, hyperadrénocorticisme, néoplasie, anémie hémolytique à médiation immune.');
  }
  if(r.infarctus){
    items.push({t:'infarctus spléniques', c:''});
    lignes.push('Infarctus spléniques : ils accompagnent une thrombose, une torsion, '+
      'ou une infiltration néoplasique.');
  }
}

// ===================== IMAGES PAR ORGANE =====================
// Une image d'échographie brute pèse 1 à 2 Mo. Dix images et le compte-rendu
// devient impossible à imprimer ou à envoyer : on redimensionne et on
// recompresse à l'import, dans le navigateur, avant de garder quoi que ce soit.
// Les images vivent le temps de l'examen, comme le reste de la saisie. Elles
// ne sont conservées que si l'examen est enregistré dans le dossier patient,
// et seulement si l'on a coché de les inclure.
const IMG_LARGEUR_MAX = 1280;
const IMG_QUALITE = 0.82;

function imagesDe(cle){
  if(!S.images[cle]) S.images[cle]=[];
  return S.images[cle];
}
function toutesImages(){
  return Object.keys(S.images).reduce((n,k)=>n+S.images[k].length, 0);
}
// Import séquentiel : plusieurs fichiers lourds en parallèle saturent la page.
function importerImages(cible, fichiers, apres){
  const restants=[...fichiers];
  const suivant=()=>{
    if(!restants.length){ if(apres) apres(); return; }
    const f=restants.shift();
    if(!/^image\//.test(f.type||'')){ suivant(); return; }
    const fr=new FileReader();
    fr.onerror=suivant;
    fr.onload=()=>{
      const im=new Image();
      im.onerror=suivant;
      im.onload=()=>{
        try{
          const ech=Math.min(1, IMG_LARGEUR_MAX/im.width);
          const c=document.createElement('canvas');
          c.width=Math.max(1,Math.round(im.width*ech));
          c.height=Math.max(1,Math.round(im.height*ech));
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          cible.push({src:c.toDataURL('image/jpeg',IMG_QUALITE), legende:''});
        }catch(e){}
        suivant();
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(f);
  };
  suivant();
}

function blocImages(parent, cle){
  const cible=imagesDe(cle);
  const b=bloc(parent,'Images'+(cible.length?' ('+cible.length+')':''));
  if(cible.length){
    const g=document.createElement('div'); g.className='vignettes';
    cible.forEach((img,k)=>{
      const d=document.createElement('div'); d.className='vignette';
      const i=document.createElement('img'); i.src=img.src; i.alt=''; d.appendChild(i);
      const l=document.createElement('input'); l.type='text'; l.placeholder='Légende';
      l.value=img.legende||'';
      // Pas de rendu à chaque frappe : le champ serait recréé sous le curseur.
      l.addEventListener('input',()=>{ img.legende=l.value; });
      l.addEventListener('blur',()=>{ img.legende=l.value; rendre(); });
      d.appendChild(l);
      const barre=document.createElement('div'); barre.className='vignette-actions';
      if(k>0){
        const g2=document.createElement('button'); g2.type='button'; g2.className='btn ghost';
        g2.textContent='←'; g2.title='Déplacer vers la gauche';
        g2.addEventListener('click',()=>{ const t=cible[k-1]; cible[k-1]=cible[k]; cible[k]=t; rendre(); });
        barre.appendChild(g2);
      }
      if(k<cible.length-1){
        const d2=document.createElement('button'); d2.type='button'; d2.className='btn ghost';
        d2.textContent='→'; d2.title='Déplacer vers la droite';
        d2.addEventListener('click',()=>{ const t=cible[k+1]; cible[k+1]=cible[k]; cible[k]=t; rendre(); });
        barre.appendChild(d2);
      }
      const x=document.createElement('button'); x.type='button'; x.className='btn ghost';
      x.textContent='Retirer';
      x.addEventListener('click',()=>{ cible.splice(k,1); rendre(); });
      barre.appendChild(x);
      d.appendChild(barre);
      g.appendChild(d);
    });
    b.appendChild(g);
  }
  const f=document.createElement('input'); f.type='file'; f.accept='image/*'; f.multiple=true;
  f.style.fontSize='12px'; f.style.marginTop='4px';
  f.addEventListener('change',()=>{
    if(f.files && f.files.length) importerImages(cible, f.files, rendre);
  });
  b.appendChild(f);
  return b;
}

// ===================== ESTOMAC, INTESTINS, NŒUDS, VAISSEAUX =====================
// ┌──────────────────────────────────────────────────────────────────────────┐
// │ VALEURS DE RÉFÉRENCE DIGESTIVES — un seul endroit à modifier.            │
// └──────────────────────────────────────────────────────────────────────────┘
// Valeurs de Bébou (planches de cours, 08/10/2026). Chien : paliers de poids
// pour le duodénum et le jéjunum. L'épaisseur gastrique se mesure ENTRE les plis.
// Les bornes basses sont documentées mais non utilisées : seul l'épaississement
// est signalé, décision de Bébou.
const REF_DIGESTIF = {
  chien:{
    estomac: {min:3.0, max:5.0},
    duodenum:{min:3.0, paliers:[{jusqua:20,max:5.1},{jusqua:30,max:5.3},{jusqua:1e9,max:6.0}]},
    jejunum: {min:2.0, paliers:[{jusqua:20,max:4.1},{jusqua:30,max:4.4},{jusqua:1e9,max:4.7}]},
    ileon:   {min:2.0, max:4.0},
    colon:   {max:2.0}
  },
  chat:{
    estomac: {min:2.0, max:3.6},
    duodenum:{min:2.0, max:2.5},
    jejunum: {min:2.0, max:2.5},
    ileon:   {min:2.5, max:3.2},
    colon:   {max:1.7}
  }
};
// Part de chaque couche dans l'épaisseur pariétale, à l'état normal.
// Estomac et côlon : couches d'épaisseur égale. Iléon : proéminence de la
// sous-muqueuse et de la musculeuse — pas de part chiffrée dans la source.
const REF_COUCHES = {
  // Estomac et côlon : les quatre couches se partagent la paroi à parts égales,
  // soit 25 % chacune — mêmes valeurs pour les deux espèces.
  parts:{
    chien:{ estomac:{muq:25, mus:25}, duodenum:{muq:63, mus:13},
            jejunum:{muq:60, mus:15}, colon:{muq:25, mus:25} },
    chat: { estomac:{muq:25, mus:25}, duodenum:{muq:58, mus:13},
            jejunum:{muq:55, mus:14}, colon:{muq:25, mus:25} }
  },
  // Seul l'iléon reste décrit sans chiffre dans la planche.
  aspect:{
    ileon:'proéminence de la sous-muqueuse et de la musculeuse'
  },
  // Marge de part et d'autre de la référence, en POINTS de pourcentage.
  // Dix points : au-dessus du bruit de mesure partout. La musculeuse d'un
  // jéjunum de chat fait 0,34 mm pour 2,4 mm de paroi — mesurée à 0,1 mm près,
  // c'est déjà 4 points d'incertitude, et l'erreur sur l'épaisseur totale s'y
  // ajoute. Une marge plus serrée signalerait du bruit.
  tolerance:10
};
// Répartition normale attendue pour un segment. null = inconnue ici, et il ne
// faut alors rien affirmer : sans espèce, duodénum et jéjunum ne sont pas décrits.
function couchesAttendues(seg){
  const pa = S.espece ? (REF_COUCHES.parts[S.espece][seg]||null) : null;
  if(pa) return {parts:pa, lib:'normal : muq. '+pa.muq+' % · mus. '+pa.mus+' %'};
  if(REF_COUCHES.aspect[seg]) return {parts:null, lib:'normal : '+REF_COUCHES.aspect[seg]};
  return null;
}
// Contractions par minute, à jeun.
const REF_PERISTALTISME = {
  estomac:{min:3, max:5},
  grele:  {min:1, max:4},
  colon:  {min:0, max:0}
};
// Borne haute de la paroi pour un segment, selon l'espèce et le poids.
// max null = la borne existe mais le poids manque pour la choisir.
function borneDigestive(seg){
  if(!S.espece) return null;
  const r=REF_DIGESTIF[S.espece][seg];
  if(!r.paliers) return {max:r.max, min:r.min, lib:'≤ '+nb(r.max)+' mm'};
  if(S.poids==null) return {max:null, min:r.min, lib:'renseigner le poids'};
  const pal=r.paliers.find(x=>S.poids<=x.jusqua);
  return {max:pal.max, min:r.min,
    lib:'≤ '+nb(pal.max)+' mm pour '+nb(S.poids,0)+' kg'};
}
const CONTENU_ESTOMAC = [
  {v:'liquidien',   l:'Liquidien'},
  {v:'alimentaire', l:'Alimentaire'},
  {v:'gazeux',      l:'Gazeux'}
];
const COUCHES = [
  {k:'muqueuse',     l:'Muqueuse'},
  {k:'sousmuqueuse', l:'Sous-muqueuse'},
  {k:'musculeuse',   l:'Musculeuse'},
  {k:'toutes',       l:'Toutes'}
];
const REF_NL = {
  epaisseur:5.0,     // jéjunaux et iliaques médiaux chez l'adulte
  jeune:10.0,        // avant un an, des nœuds jéjunaux plus épais restent normaux
  ratioMin:2.0       // longueur / épaisseur : en dessous, le nœud s'est arrondi
};
const SEGMENTS = [
  {k:'duodenum', l:'Duodénum'}, {k:'jejunum', l:'Jéjunum'},
  {k:'ileon',    l:'Iléon'},    {k:'colon',   l:'Côlon'}
];
const GROUPES_NL = [
  {k:'jejunaux',   l:'Jéjunaux (mésentériques)'},
  {k:'iliaques',   l:'Iliaques médiaux (sublombaires)'},
  {k:'hepatiques', l:'Hépatiques'},
  {k:'spleniques', l:'Spléniques'},
  {k:'gastriques', l:'Gastriques'}
];
// Les pastilles se désélectionnent au second clic : null veut dire « non
// renseigné », pas « anormal ». Tout test d'écart doit l'exclure, sinon
// l'outil décrit une anomalie là où il n'y a qu'une case décochée.
function horsDefaut(v, defaut){ return v!=null && v!==defaut; }
function contractions(n){ return nb(n,0)+' contraction'+(Math.abs(n)>1?'s':'')+'/min'; }

// ---------- ESTOMAC ----------
function estomacVide(){
  return {
    nonVu:false,
    paroi:null,                 // mesurée ENTRE les plis
    strat:'conservee',          // conservee | perdue
    couche:null,                // muqueuse | sousmuqueuse | musculeuse | toutes
    muq:null, mus:null,         // épaisseur mesurée des deux couches, en mm
    // Un estomac peut être liquidien ET alimentaire : ensemble, pas valeur unique.
    // Vide s'exclut du reste ; vide = ensemble vide.
    contenu:new Set(),          // liquidien | alimentaire | gazeux
    corpsEtranger:false, ceDesc:'',
    peristaltisme:'normal',     // normal | diminue | absent | augmente
    peristaltismeN:null,        // contractions / minute, à jeun — prioritaire
    vidange:'normale'           // normale | retardee
  };
}
// Le nombre de contractions, quand il est compté, l'emporte sur la pastille.
function peristaltismeEffectif(obj, ref){
  const n=obj.peristaltismeN;
  if(n==null) return obj.peristaltisme;
  if(n<=0) return 'absent';
  if(n<ref.min) return 'diminue';
  if(n>ref.max) return 'augmente';
  return 'normal';
}
function paroiEstomac(){
  const e=S.estomac;
  if(e.nonVu || e.paroi==null) return null;
  const b=borneDigestive('estomac');
  if(!b) return {v:e.paroi, max:null, lib:'renseigner l’espèce', verdict:null};
  if(b.max==null) return {v:e.paroi, max:null, lib:b.lib, verdict:null};
  return {v:e.paroi, max:b.max, lib:b.lib, verdict: e.paroi>b.max?'haut':'normal'};
}
function estomacExamine(){
  const e=S.estomac;
  if(e.nonVu) return false;
  return e.paroi!=null || horsDefaut(e.strat,'conservee') || e.couche!=null ||
    e.muq!=null || e.mus!=null ||
    e.contenu.size>0 || e.corpsEtranger || e.peristaltismeN!=null ||
    horsDefaut(e.peristaltisme,'normal') || horsDefaut(e.vidange,'normale');
}
function anomalieEstomac(){
  const e=S.estomac;
  if(!estomacExamine()) return false;
  const p=paroiEstomac();
  if(p && p.verdict==='haut') return true;
  const c=partsCouches('estomac', e);
  if(horsDefaut(e.strat,'conservee') || e.couche!=null || (c && c.ecart) ||
     e.corpsEtranger) return true;
  if(horsDefaut(peristaltismeEffectif(e,REF_PERISTALTISME.estomac),'normal')) return true;
  if(horsDefaut(e.vidange,'normale')) return true;
  return false;
}

// ---------- INTESTINS ----------
function segmentVide(){
  return {paroi:null, strat:'conservee',
    couche:null,        // strate épaissie : muqueuse | sousmuqueuse | musculeuse | toutes
    muq:null, mus:null  // épaisseur mesurée de la muqueuse et de la musculeuse, en mm
  };
}
// Part de chaque couche dans l'épaisseur pariétale mesurée.
function partsCouches(seg, obj){
  const sg = obj || S.intestins[seg];
  if(sg.paroi==null || sg.paroi<=0) return null;
  if(sg.muq==null && sg.mus==null) return null;
  const a=couchesAttendues(seg);
  const o={ref: a?a.parts:null};
  if(sg.muq!=null) o.muq = sg.muq/sg.paroi*100;
  if(sg.mus!=null) o.mus = sg.mus/sg.paroi*100;
  const t=REF_COUCHES.tolerance;
  const r=o.ref;
  o.musHaut = !!(r && o.mus!=null && o.mus > r.mus+t);
  o.musBas  = !!(r && o.mus!=null && o.mus < r.mus-t);
  o.muqHaut = !!(r && o.muq!=null && o.muq > r.muq+t);
  o.muqBas  = !!(r && o.muq!=null && o.muq < r.muq-t);
  o.ecart = o.musHaut || o.musBas || o.muqHaut || o.muqBas;
  // Les deux couches mesurées ne peuvent pas dépasser la paroi entière :
  // c'est une erreur de saisie, et les parts qui en sortent n'ont aucun sens.
  o.incoherent = sg.muq!=null && sg.mus!=null && (sg.muq+sg.mus) > sg.paroi;
  return o;
}
// Décrit l'écart d'une couche, en nommant la direction.
function ecartsCouches(c){
  if(!c || !c.ecart) return [];
  const E=[];
  if(c.musHaut) E.push('musculeuse épaissie');
  if(c.musBas)  E.push('musculeuse amincie');
  if(c.muqHaut) E.push('muqueuse épaissie');
  if(c.muqBas)  E.push('muqueuse effacée');
  return E;
}
function intestinsVide(){
  const o={ nonVu:false,
    dilatation:'absente',       // absente | grele | diffuse
    peristaltisme:'normal',     // normal | diminue | absent | augmente
    peristaltismeN:null,        // contractions / minute sur le grêle, à jeun
    contenu:'normal',           // normal | liquidien | gazeux
    corpsEtranger:false, ceDesc:'',
    invagination:false, invaginationSiege:null,
    masse:false, masseSeg:null, masseL:null, masseH:null, masseEcho:null,
    masseHomo:null, masseContours:null, masseVasc:null
  };
  SEGMENTS.forEach(s=>o[s.k]=segmentVide());
  return o;
}
function paroiSegment(k){
  const sg=S.intestins[k];
  if(S.intestins.nonVu || sg.paroi==null) return null;
  const b=borneDigestive(k);
  if(!b || b.max==null) return null;
  return {v:sg.paroi, max:b.max, lib:b.lib, verdict: sg.paroi>b.max?'haut':'normal'};
}
function anoSegment(k){
  const sg=S.intestins[k], p=paroiSegment(k), c=partsCouches(k);
  return (p && p.verdict==='haut') || horsDefaut(sg.strat,'conservee') ||
    sg.couche!=null || (c && c.ecart);
}
// Paroi muette : rien n'a été saisi la concernant. Ce n'est pas la même chose
// qu'un organe non exploré — l'organe a été vu, et la paroi s'apprécie à l'œil
// même sans curseur. Le compte-rendu la déclare alors normale.
function paroiEstomacMuette(){
  const e=S.estomac;
  return e.paroi==null && e.muq==null && e.mus==null && e.couche==null &&
    !horsDefaut(e.strat,'conservee');
}
function paroisIntestinalesMuettes(){
  return !SEGMENTS.some(s=>segmentSaisi(s.k));
}
// Deux formulations : la courte vient après « Examen dans les limites de la
// normale », qui dit déjà la normalité ; la longue se suffit à elle-même.
const PHRASE_PAROI_NORMALE =
  'Paroi d’épaisseur subjectivement normale, structure en couches conservée.';
const PHRASE_PAROI_COURTE = 'Structure en couches conservée.';
const PHRASE_PAROIS_NORMALES =
  'Parois d’épaisseur subjectivement normale, structure en couches conservée '+
  'sur l’ensemble des segments.';
const PHRASE_PAROIS_COURTE = 'Structure en couches conservée sur l’ensemble des segments.';
// Paroi mesurée sans détail des couches : c'est que leur répartition n'avait
// rien à signaler. Une strate cochée dit le contraire et bloque la phrase.
function couchesImplicitementNormales(obj){
  return obj.paroi!=null && obj.muq==null && obj.mus==null && obj.couche==null;
}

// Mesure brute d'un segment, même quand la borne n'est pas calculable
// (chien dont le poids n'est pas renseigné) : le chiffre doit figurer au CR.
function mesureSegment(k){
  const sg=S.intestins[k];
  if(S.intestins.nonVu || sg.paroi==null) return null;
  const p=paroiSegment(k);
  if(p) return p;
  const b=borneDigestive(k);
  return {v:sg.paroi, max:null, lib:b?b.lib:'référence indisponible', verdict:null};
}
// Un segment mesuré dont la borne n'est pas calculable ne peut pas être
// déclaré normal : sans le poids, le duodénum et le jéjunum ne sont pas jugeables.
function segmentNonJugeable(k){
  const m=mesureSegment(k);
  return !!(m && m.verdict==null);
}
function intestinsJugeables(){ return !SEGMENTS.some(s=>segmentNonJugeable(s.k)); }
function segmentSaisi(k){
  const sg=S.intestins[k];
  return sg.paroi!=null || horsDefaut(sg.strat,'conservee') || sg.couche!=null ||
    sg.muq!=null || sg.mus!=null;
}
function intestinsExamines(){
  const i=S.intestins;
  if(i.nonVu) return false;
  return SEGMENTS.some(s=>segmentSaisi(s.k)) ||
    horsDefaut(i.dilatation,'absente') || horsDefaut(i.peristaltisme,'normal') ||
    i.peristaltismeN!=null ||
    horsDefaut(i.contenu,'normal') || i.corpsEtranger || i.invagination || i.masse;
}
function anomalieIntestins(){
  const i=S.intestins;
  if(!intestinsExamines()) return false;
  if(SEGMENTS.some(s=>anoSegment(s.k))) return true;
  if(horsDefaut(i.dilatation,'absente') ||
     horsDefaut(peristaltismeEffectif(i,REF_PERISTALTISME.grele),'normal') ||
     horsDefaut(i.contenu,'normal')) return true;
  if(i.corpsEtranger || i.invagination || i.masse) return true;
  return false;
}

// ---------- NŒUDS LYMPHATIQUES ----------
// Un groupe ganglionnaire contient plusieurs nœuds, et c'est souvent UN nœud
// du lot qui parle — arrondi, hypoéchogène, au milieu de voisins normaux.
// Chaque nœud porte donc ses propres mesures ET sa propre forme : décrire la
// forme au niveau du groupe obligerait à étendre à tous ce qu'on a vu sur un.
function noeudNLVide(){ return {ep:null, lg:null, forme:'allongee', echo:'normale'}; }
function nlVide(){
  const o={nonVu:false};
  GROUPES_NL.forEach(g=>o[g.k]={vu:false, noeuds:[noeudNLVide()]});
  return o;
}
// Avant un an, des nœuds jéjunaux plus épais restent normaux.
function borneNL(k){
  const an=ageEffectif();
  if(k==='jejunaux' && an!=null && an<1) return REF_NL.jeune;
  return REF_NL.epaisseur;
}
// Verdict d'UN nœud. Le groupe n'a pas de mesure propre : il a des nœuds.
function verdictNoeud(k, nd){
  if(!nd || nd.ep==null) return null;
  const max=borneNL(k);
  const ratio = (nd.lg!=null && nd.ep>0) ? nd.lg/nd.ep : null;
  // La forme prime : un nœud qui s'arrondit parle plus fort qu'un nœud un peu gros.
  const arrondi = ratio!=null && ratio<REF_NL.ratioMin;
  return {ep:nd.ep, max:max, ratio:ratio, arrondi:arrondi,
    verdict: (nd.ep>max||arrondi) ? 'haut' : 'normal'};
}
function noeudsDe(k){ const o=S.nl[k]; return (o && o.noeuds) ? o.noeuds : []; }
// Un nœud est « saisi » dès qu'il porte une mesure ou un caractère hors défaut.
function noeudSaisi(nd){
  return nd.ep!=null || nd.lg!=null ||
    horsDefaut(nd.forme,'allongee') || horsDefaut(nd.echo,'normale');
}
function anoNoeud(k, nd){
  const v=verdictNoeud(k, nd);
  return (v && v.verdict==='haut') || horsDefaut(nd.forme,'allongee') ||
    horsDefaut(nd.echo,'normale');
}
// Verdict du groupe : celui du nœud le plus parlant. Un seul nœud anormal
// suffit à rendre le groupe anormal — c'est tout l'intérêt de les saisir un à un.
function verdictNL(k){
  const o=S.nl[k];
  if(!o.vu) return null;
  let pire=null;
  noeudsDe(k).forEach(nd=>{
    const v=verdictNoeud(k, nd);
    if(!v) return;
    if(!pire) { pire=v; return; }
    if(v.verdict==='haut' && pire.verdict!=='haut') pire=v;
    else if(v.verdict===pire.verdict && v.ep>pire.ep) pire=v;
  });
  return pire;
}
function anoNL(k){
  const o=S.nl[k]; if(!o.vu) return false;
  return noeudsDe(k).some(nd=>anoNoeud(k, nd));
}
function nlSaisis(){
  return !S.nl.nonVu && GROUPES_NL.some(g=>S.nl[g.k].vu);
}
function anomalieNL(){
  if(!nlSaisis()) return false;
  return GROUPES_NL.some(g=>anoNL(g.k));
}

function vascVide(){

    aorteSiege:null,        // trifurcation | abdominale
    cave:'normale',         // normale | distendue | collabee | thrombus
    epanchement:false, abondance:null,   // minime | modere | abondant

  };
}
function vascExaminee(){
  const v=S.vasc;

    v.epanchement || v.graisse || v.carcinose;
}
function anomalieVasc(){ return vascExaminee(); }

// Mesure des deux couches et affichage de leurs parts. Commune à l'estomac
// et aux segments intestinaux.
function ligneCouchesMesurees(parent, obj, seg){
  const l=document.createElement('div'); l.className='ligne';
  l.innerHTML='<span class="nom large">Muqueuse × musculeuse</span>';
  [['muq','Muq.'],['mus','Mus.']].forEach(([k,lab])=>{
    const inp=document.createElement('input'); inp.type='number'; inp.step='0.1'; inp.min='0';
    inp.style.width='62px'; inp.placeholder=lab; inp.value=obj[k]==null?'':obj[k];
    inp.addEventListener('change',()=>{ const x=inp.value===''?null:parseFloat(inp.value);
      obj[k]=isNaN(x)?null:x; rendre(); });
    l.appendChild(inp);
  });
  const u=document.createElement('span'); u.className='unite'; u.textContent='mm'; l.appendChild(u);
  const parts=partsCouches(seg, obj);
  if(parts){
    const bits=[];
    if(parts.muq!=null) bits.push('muq. '+nb(parts.muq,0)+' %');
    if(parts.mus!=null) bits.push('mus. '+nb(parts.mus,0)+' %');
    let lib=bits.join(' · ');
    if(parts.incoherent) lib='somme des couches supérieure à la paroi — vérifier la saisie';
    else if(parts.ref) lib+=' (normal '+parts.ref.muq+' / '+parts.ref.mus+
      ' %, marge ±'+REF_COUCHES.tolerance+' pts)';
    verdictTag(l, lib, (parts.ecart||parts.incoherent)?'haut':(parts.ref?'normal':'vide'));
  } else {
    const a=couchesAttendues(seg);
    verdictTag(l, a ? a.lib : 'renseigner l’espèce pour la répartition attendue', 'vide');
  }
  parent.appendChild(l);
  return l;
}
// Ligne de pastilles « quelle strate est épaissie », commune à l'estomac
// et aux segments intestinaux.
function ligneCouche(parent, obj){
  const l=document.createElement('div'); l.className='ligne';
  l.innerHTML='<span class="nom">Strate épaissie</span>';
  pastilles(l, COUCHES.map(c=>({v:c.k, l:c.l,
    t:c.k==='musculeuse'
      ? 'Chez le chat : lymphome à petites cellules, entéropathie chronique — '+
        'elle se repère sans que l’épaisseur totale sorte de la norme'
      : (c.k==='sousmuqueuse' ? 'Œdème, lymphangiectasie, hémorragie pariétale'
      : (c.k==='muqueuse' ? 'Infiltration inflammatoire, lymphangiectasie' : ''))})),
    ()=>obj.couche, x=>obj.couche=x, COUCHES.map(c=>c.k));
  parent.appendChild(l);
  return l;
}
// Champ « contractions par minute », à jeun. Rempli, il l'emporte sur la pastille.
function lignePeristaltisme(parent, obj, ref, libelle){
  const l=champ(parent,'Contractions / min',()=>obj.peristaltismeN,
    x=>obj.peristaltismeN=x,'/min','1',true);
  const n=obj.peristaltismeN;
  verdictTag(l, libelle+' — à jeun',
    n==null ? 'vide' : (n>=ref.min && n<=ref.max ? 'normal' : 'haut'));
  return l;
}

// ---------- RENDU : NŒUDS LYMPHATIQUES ----------
function rendreNL(){
  const n=S.nl;
  const box=document.createElement('div'); box.className='rein nl';
  const t=document.createElement('div'); t.className='rein-titre';
  t.innerHTML='<span>Nœuds lymphatiques abdominaux</span>';
  const bnv=document.createElement('button'); bnv.type='button';
  bnv.className='pill mini'+(n.nonVu?' ano':'');
  bnv.setAttribute('aria-pressed', n.nonVu?'true':'false');
  bnv.textContent='Non explorés';
  bnv.addEventListener('click',()=>{ n.nonVu=!n.nonVu; rendre(); });
  t.appendChild(bnv); box.appendChild(t);
  if(n.nonVu) return box;

  const aide=document.createElement('p'); aide.className='aide';
  aide.innerHTML='<em>C’est la forme qui compte, pas la taille : un nœud normal est '+
    'vermiforme et allongé. Un nœud qui s’arrondit — rapport longueur/épaisseur '+
    'sous 2 — parle plus fort qu’un nœud simplement un peu gros.</em>';
  box.appendChild(aide);

  GROUPES_NL.forEach(g=>{
    const o=n[g.k];
    const b=bloc(box,g.l);
    const lv=document.createElement('div'); lv.className='ligne';
    pastilles(lv,[{v:false,l:'Non visualisés'},{v:true,l:'Visualisés'}],
      ()=>o.vu,x=>o.vu=x===null?false:x,[]);
    b.appendChild(lv);
    // Groupe non visualisé : on remet UN nœud vierge, pas zéro — rouvrir le
    // groupe doit retrouver une ligne de saisie, pas un bloc vide.
    if(!o.vu){ o.noeuds=[noeudNLVide()]; return; }
    if(!o.noeuds || !o.noeuds.length) o.noeuds=[noeudNLVide()];

    o.noeuds.forEach((nd, idx)=>{
      const multi = o.noeuds.length>1;
      const sb = multi ? sousBloc(b, 'Nœud '+(idx+1), anoNoeud(g.k, nd)) : b;
      const lm=document.createElement('div'); lm.className='ligne';
      lm.innerHTML='<span class="nom">Épaisseur × longueur</span>';
      [['ep','Ép.'],['lg','Long.']].forEach(([cle,lab])=>{
        const i=document.createElement('input'); i.type='number'; i.step='0.1'; i.min='0';
        i.style.width='62px'; i.placeholder=lab; i.value=nd[cle]==null?'':nd[cle];
        i.addEventListener('change',()=>{
          const x=i.value===''?null:parseFloat(i.value); nd[cle]=isNaN(x)?null:x; rendre();
        });
        lm.appendChild(i);
      });
      const u=document.createElement('span'); u.className='unite'; u.textContent='mm'; lm.appendChild(u);
      const v=verdictNoeud(g.k, nd);
      if(v){
        let lib='≤ '+nb(v.max)+' mm';
        if(v.ratio!=null) lib+=' · L/É '+nb(v.ratio,1);
        verdictTag(lm, lib, v.verdict==='haut'?'haut':'normal');
      }
      // Retrait d'un nœud : seulement s'il en reste un après. Jamais zéro.
      if(multi){
        const x=document.createElement('button'); x.type='button'; x.className='pill mini btn-retirer';
        x.textContent='×'; x.title='Retirer ce nœud';
        x.setAttribute('aria-label','Retirer le nœud '+(idx+1));
        x.addEventListener('click',()=>{ o.noeuds.splice(idx,1); rendre(); });
        lm.appendChild(x);
      }
      sb.appendChild(lm);
      [['Forme','forme',[{v:'allongee',l:'Allongée'},
          {v:'arrondie',l:'Arrondie',t:'Signe d’alerte principal : un nœud malin s’arrondit'}],['arrondie']],
       ['Échogénicité','echo',[{v:'normale',l:'Normale'},
          {v:'hypo',l:'Hypoéchogène'},{v:'anecho',l:'Quasi anéchogène'}],['hypo','anecho']]
      ].forEach(([nom,cle,opts,ano])=>{
        const l=document.createElement('div'); l.className='ligne';
        l.innerHTML='<span class="nom">'+nom+'</span>';
        pastilles(l,opts,()=>nd[cle],x=>nd[cle]=x,ano,defautDe('nlGroupe',cle));
        sb.appendChild(l);
      });
    });

    const la=document.createElement('div'); la.className='ligne';
    const plus=document.createElement('button'); plus.type='button'; plus.className='pill mini btn-ajouter';
    plus.textContent='＋ Ajouter un nœud';
    plus.title='Plusieurs nœuds sont souvent visibles dans une même zone : '+
      'les saisir un par un permet de décrire celui qui sort du lot';
    plus.addEventListener('click',()=>{ o.noeuds.push(noeudNLVide()); rendre(); });
    la.appendChild(plus);
    b.appendChild(la);
  });
  blocImages(box,'nl');
  return box;
}

  pastilles(lc,[{v:'normale',l:'Normale'},
    {v:'distendue',l:'Distendue',t:'Insuffisance cardiaque droite, tamponnade'},
    {v:'collabee',l:'Collabée',t:'Hypovolémie'},{v:'thrombus',l:'Thrombus'}],
    ()=>v.cave,x=>v.cave=x,['distendue','collabee','thrombus'],'normale');
  b1.appendChild(lc);

  const b2=bloc(box,'Péritoine');
  const le=document.createElement('div'); le.className='ligne';
  interrupteur(le,'Épanchement',()=>v.epanchement,x=>v.epanchement=x);
  interrupteur(le,'Graisse hyperéchogène',()=>v.graisse,x=>v.graisse=x,
    'Stéatite : péritonite, pancréatite, processus infiltrant');
  interrupteur(le,'Nodules de carcinose',()=>v.carcinose,x=>v.carcinose=x);
  b2.appendChild(le);
  if(v.epanchement){
    const sa=sousBloc(b2,'Épanchement',true);
    const l=document.createElement('div'); l.className='ligne';
    l.innerHTML='<span class="nom">Abondance</span>';
    pastilles(l,[{v:'minime',l:'Minime'},{v:'modere',l:'Modéré'},{v:'abondant',l:'Abondant'}],
      ()=>v.abondance,x=>v.abondance=x,['modere','abondant']);
    sa.appendChild(l);
  } else v.abondance=null;
  blocImages(box,'vasc');
  return box;
}

// ---------- COMPTE-RENDU : ESTOMAC ----------
function phraseEstomac(){
  const e=S.estomac;
  if(e.nonVu) return 'ESTOMAC\nNon exploré.';
  if(!estomacExamine()) return null;
  const L=[];
  const p=paroiEstomac();
  const CONT={liquidien:'liquidien', alimentaire:'alimentaire', gazeux:'gazeux'};
  const PER={normal:'normal', diminue:'diminué', absent:'absent', augmente:'augmenté'};
  const per=peristaltismeEffectif(e, REF_PERISTALTISME.estomac);

  if(!anomalieEstomac()){
    const jug = !p || p.verdict!=null;
    let s = jug ? 'Examen dans les limites de la normale.' : '';
    if(p) s+=(jug?' Paroi de ':'Paroi de ')+(jug?V(nb(p.v)+' mm'):nb(p.v)+' mm')+
      ' entre les plis (référence '+p.lib+')'+
      (couchesImplicitementNormales(e)?', répartition des couches conservée':'');
    if(paroiEstomacMuette()) s+=(jug?' ':'')+(jug?PHRASE_PAROI_COURTE:PHRASE_PAROI_NORMALE);
    L.push(s+(p?'.':''));
    const cE=partsCouches('estomac', e);
    if(cE){
      const b=[];
      if(cE.muq!=null) b.push('muqueuse '+nb(cE.muq,0)+' %');
      if(cE.mus!=null) b.push('musculeuse '+nb(cE.mus,0)+' %');
      L.push('Répartition des couches : '+V(b.join(' / '))+'.');
    }
  } else {
    if(p) L.push('Paroi mesurée à '+(p.verdict==='haut' ? M(nb(p.v)+' mm',true)
        : (p.verdict==='normal' ? V(nb(p.v)+' mm') : nb(p.v)+' mm'))+
      ' entre les plis (référence '+p.lib+')'+
      (p.verdict ? ' : '+Q(p.verdict==='haut'?'épaissie':'dans les limites de la normale',
        p.verdict==='haut') : '')+
      (couchesImplicitementNormales(e)?', répartition des couches conservée':'')+'.');
    if(e.couche) L.push('Épaississement portant sur '+
      M(({muqueuse:'la muqueuse', sousmuqueuse:'la sous-muqueuse',
          musculeuse:'la musculeuse', toutes:'l’ensemble des couches'})[e.couche],true)+'.');
    const cE=partsCouches('estomac', e);
    if(cE){
      const b=[];
      if(cE.muq!=null) b.push('muqueuse '+nb(cE.muq,0)+' %');
      if(cE.mus!=null) b.push('musculeuse '+nb(cE.mus,0)+' %');
      const E=ecartsCouches(cE);
      const t=b.join(' / ')+(cE.ref?' (normal '+cE.ref.muq+' / '+cE.ref.mus+' %)':'')+
        (E.length?' — '+E.join(', '):'');
      L.push('Répartition des couches : '+(cE.ecart?M(t,true):V(t))+'.');
    }
    // L'anomalie porte sur le contenu ou la motricité : la paroi, elle, est muette.
    if(paroiEstomacMuette()) L.push(PHRASE_PAROI_NORMALE);
    if(horsDefaut(e.strat,'conservee')) L.push('Stratification pariétale '+M('perdue',true)+'.');
  }
  {
    const c=CONTENU_ESTOMAC.filter(o=>e.contenu.has(o.v)).map(o=>CONT[o.v]);
    const liste = c.length>1 ? c.slice(0,-1).join(', ')+' et '+c[c.length-1]
                             : (c[0] || 'vide');
    L.push('Contenu '+liste+
      (e.corpsEtranger?', avec '+M('corps étranger'+(e.ceDesc?' — '+e.ceDesc:''),true):'')+'.');
  }
  const m=[];
  if(per!=null)
    m.push('péristaltisme '+Q(PER[per], per!=='normal')+
      (e.peristaltismeN!=null ? ' ('+contractions(e.peristaltismeN)+', référence '+
        nb(REF_PERISTALTISME.estomac.min,0)+'–'+nb(REF_PERISTALTISME.estomac.max,0)+')' : ''));
  if(e.vidange!=null)
    m.push('vidange '+Q(e.vidange==='normale'?'normale':'retardée', e.vidange!=='normale'));
  if(m.length){
    let s2=m.join(', ');
    s2=s2.replace(/^(<mark[^>]*>)?([a-zà-ÿ])/, function(x,b,c){ return (b||'')+c.toUpperCase(); });
    L.push(s2+'.');
  }
  return 'ESTOMAC\n'+L.join('\n');
}

// ---------- COMPTE-RENDU : INTESTINS ----------
function phraseIntestins(){
  const i=S.intestins;
  if(i.nonVu) return 'INTESTINS\nNon explorés.';
  if(!intestinsExamines()) return null;
  const L=[];

  const COU={muqueuse:'la muqueuse', sousmuqueuse:'la sous-muqueuse',
             musculeuse:'la musculeuse', toutes:'l’ensemble des couches'};
  if(!anomalieIntestins()){
    const d=SEGMENTS.filter(s=>i[s.k].paroi!=null)
      .map(s=>s.l.toLowerCase()+' '+nb(i[s.k].paroi)+' mm');
    const jug=intestinsJugeables();
    L.push((jug?'Examen dans les limites de la normale.':'')+
      (d.length?(jug?' Parois : ':'Parois : ')+(jug?V(d.join(', ')):d.join(', '))+'.':'')+
      (paroisIntestinalesMuettes()
        ? ' '+(jug?PHRASE_PAROIS_COURTE:PHRASE_PAROIS_NORMALES)
        : (SEGMENTS.filter(sg=>segmentSaisi(sg.k))
             .every(sg=>couchesImplicitementNormales(i[sg.k]))
           ? ' Stratification et répartition des couches conservées sur l’ensemble '+
             'des segments explorés.'
           : ' Stratification conservée sur l’ensemble des segments explorés.')));
    // Un segment mesuré sans détail des couches est dit conservé, comme les autres :
    // sinon il disparaîtrait de la ligne dès qu'un voisin est détaillé.
    const prop=SEGMENTS.map(sg=>{
      const c=partsCouches(sg.k);
      if(c){
        const b=[]; if(c.muq!=null) b.push('muqueuse '+nb(c.muq,0)+' %');
        if(c.mus!=null) b.push('musculeuse '+nb(c.mus,0)+' %');
        return sg.l.toLowerCase()+' '+b.join(' / ');
      }
      if(couchesImplicitementNormales(i[sg.k])) return sg.l.toLowerCase()+' conservée';
      return null;
    }).filter(x=>x);
    if(prop.length && !SEGMENTS.filter(sg=>segmentSaisi(sg.k))
         .every(sg=>couchesImplicitementNormales(i[sg.k])))
      L.push('Répartition des couches : '+V(prop.join(' ; '))+'.');
  } else {
    SEGMENTS.forEach(sg=>{
      const seg=i[sg.k], p=mesureSegment(sg.k), c=partsCouches(sg.k);
      const parts=[];
      if(p) parts.push('paroi '+(p.verdict==='haut' ? M(nb(p.v)+' mm',true)
          : (p.verdict==='normal' ? V(nb(p.v)+' mm') : nb(p.v)+' mm'))+
        ' ('+p.lib+')');
      if(horsDefaut(seg.strat,'conservee')) parts.push(M('stratification perdue',true));
      if(seg.couche) parts.push(M('épaississement de '+COU[seg.couche],true));
      if(couchesImplicitementNormales(seg)) parts.push('répartition des couches conservée');
      if(c){
        const b=[];
        if(c.muq!=null) b.push('muqueuse '+nb(c.muq,0)+' %');
        if(c.mus!=null) b.push('musculeuse '+nb(c.mus,0)+' %');
        const E=ecartsCouches(c);
        const t=b.join(' / ')+(c.ref?' (normal '+c.ref.muq+' / '+c.ref.mus+' %)':'')+
          (E.length?' — '+E.join(', '):'');
        parts.push(c.ecart ? M(t,true) : V(t));
      }
      if(!parts.length) return;
      L.push(sg.l+' : '+parts.join(', ')+'.');
    });
    const normaux=SEGMENTS.filter(sg=>!segmentSaisi(sg.k));
    if(paroisIntestinalesMuettes()) L.push(PHRASE_PAROIS_NORMALES);
    else if(normaux.length && normaux.length<SEGMENTS.length)
      L.push('Autres segments sans particularité : '+normaux.map(s=>s.l.toLowerCase()).join(', ')+'.');
  }

  const DIL={absente:'absence de dilatation', grele:'dilatation du grêle', diffuse:'dilatation diffuse'};
  const PER={normal:'normal', diminue:'diminué', absent:'absent', augmente:'augmenté'};
  const CON={normal:'normal', liquidien:'liquidien', gazeux:'gazeux'};
  const perI=peristaltismeEffectif(i, REF_PERISTALTISME.grele);
  const m=[];
  if(i.dilatation!=null) m.push(Q(DIL[i.dilatation], i.dilatation!=='absente'));
  if(perI!=null) m.push('péristaltisme '+Q(PER[perI], perI!=='normal')+
    (i.peristaltismeN!=null ? ' ('+contractions(i.peristaltismeN)+' sur le grêle, '+
      'référence '+nb(REF_PERISTALTISME.grele.min,0)+'–'+nb(REF_PERISTALTISME.grele.max,0)+')' : ''));
  if(i.contenu!=null) m.push('contenu '+Q(CON[i.contenu], i.contenu!=='normal'));
  if(m.length){
    let s2=m.join(', ');
    s2=s2.replace(/^(<mark[^>]*>)?([a-zà-ÿ])/, function(x,b,c){ return (b||'')+c.toUpperCase(); });
    L.push(s2+'.');
  }

  if(i.corpsEtranger) L.push(M('Corps étranger intestinal'+(i.ceDesc?' — '+i.ceDesc:''),true)+'.');
  if(i.invagination){
    const SI={jejunale:'jéjuno-jéjunale', ileocolique:'iléo-colique', autre:''};
    L.push(M('Image en cocarde multicouches compatible avec une invagination'+
      (i.invaginationSiege&&SI[i.invaginationSiege]?' '+SI[i.invaginationSiege]:''),true)+'.');
  }
  if(i.masse){
    const d=[i.masseL,i.masseH].filter(x=>x!=null);
    const seg=SEGMENTS.find(s=>s.k===i.masseSeg);
    let s='Masse pariétale'+(seg?' du '+seg.l.toLowerCase():'');
    if(d.length) s+=' mesurant '+d.map(x=>nb(x,0)).join(' × ')+' mm';
    const q=[];
    if(i.masseEcho) q.push(MOT[i.masseEcho]);
    if(i.masseHomo) q.push(MOT[i.masseHomo]);
    if(i.masseContours) q.push('à contours '+MOT[i.masseContours]);
    if(i.masseVasc) q.push(MOT[i.masseVasc]);
    if(q.length) s+=', '+q.join(', ');
    L.push(M(s,true)+'.');
  }
  return 'INTESTINS\n'+L.join('\n');
}

// ---------- COMPTE-RENDU : NŒUDS ----------
function phraseNL(){
  const n=S.nl;
  if(n.nonVu) return 'NŒUDS LYMPHATIQUES\nNon explorés.';
  if(!nlSaisis()) return null;
  const L=[];
  const anormaux=[], normaux=[];
  // Un nœud = un segment de phrase. Les anormaux passent devant : c'est eux
  // qu'on lit, pas la liste des voisins normaux.
  const decrireNoeud=(k, nd)=>{
    const v=verdictNoeud(k, nd);
    const d=[];
    if(nd.ep!=null) d.push(nb(nd.ep)+' mm d’épaisseur');
    if(nd.lg!=null) d.push(nb(nd.lg)+' mm de longueur');
    let s=d.join(' sur ');
    const q=[];
    if(v && v.ratio!=null && v.arrondi) q.push('rapport longueur/épaisseur à '+nb(v.ratio,1));
    if(horsDefaut(nd.forme,'allongee')) q.push('forme arrondie');
    if(horsDefaut(nd.echo,'normale')) q.push(nd.echo==='anecho'?'quasi anéchogène':'hypoéchogène');
    if(q.length) s += (s?' — ':'')+q.join(', ');
    return s;
  };
  GROUPES_NL.forEach(g=>{
    const o=n[g.k]; if(!o.vu) return;
    const nom=g.l.replace(/ \(.*\)/,'');
    const saisis=noeudsDe(g.k).filter(noeudSaisi);
    // Groupe déclaré visualisé mais sans aucune mesure : on le nomme, sans rien
    // en dire de plus. Le voir n'est pas le mesurer.
    if(!saisis.length){ normaux.push({tete:nom, bouts:[]}); return; }
    const ano=saisis.filter(nd=>anoNoeud(g.k, nd));
    const sains=saisis.filter(nd=>!anoNoeud(g.k, nd));
    const bouts=[];
    ano.forEach(nd=>bouts.push(decrireNoeud(g.k, nd)));
    sains.forEach(nd=>{ const t=decrireNoeud(g.k, nd); if(t) bouts.push(t); });
    // Plusieurs nœuds : on le dit, sinon la liste de mesures paraît contradictoire.
    const tete = saisis.length>1 ? nom+' ('+saisis.length+' nœuds mesurés)' : nom;
    // Le séparateur est décidé à l'assemblage : un groupe normal listé derrière
    // « Sans particularité : » enchaînerait sinon deux deux-points de suite.
    const grp={tete:tete, bouts:bouts};
    if(ano.length) anormaux.push(grp); else normaux.push(grp);
  });
  const rendu=(g, sep)=> g.tete+(g.bouts.length ? sep+g.bouts.join(' ; ') : '');
  anormaux.forEach(g=>L.push(M(rendu(g,' : '),true)+'.'));
  if(normaux.length){
    // Après « sans particularité : » on enchaîne en minuscule ; après un point,
    // la phrase reprend par une majuscule.
    const sep = anormaux.length ? ' — ' : ' : ';
    const liste = normaux.map(g=>{
      const s=rendu(g, sep);
      return anormaux.length ? s.charAt(0).toLowerCase()+s.slice(1) : s;
    }).join(' ; ');
    L.push((anormaux.length?'Sans particularité : ':'Examen dans les limites de la normale. ')+liste+'.');
  }
  return 'NŒUDS LYMPHATIQUES\n'+L.join('\n');
}

// ---------- COMPTE-RENDU : VAISSEAUX ----------
function phraseVasc(){
  const v=S.vasc;
  if(v.nonVu) return 'VAISSEAUX ET PÉRITOINE\nNon explorés.';
  if(!vascExaminee()) return null;
  const L=[];
  const AO={normale:'normale', dilatee:'dilatée', thrombus:'porteuse d’un thrombus'};
  const CA={normale:'normale', distendue:'distendue', collabee:'collabée', thrombus:'porteuse d’un thrombus'};
  const SI={trifurcation:'à la trifurcation', abdominale:'sur le segment abdominal'};
  const g=[];
  if(v.aorte!=null) g.push('aorte '+Q(AO[v.aorte]+
    (v.aorte==='thrombus'&&v.aorteSiege?' '+SI[v.aorteSiege]:''), v.aorte!=='normale'));
  if(v.cave!=null) g.push('veine cave caudale '+Q(CA[v.cave], v.cave!=='normale'));
  if(g.length){
    let s=g.join(', ');
    s=s.replace(/^(<mark[^>]*>)?([a-zà-ÿ])/, function(x,b,c){ return (b||'')+c.toUpperCase(); });
    L.push(s+'.');
  }
  const per=[];
  if(v.epanchement) per.push('épanchement péritonéal'+
    (v.abondance?' '+({minime:'minime',modere:'modéré',abondant:'abondant'})[v.abondance]:''));
  if(v.graisse) per.push('graisse mésentérique hyperéchogène');
  if(v.carcinose) per.push('nodules péritonéaux');
  if(per.length) L.push('Péritoine : '+M(per.join(', '),true)+'.');
  else L.push('Péritoine sans particularité.');
  return 'VAISSEAUX ET PÉRITOINE\n'+L.join('\n');
}

// ---------- SYNTHÈSE ----------
// Ce que l'outil ne peut pas juger faute d'une donnée : la réserve appartient
// à la synthèse, le compte-rendu se contentant de décrire ce qui a été vu.
function syntheseReserves(items, lignes){
  if(!S.intestins.nonVu && intestinsExamines() && !intestinsJugeables()){
    items.push({t:'poids manquant', c:''});
    lignes.push('Poids non renseigné : l’épaisseur du duodénum et du jéjunum n’est pas '+
      'interprétable chez le chien, les bornes dépendant du format.');
  }
  if(!S.pancreas.nonVu && pancreasExamine() && !pancreasJugeable()){
    items.push({t:'âge manquant', c:''});
    lignes.push('Âge non renseigné : l’épaisseur des lobes pancréatiques n’est pas '+
      'interprétable chez le chat, les bornes changeant à 10 ans.');
  }
}

function syntheseDigestive(items, lignes){
  const e=S.estomac, i=S.intestins, n=S.nl, v=S.vasc;

  // --- Estomac ---
  if(!e.nonVu && estomacExamine()){
    const p=paroiEstomac();
    if(e.corpsEtranger){
      items.push({t:'corps étranger gastrique', c:'alerte'});
      lignes.push('Corps étranger gastrique.');
    }
    if(p && p.verdict==='haut'){
      items.push({t:'paroi gastrique épaissie', c:e.strat==='perdue'?'alerte':''});
      lignes.push('Paroi gastrique épaissie'+(e.strat==='perdue'
        ? ' avec perte de stratification : infiltration néoplasique — adénocarcinome, lymphome, mastocytose'
        : ' avec stratification conservée : gastrite')+'.');
    }
    const cE=partsCouches('estomac', e);
    if(e.couche==='musculeuse' || (cE && cE.musHaut)){
      items.push({t:'musculeuse gastrique épaissie', c:''});
      lignes.push('Épaississement de la musculeuse gastrique : gastrite chronique, '+
        'infiltration, ou obstacle pylorique chronique.');
    } else if(e.couche==='muqueuse' || (cE && cE.muqHaut)){
      items.push({t:'muqueuse gastrique épaissie', c:''});
      lignes.push('Épaississement de la muqueuse gastrique : gastrite, '+
        'infiltration inflammatoire ou néoplasique.');
    }
    if(e.vidange==='retardee' && !e.corpsEtranger){
      items.push({t:'vidange gastrique retardée', c:''});
      lignes.push('Vidange gastrique retardée : obstacle pylorique, gastrite, ou trouble '+
        'de la motricité.');
    }
  }

  // --- Intestins ---
  if(!i.nonVu && intestinsExamines()){
    const epaissis=SEGMENTS.filter(s=>{ const p=paroiSegment(s.k); return p && p.verdict==='haut'; });
    const stratPerdue=SEGMENTS.filter(s=>i[s.k].strat==='perdue');
    // Les parts se partagent 100 % : une musculeuse épaissie fait mécaniquement
    // baisser celle de la muqueuse, et réciproquement. On ne retient que la
    // couche qui a grossi, sinon le même fait sortirait deux fois.
    const muscle=SEGMENTS.filter(s=>{ const c=partsCouches(s.k);
      return i[s.k].couche==='musculeuse' || (c && c.musHaut); });
    const muqueuse=SEGMENTS.filter(s=>{ const c=partsCouches(s.k);
      return i[s.k].couche==='muqueuse' || (c && c.muqHaut); });
    const sousmuq=SEGMENTS.filter(s=>i[s.k].couche==='sousmuqueuse');
    // Muqueuse effacée sans musculeuse épaissie : ce n'est pas l'arithmétique,
    // c'est la muqueuse elle-même qui a disparu.
    const muqEffacee=SEGMENTS.filter(s=>{ const c=partsCouches(s.k);
      return c && c.muqBas && !c.musHaut && i[s.k].couche!=='musculeuse'; });
    if(stratPerdue.length){
      items.push({t:'stratification perdue', c:'alerte'});
      lignes.push('Perte de stratification pariétale'+
        (stratPerdue.length<SEGMENTS.length?' ('+stratPerdue.map(s=>s.l.toLowerCase()).join(', ')+')':'')+
        ' : infiltration néoplasique — lymphome, adénocarcinome, mastocytose.');
    } else if(epaissis.length){
      items.push({t:'parois épaissies', c:''});
      lignes.push('Parois épaissies avec stratification conservée'+
        (epaissis.length<SEGMENTS.length?' ('+epaissis.map(s=>s.l.toLowerCase()).join(', ')+')':'')+
        ' : entéropathie inflammatoire.');
    }
    if(muscle.length){
      items.push({t:'musculeuse épaissie', c:''});
      lignes.push('Épaississement de la musculeuse'+
        (muscle.length<SEGMENTS.length?' ('+muscle.map(s=>s.l.toLowerCase()).join(', ')+')':'')+
        (S.espece==='chat'
          ? ' : chez le chat, lymphome à petites cellules et entéropathie chronique en premier lieu'
          : ' : entéropathie chronique')+'.');
    }
    if(muqueuse.length){
      items.push({t:'muqueuse épaissie', c:''});
      lignes.push('Épaississement de la muqueuse'+
        (muqueuse.length<SEGMENTS.length?' ('+muqueuse.map(s=>s.l.toLowerCase()).join(', ')+')':'')+
        ' : infiltration inflammatoire, lymphangiectasie, entéropathie exsudative.');
    }
    if(sousmuq.length){
      items.push({t:'sous-muqueuse épaissie', c:''});
      lignes.push('Épaississement de la sous-muqueuse'+
        (sousmuq.length<SEGMENTS.length?' ('+sousmuq.map(s=>s.l.toLowerCase()).join(', ')+')':'')+
        ' : œdème, lymphangiectasie, hémorragie pariétale.');
    }
    if(muqEffacee.length){
      items.push({t:'muqueuse effacée', c:''});
      lignes.push('Muqueuse réduite'+
        (muqEffacee.length<SEGMENTS.length?' ('+muqEffacee.map(s=>s.l.toLowerCase()).join(', ')+')':'')+
        ' sans épaississement de la musculeuse : atrophie villositaire, '+
        'infiltration de la sous-muqueuse, ou distension de l’anse.');
    }
    if(i.invagination){
      items.push({t:'invagination', c:'alerte'});
      lignes.push('Image en cocarde : invagination. Chez un jeune animal, parasitisme et '+
        'entérite en sont les causes habituelles ; chez l’adulte, une lésion pariétale '+
        'sert souvent de tête d’invagination.');
    }
    const perI=peristaltismeEffectif(i, REF_PERISTALTISME.grele);
    if(i.corpsEtranger || (horsDefaut(i.dilatation,'absente') && perI==='augmente')){
      items.push({t:'obstruction mécanique', c:'alerte'});
      lignes.push('Dilatation d’amont'+(i.corpsEtranger?' avec corps étranger':'')+
        (perI==='augmente'?' et péristaltisme de lutte':'')+
        ' : obstruction mécanique.');
    } else if(i.dilatation==='diffuse' && perI==='absent'){
      items.push({t:'iléus paralytique', c:'alerte'});
      lignes.push('Dilatation diffuse sans obstacle visualisé et péristaltisme aboli : '+
        'iléus paralytique — péritonite, pancréatite, post-opératoire, dysautonomie.');
    }
    if(i.masse){
      items.push({t:'masse pariétale digestive', c:'alerte'});
      lignes.push('Masse pariétale digestive : adénocarcinome, lymphome, '+
        'tumeur stromale ou léiomyosarcome.');
    }
  }

  // --- Nœuds ---
  if(nlSaisis()){
    // Un seul nœud arrondi ou anéchogène dans le lot suffit à alerter : c'est
    // le nœud envahi qu'on cherche, pas la moyenne du groupe.
    const malins=GROUPES_NL.filter(g=>{
      const o=n[g.k]; if(!o.vu) return false;
      return noeudsDe(g.k).some(nd=>{
        const vv=verdictNoeud(g.k, nd);
        return nd.forme==='arrondie' || (vv && vv.arrondi) || nd.echo==='anecho';
      });
    });
    const gros=GROUPES_NL.filter(g=>{
      const o=n[g.k]; if(!o.vu) return false;
      const vv=verdictNL(g.k);
      return vv && vv.verdict==='haut' && malins.indexOf(g)<0;
    });
    if(malins.length){
      items.push({t:'nœuds arrondis', c:'alerte'});
      lignes.push('Nœuds '+malins.map(g=>g.l.replace(/ \(.*\)/,'').toLowerCase()).join(', ')+
        ' arrondis et hypoéchogènes, ayant perdu leur rapport longueur/épaisseur : '+
        'infiltration néoplasique — lymphome, métastase.'+
        (!i.nonVu && intestinsExamines() && SEGMENTS.some(s=>i[s.k].strat==='perdue')
          ? ' Associés à la perte de stratification digestive, le lymphome digestif vient en tête.':''));
    } else if(gros.length){
      items.push({t:'adénomégalie réactionnelle', c:''});
      lignes.push('Nœuds '+gros.map(g=>g.l.replace(/ \(.*\)/,'').toLowerCase()).join(', ')+
        ' augmentés mais de forme conservée : adénomégalie réactionnelle.');
    }
  }

  // --- Vaisseaux et péritoine ---
  if(!v.nonVu && vascExaminee()){
    if(v.aorte==='thrombus'){
      items.push({t:'thrombus aortique', c:'alerte'});
      lignes.push('Thrombus aortique'+(v.aorteSiege==='trifurcation'?' à la trifurcation':'')+
        (S.espece==='chat'
          ? ' : thromboembolie aortique féline, dont la cardiomyopathie est la cause habituelle'
          : ' : état d’hypercoagulabilité à explorer')+'.');
    }
    if(v.cave==='distendue'){
      items.push({t:'veine cave distendue', c:'alerte'});
      lignes.push('Veine cave caudale distendue'+(v.epanchement?' avec épanchement':'')+
        ' : congestion d’amont — insuffisance cardiaque droite, tamponnade, '+
        'obstruction de la veine cave.');
    } else if(v.cave==='collabee'){
      items.push({t:'veine cave collabée', c:''});
      lignes.push('Veine cave caudale collabée : hypovolémie.');
    }
    if(v.epanchement && v.graisse){
      items.push({t:'péritonite', c:'alerte'});
      lignes.push('Épanchement péritonéal avec graisse hyperéchogène : péritonite — '+
        'septique, chimique, ou par rupture d’un organe creux.');
    }
    if(v.carcinose){
      items.push({t:'nodules péritonéaux', c:'alerte'});
      lignes.push('Nodules péritonéaux : carcinose péritonéale'+
        (S.espece==='chat'?', ou péritonite granulomateuse — chez le chat, la PIF est à écarter'
                          :', ou péritonite granulomateuse')+'.');
    }
  }
}

// ===================== PANCRÉAS =====================
// ┌──────────────────────────────────────────────────────────────────────────┐
// │ VALEURS DE RÉFÉRENCE PANCRÉATIQUES — valeurs de Bébou (08/10/2026).      │
// │ Épaisseur par lobe. Chez le chat, les bornes changent avec l'âge, et le  │
// │ lobe gauche est plus épais que le droit — c'est aussi le plus accessible.│
// │ Le corps et le canal du chien sont donnés en valeur unique dans la       │
// │ source : lus comme des bornes hautes.                                    │
// └──────────────────────────────────────────────────────────────────────────┘
const REF_PANCREAS = {
  chien:{
    lobeG:{min:4.8, max:8.2},
    lobeD:{min:6.3, max:9.9},
    corps:{max:6.3},
    canal:{max:0.6}
  },
  chat:{
    // La source donne « < 9 ans » et « > 10 ans » : la bascule est posée à 10.
    lobeG:{paliers:[{jusqua:10, min:3.4, max:9.0}, {jusqua:1e9, min:4.6, max:10.6}]},
    lobeD:{paliers:[{jusqua:10, min:2.8, max:5.9}, {jusqua:1e9, min:3.0, max:5.7}]},
    corps:{max:6.2},
    canal:{paliers:[{jusqua:10, max:1.0}, {jusqua:1e9, max:4.0}]}
  }
};
const LOBES_PANCREAS = [
  {k:'lobeG', l:'Lobe gauche', t:'Grande courbure, vers la rate — le plus accessible chez le chat'},
  {k:'corps', l:'Corps',       t:'Près du pylore et de la veine porte'},
  {k:'lobeD', l:'Lobe droit',  t:'Le long du duodénum descendant — le plus accessible chez le chien'}
];

function pancreasVide(){
  const o={ nonVu:false,
    canalVu:false, canal:null,
    graisse:false, epanchement:false, duodenum:false, douleur:false,
    nodule:false, noduleLobe:null, noduleL:null, noduleH:null,
    noduleEcho:null, noduleContours:null, noduleNb:null,
    kyste:false, mineralisations:false
  };
  LOBES_PANCREAS.forEach(l=>o[l.k]={vu:false, ep:null, echo:'normale', contours:'reguliers'});
  return o;
}
// ============ DÉFAUTS DES PASTILLES ============
// Source unique de vérité : les valeurs par défaut sont LUES dans les fonctions
// xVide(), jamais recopiées. Une pastille à défaut ne peut donc pas diverger
// de l'état initial, et ajouter un champ plus tard le protège sans rien écrire
// ici. Un défaut null ou absent = champ optionnel, dont la désélection reste
// légitime (« non renseigné » est une réponse).
const DEFAUTS = (function(){
  const d={};
  const src={ rein:reinVide, vessie:vessieVide, prostate:prostateVide,
    uterus:uterusVide, ovaire:ovaireVide, testicule:testiculeVide,
    foie:foieVide, vb:vbVide, surrenale:surrenaleVide, rate:rateVide,
    estomac:estomacVide, segment:segmentVide, intestins:intestinsVide,
    vasc:vascVide, pancreas:pancreasVide };
  Object.keys(src).forEach(k=>{ try{ d[k]=src[k](); }catch(e){ d[k]={}; } });
  // Sous-objets répétés : un groupe de nœuds, un lobe pancréatique. Ils ont
  // leurs propres défauts et sont rendus par les mêmes boucles.
  try{ const n=nlVide(); d.nlGroupe = n[GROUPES_NL[0].k] || {}; }catch(e){ d.nlGroupe={}; }
  try{ d.pancreasLobe = d.pancreas[LOBES_PANCREAS[0].k] || {}; }catch(e){ d.pancreasLobe={}; }
  return d;
})();
function defautDe(organe, cle){
  const m=DEFAUTS[organe];
  if(!m) return null;
  const v=m[cle];
  return (typeof v==='string' && v!=='') ? v : null;
}

// Borne d'un lobe ou du canal, selon l'espèce et l'âge.
function bornePancreas(cle){
  if(!S.espece) return null;
  const r=REF_PANCREAS[S.espece][cle];
  if(!r.paliers) return {min:r.min, max:r.max,
    lib:(r.min!=null?nb(r.min)+'–'+nb(r.max):'≤ '+nb(r.max))+' mm'};
  const an=ageEffectif();
  if(an==null) return {min:null, max:null, lib:'renseigner l’âge'};
  const p=r.paliers.find(x=>an<x.jusqua) || r.paliers[r.paliers.length-1];
  // La mention d'âge reste hors de la parenthèse de référence, sinon le
  // compte-rendu imbrique deux niveaux de parenthèses.
  return {min:p.min, max:p.max, age:(an<10?'avant 10 ans':'après 10 ans'),
    lib:(p.min!=null?nb(p.min)+'–'+nb(p.max):'≤ '+nb(p.max))+' mm'};
}
function verdictLobe(k){
  const o=S.pancreas[k];
  if(!o.vu || o.ep==null) return null;
  const b=bornePancreas(k);
  if(!b || b.max==null) return {v:o.ep, b:b, verdict:null};
  // Seul l'épaississement est signalé, comme pour le tube digestif.
  return {v:o.ep, b:b, verdict: o.ep>b.max ? 'haut' : 'normal'};
}
function verdictCanal(){
  const p=S.pancreas;
  if(!p.canalVu || p.canal==null) return null;
  const b=bornePancreas('canal');
  if(!b || b.max==null) return {v:p.canal, b:b, verdict:null};
  return {v:p.canal, b:b, verdict: p.canal>b.max ? 'haut' : 'normal'};
}
function lobeSaisi(k){
  const o=S.pancreas[k];
  return o.vu && (o.ep!=null || horsDefaut(o.echo,'normale') ||
    horsDefaut(o.contours,'reguliers'));
}
function anoLobe(k){
  const o=S.pancreas[k];
  if(!o.vu) return false;
  const v=verdictLobe(k);
  return (v && v.verdict==='haut') || horsDefaut(o.echo,'normale') ||
    horsDefaut(o.contours,'reguliers');
}
// Un lobe mesuré dont la borne n'est pas calculable (chat sans âge) ne peut
// pas être déclaré normal.
function pancreasJugeable(){
  return !LOBES_PANCREAS.some(l=>{ const v=verdictLobe(l.k); return v && v.verdict==null; }) &&
    !(()=>{ const c=verdictCanal(); return c && c.verdict==null; })();
}
function pancreasExamine(){
  const p=S.pancreas;
  if(p.nonVu) return false;
  return LOBES_PANCREAS.some(l=>p[l.k].vu) || p.canalVu ||
    p.graisse || p.epanchement || p.duodenum || p.douleur ||
    p.nodule || p.kyste || p.mineralisations;
}
function anomaliePancreas(){
  const p=S.pancreas;
  if(!pancreasExamine()) return false;
  if(LOBES_PANCREAS.some(l=>anoLobe(l.k))) return true;
  const c=verdictCanal();
  if(c && c.verdict==='haut') return true;
  return p.graisse || p.epanchement || p.duodenum || p.douleur ||
    p.nodule || p.kyste || p.mineralisations;
}

// ---------- RENDU ----------
function rendrePancreas(){
  const p=S.pancreas;
  const box=document.createElement('div'); box.className='rein pancreas';
  const t=document.createElement('div'); t.className='rein-titre';
  t.innerHTML='<span>Pancréas</span>';
  const bnv=document.createElement('button'); bnv.type='button';
  bnv.className='pill mini'+(p.nonVu?' ano':'');
  bnv.setAttribute('aria-pressed', p.nonVu?'true':'false');
  bnv.textContent='Non exploré';
  bnv.addEventListener('click',()=>{ p.nonVu=!p.nonVu; rendre(); });
  t.appendChild(bnv); box.appendChild(t);
  if(p.nonVu) return box;

  const aide=document.createElement('p'); aide.className='aide';
  aide.innerHTML='<em>Un pancréas d’aspect normal n’exclut pas une pancréatite : '+
    'la sensibilité de l’échographie y est médiocre, surtout chez le chat. '+
    'La graisse péri-pancréatique hyperéchogène est souvent le signe le plus précoce.</em>';
  box.appendChild(aide);

  LOBES_PANCREAS.forEach(lo=>{
    const o=p[lo.k];
    const b=bloc(box, lo.l);
    const lv=document.createElement('div'); lv.className='ligne';
    pastilles(lv,[{v:false,l:'Non visualisé'},{v:true,l:'Visualisé',t:lo.t}],
      ()=>o.vu, x=>o.vu=(x===null?false:x), []);
    b.appendChild(lv);
    if(!o.vu){ o.ep=null; return; }
    const v=verdictLobe(lo.k), bo=bornePancreas(lo.k);
    const lp=champ(b,'Épaisseur',()=>o.ep,x=>o.ep=x,'mm','0.1');
    const libL = b2 => b2.lib + (b2.age ? ' · '+b2.age : '');
    if(v && v.verdict) verdictTag(lp, libL(v.b), v.verdict==='haut'?'haut':'normal');
    else if(bo) verdictTag(lp, libL(bo), 'vide');
    [['Échogénicité','echo',[{v:'normale',l:'Normale'},
        {v:'hypo',l:'Hypoéchogène',t:'Œdème : pancréatite aiguë'},
        {v:'hyper',l:'Hyperéchogène',t:'Fibrose : pancréatite chronique'},
        {v:'heterogene',l:'Hétérogène'}],['hypo','hyper','heterogene']],
     ['Contours','contours',[{v:'reguliers',l:'Réguliers'},
        {v:'irreguliers',l:'Irréguliers'},
        {v:'nodulaires',l:'Nodulaires',t:'Remaniement chronique, hyperplasie nodulaire du vieil animal'}],
        ['irreguliers','nodulaires']]
    ].forEach(([nom,cle,opts,ano])=>{
      const l=document.createElement('div'); l.className='ligne';
      l.innerHTML='<span class="nom">'+nom+'</span>';
      pastilles(l,opts,()=>o[cle],x=>o[cle]=x,ano,defautDe('pancreasLobe',cle));
      b.appendChild(l);
    });
  });

  const bc=bloc(box,'Canal pancréatique');
  const lcv=document.createElement('div'); lcv.className='ligne';
  pastilles(lcv,[{v:false,l:'Non visualisé',
      t:'Normal chez le chien ; chez le chat il se voit habituellement'},
    {v:true,l:'Visualisé'}], ()=>p.canalVu, x=>p.canalVu=(x===null?false:x), []);
  bc.appendChild(lcv);
  if(p.canalVu){
    const vc=verdictCanal(), bo=bornePancreas('canal');
    const lc=champ(bc,'Diamètre',()=>p.canal,x=>p.canal=x,'mm','0.1');
    const libC = b2 => b2.lib + (b2.age ? ' · '+b2.age : '');
    if(vc && vc.verdict) verdictTag(lc, libC(vc.b), vc.verdict==='haut'?'haut':'normal');
    else if(bo) verdictTag(lc, libC(bo), 'vide');
  } else p.canal=null;

  const be=bloc(box,'Environnement');
  const le=document.createElement('div'); le.className='ligne';
  interrupteur(le,'Graisse hyperéchogène',()=>p.graisse,x=>p.graisse=x,
    'Stéatite péri-pancréatique : souvent le signe le plus précoce et le plus sensible');
  interrupteur(le,'Épanchement de voisinage',()=>p.epanchement,x=>p.epanchement=x);
  interrupteur(le,'Duodénum au contact remanié',()=>p.duodenum,x=>p.duodenum=x,
    'Paroi plissée, immobile, iléus localisé');
  interrupteur(le,'Douleur sous la sonde',()=>p.douleur,x=>p.douleur=x,
    'Donnée d’examen clinique, mais relevée pendant l’échographie');
  be.appendChild(le);

  const bl=bloc(box,'Lésions');
  const ll=document.createElement('div'); ll.className='ligne';
  interrupteur(ll,'Nodule ou masse',()=>p.nodule,x=>p.nodule=x);
  interrupteur(ll,'Kyste ou pseudokyste',()=>p.kyste,x=>p.kyste=x);
  interrupteur(ll,'Minéralisations',()=>p.mineralisations,x=>p.mineralisations=x,
    'Remaniement chronique');
  bl.appendChild(ll);
  if(p.nodule){
    const sn=sousBloc(bl,'Caractérisation',true);
    const lsi=document.createElement('div'); lsi.className='ligne';
    lsi.innerHTML='<span class="nom">Siège</span>';
    pastilles(lsi, LOBES_PANCREAS.map(l=>({v:l.k,l:l.l})),
      ()=>p.noduleLobe, x=>p.noduleLobe=x, []);
    sn.appendChild(lsi);
    const lnb=document.createElement('div'); lnb.className='ligne';
    lnb.innerHTML='<span class="nom">Nombre</span>';
    pastilles(lnb,[{v:'unique',l:'Unique'},{v:'multiples',l:'Multiples'}],
      ()=>p.noduleNb, x=>p.noduleNb=x, []);
    sn.appendChild(lnb);
    const ld=document.createElement('div'); ld.className='ligne';
    ld.innerHTML='<span class="nom">Dimensions</span>';
    [['noduleL','L'],['noduleH','H']].forEach(([k,lab])=>{
      const inp=document.createElement('input'); inp.type='number'; inp.step='1'; inp.min='0';
      inp.style.width='62px'; inp.placeholder=lab; inp.value=p[k]==null?'':p[k];
      inp.addEventListener('change',()=>{ const x=inp.value===''?null:parseFloat(inp.value);
        p[k]=isNaN(x)?null:x; rendre(); });
      ld.appendChild(inp);
    });
    const u=document.createElement('span'); u.className='unite'; u.textContent='mm'; ld.appendChild(u);
    sn.appendChild(ld);
    [['Échogénicité','noduleEcho',[{v:'anecho',l:'Anéchogène'},{v:'hypo',l:'Hypoéchogène'},
        {v:'iso',l:'Isoéchogène'},{v:'hyper',l:'Hyperéchogène'},{v:'mixte',l:'Mixte'}]],
     ['Contours','noduleContours',[{v:'nets',l:'Nets'},{v:'flous',l:'Flous / infiltrants'}]]
    ].forEach(([nom,cle,opts])=>{
      const l=document.createElement('div'); l.className='ligne';
      l.innerHTML='<span class="nom">'+nom+'</span>';
      pastilles(l,opts,()=>p[cle],x=>p[cle]=x,null,defautDe('pancreas',cle));
      sn.appendChild(l);
    });
  } else { ['noduleLobe','noduleNb','noduleL','noduleH','noduleEcho','noduleContours']
    .forEach(k=>p[k]=null); }

  blocImages(box,'pancreas');
  return box;
}

// ---------- COMPTE-RENDU ----------
function phrasePancreas(){
  const p=S.pancreas;
  if(p.nonVu) return 'PANCRÉAS\nNon exploré.';
  if(!pancreasExamine()) return null;
  const L=[];
  const ECHO={normale:'d’échogénicité normale', hypo:'hypoéchogène',
              hyper:'hyperéchogène', heterogene:'hétérogène'};
  const CONT={reguliers:'réguliers', irreguliers:'irréguliers', nodulaires:'nodulaires'};

  const vus=LOBES_PANCREAS.filter(l=>p[l.k].vu);
  const nonVus=LOBES_PANCREAS.filter(l=>!p[l.k].vu);

  if(!anomaliePancreas()){
    const d=vus.filter(l=>p[l.k].ep!=null)
      .map(l=>l.l.toLowerCase()+' '+nb(p[l.k].ep)+' mm');
    const jug=pancreasJugeable();
    L.push((jug?'Examen dans les limites de la normale.':'')+
      (d.length?(jug?' Épaisseurs : ':'Épaisseurs : ')+(jug?V(d.join(', ')):d.join(', '))+'.':'')+
      (vus.length?' Échogénicité et contours conservés.':''));
  } else {
    vus.forEach(lo=>{
      const o=p[lo.k], v=verdictLobe(lo.k);
      const parts=[];
      if(v) parts.push((v.verdict==='haut' ? M(nb(v.v)+' mm',true)
        : (v.verdict==='normal' ? V(nb(v.v)+' mm') : nb(v.v)+' mm'))+
        ' ('+v.b.lib+')');
      if(horsDefaut(o.echo,'normale')) parts.push(M(ECHO[o.echo],true));
      if(horsDefaut(o.contours,'reguliers')) parts.push('contours '+M(CONT[o.contours],true));
      if(!parts.length) return;
      L.push(lo.l+' : '+parts.join(', ')+'.');
    });
    const sains=vus.filter(l=>!anoLobe(l.k) && p[l.k].ep==null);
    if(sains.length && sains.length<vus.length)
      L.push('Autres lobes sans particularité : '+sains.map(l=>l.l.toLowerCase()).join(', ')+'.');
  }
  if(nonVus.length)
    L.push((nonVus.length===LOBES_PANCREAS.length?'Aucun lobe visualisé.'
      : 'Non visualisés : '+nonVus.map(l=>l.l.toLowerCase()).join(', ')+'.'));

  const vc=verdictCanal();
  if(p.canalVu && vc)
    L.push('Canal pancréatique mesuré à '+
      (vc.verdict==='haut' ? M(nb(vc.v)+' mm',true)
        : (vc.verdict==='normal' ? V(nb(vc.v)+' mm') : nb(vc.v)+' mm'))+
      ' ('+vc.b.lib+')'+
      (vc.verdict ? ' : '+Q(vc.verdict==='haut'?'dilaté':'non dilaté', vc.verdict==='haut') : '')+'.');
  else if(p.canalVu) L.push('Canal pancréatique visualisé, non mesuré.');
  else if(S.espece==='chat' && pancreasExamine()) L.push('Canal pancréatique non visualisé.');

  const env=[];
  if(p.graisse) env.push('graisse péri-pancréatique hyperéchogène');
  if(p.epanchement) env.push('épanchement de voisinage');
  if(p.duodenum) env.push('duodénum au contact remanié');
  if(p.douleur) env.push('douleur à la pression de la sonde');
  if(env.length) L.push('Environnement : '+M(env.join(', '),true)+'.');
  else if(vus.length) L.push('Graisse péri-pancréatique et environnement sans particularité.');

  if(p.nodule){
    const lo=LOBES_PANCREAS.find(l=>l.k===p.noduleLobe);
    const d=[p.noduleL,p.noduleH].filter(x=>x!=null);
    let s=(p.noduleNb==='multiples'?'Nodules':'Nodule')+
      (lo?' du '+lo.l.toLowerCase().replace('lobe ','lobe '):'');
    if(d.length) s+=' mesurant '+d.map(x=>nb(x,0)).join(' × ')+' mm';
    const q=[];
    if(p.noduleEcho) q.push(MOT[p.noduleEcho]);
    if(p.noduleContours) q.push('à contours '+MOT[p.noduleContours]);
    if(q.length) s+=', '+q.join(', ');
    L.push(M(s,true)+'.');
  }
  if(p.kyste) L.push(M('Formation kystique pancréatique',true)+'.');
  if(p.mineralisations) L.push(M('Minéralisations parenchymateuses',true)+'.');

  return 'PANCRÉAS\n'+L.join('\n');
}

// ---------- SYNTHÈSE ----------
function synthesePancreas(items, lignes){
  const p=S.pancreas;
  if(p.nonVu || !pancreasExamine()) return;
  const epais=LOBES_PANCREAS.filter(l=>{ const v=verdictLobe(l.k); return v && v.verdict==='haut'; });
  const hypo=LOBES_PANCREAS.filter(l=>p[l.k].vu && p[l.k].echo==='hypo');
  const hyper=LOBES_PANCREAS.filter(l=>p[l.k].vu && p[l.k].echo==='hyper');
  const remanies=LOBES_PANCREAS.filter(l=>p[l.k].vu &&
    (p[l.k].contours==='irreguliers' || p[l.k].contours==='nodulaires'));
  const vc=verdictCanal();

  // Aiguë : le trio épaississement, hypoéchogénicité, stéatite.
  if((epais.length || hypo.length) && (p.graisse || p.epanchement)){
    items.push({t:'pancréatite aiguë', c:'alerte'});
    lignes.push('Pancréas '+(epais.length?'épaissi':'')+
      (epais.length&&hypo.length?' et ':'')+(hypo.length?'hypoéchogène':'')+
      ', avec '+(p.graisse?'graisse péri-pancréatique hyperéchogène':'épanchement de voisinage')+
      ' : pancréatite aiguë.');
  } else if(epais.length || hypo.length){
    items.push({t:'pancréas épaissi ou hypoéchogène', c:''});
    lignes.push('Pancréas '+(epais.length?'épaissi':'hypoéchogène')+
      ' sans remaniement de la graisse : pancréatite débutante, œdème pancréatique — '+
      'hypoalbuminémie, hypertension portale.');
  } else if(p.graisse){
    items.push({t:'stéatite péri-pancréatique', c:'alerte'});
    lignes.push('Graisse péri-pancréatique hyperéchogène sans anomalie du parenchyme : '+
      'c’est souvent le signe le plus précoce d’une pancréatite.');
  }

  // Chronique : fibrose et remaniement.
  if(hyper.length || remanies.length || p.mineralisations){
    items.push({t:'remaniement pancréatique chronique', c:''});
    lignes.push('Pancréas '+[hyper.length?'hyperéchogène':null,
      remanies.length?'à contours remaniés':null,
      p.mineralisations?'minéralisé':null].filter(x=>x).join(', ')+
      ' : pancréatite chronique, fibrose'+
      (remanies.some(l=>p[l.k].contours==='nodulaires')
        ? ', ou hyperplasie nodulaire chez l’animal âgé':'')+'.');
  }

  if(vc && vc.verdict==='haut'){
    const vieux = ageEffectif()!=null && ageEffectif()>=10;
    items.push({t:'canal pancréatique dilaté', c:'alerte'});
    lignes.push('Canal pancréatique dilaté : obstruction, pancréatite chronique'+
      (S.espece==='chat' && vieux
        ? '. Chez le chat âgé, une dilatation modérée reste fréquente et peut n’avoir aucune '+
          'traduction clinique':'')+'.');
  }

  if(p.nodule){
    items.push({t:'nodule pancréatique', c:'alerte'});
    lignes.push((p.noduleNb==='multiples'?'Nodules pancréatiques':'Nodule pancréatique')+
      ' : hyperplasie nodulaire, adénocarcinome, insulinome'+
      (p.noduleNb==='multiples'?', ou métastases':'')+
      '. L’échographie identifie mal les insulinomes, dont beaucoup échappent à l’examen.');
  }
  if(p.kyste){
    items.push({t:'formation kystique', c:''});
    lignes.push('Formation kystique pancréatique : pseudokyste post-pancréatite, '+
      'kyste de rétention, ou abcès.');
  }
  if(p.duodenum && !p.graisse){
    items.push({t:'duodénum remanié', c:''});
    lignes.push('Duodénum remanié au contact du pancréas : atteinte de voisinage, '+
      'à rapprocher d’une pancréatite même si le parenchyme paraît normal.');
  }

  // Le point qui compte quand tout est normal.
  if(!anomaliePancreas() && LOBES_PANCREAS.some(l=>p[l.k].vu))
    lignes.push('Pancréas d’aspect normal : cela n’exclut pas une pancréatite, '+
      'la sensibilité de l’échographie y étant médiocre'+
      (S.espece==='chat'?', particulièrement chez le chat':'')+'.');
}

];
function enteteVide(){
  const o={logo:LOGO_DEFAUT, horaires:''};
  CHAMPS_CLINIQUE.forEach(c=>o[c.k]=''); return o;
}
// Les premières versions stockaient adresse, ville et tel séparément.
function migrerEntete(o){
  if(o.adresse!==undefined || o.ville!==undefined){
    if(!o.site1) o.site1=[o.adresse,o.ville].filter(x=>x).join(' ');
    if(!o.tel1)  o.tel1=o.tel||'';
    delete o.adresse; delete o.ville; delete o.tel;
  }
  return o;
}
function lireEntete(){
  try{
    const b=localStorage.getItem(CLE_ENTETE);
    if(b) return migrerEntete(Object.assign(enteteVide(), JSON.parse(b)));
  }catch(e){}
  return enteteVide();
}
function ecrireEntete(){
  try{ localStorage.setItem(CLE_ENTETE, JSON.stringify(S.entete)); }catch(e){}
}

}
function libRace(){
  const p=S.patient;
  if(p.race==='__autre' || !p.race) return p.raceLibre||'';
  const l=racesDe().find(r=>r.id===p.race);
  return l ? l.l : (p.raceLibre||'');
}
function patientVide(){
  return {nom:'', race:'', raceLibre:'', naissance:'', proprietaire:'',
          identification:'', dossier:'',
          dateExamen:new Date().toISOString().slice(0,10), motif:''};
}
// L'âge sert à la formule prostatique : le calculer depuis la date de naissance
// évite une double saisie et une incohérence entre les deux champs.
function ageDepuisNaissance(){
  const d=S.patient.naissance;
  if(!d) return null;
  const n=new Date(d+'T00:00:00'), a=new Date();
  if(isNaN(n.getTime()) || n>a) return null;
  return (a-n)/(365.25*24*3600*1000);
}
function ageAffiche(){
  const an=ageDepuisNaissance();
  if(an==null) return S.age!=null ? nb(S.age,0)+' an'+(S.age>1?'s':'') : '';
  if(an<1){ const m=Math.round(an*12); return m+' mois'; }
  const ent=Math.floor(an), m=Math.round((an-ent)*12);
  return ent+' an'+(ent>1?'s':'')+(m&&m<12?' et '+m+' mois':'');
}
// S.age suit la date de naissance dès qu'elle est renseignée.
function majAge(){
  const an=ageDepuisNaissance();
  if(an!=null) S.age=Math.round(an*10)/10;
}

function signatureChamp(el){
  if(!el || !/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) return null;
  const l=el.closest('.ligne, .champ');
  const et=l ? l.querySelector('.nom, label') : null;
  const freres=l ? [...l.querySelectorAll('input,select,textarea')] : [];
  const zone=el.closest('.rein, .panneau, .espece-bar, .sousbloc');
  return {t:el.tagName, ty:el.type||'', nom:et?et.textContent:'', ph:el.placeholder||'',
          i:freres.indexOf(el), z:zone?(zone.id||zone.className):''};
}
function memeChamp(a,b){
  return a&&b && a.t===b.t && a.ty===b.ty && a.nom===b.nom && a.ph===b.ph && a.i===b.i && a.z===b.z;
}
function focusAvant(){
  const el=document.activeElement;
  const sig=signatureChamp(el);
  if(!sig) return null;
  let pos=null;
  try{ pos=[el.selectionStart, el.selectionEnd]; }catch(e){}  // number et date refusent
  return {el, sig, pos};
}
function focusApres(m){
  if(!m || document.contains(m.el)) return;   // le champ a survécu : ne rien forcer
  const cible=[...document.querySelectorAll('input,select,textarea')]
    .find(e=>memeChamp(signatureChamp(e), m.sig));
  if(!cible) return;
  cible.focus();
  if(m.pos) try{ cible.setSelectionRange(m.pos[0], m.pos[1]); }catch(e){}
}
function panneau(id, titre, resume, contenu){
  const d=document.createElement('div'); d.className='panneau';
  const t=document.createElement('div'); t.className='panneau-tete';
  t.setAttribute('role','button'); t.setAttribute('tabindex','0');
  const h=document.createElement('h2'); h.textContent=titre; t.appendChild(h);
  const r=document.createElement('span'); r.className='resume'; r.textContent=resume; t.appendChild(r);
  const c=document.createElement('span'); c.className='chev';
  c.textContent = S.ouvert[id] ? '▾' : '▸'; t.appendChild(c);
  const basculer=()=>{ S.ouvert[id]=!S.ouvert[id]; rendre(); };
  t.addEventListener('click',basculer);
  t.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); basculer(); } });
  d.appendChild(t);
  if(S.ouvert[id]){
    const b=document.createElement('div'); b.className='panneau-corps';
    b.appendChild(contenu()); d.appendChild(b);
  }
  return d;
}
function champDate(parent, label, lire, ecrire){
  const d=document.createElement('div'); d.className='champ';
  const l=document.createElement('label'); l.textContent=label; d.appendChild(l);
  const i=document.createElement('input'); i.type='date'; i.value=lire()||'';
  i.addEventListener('input',()=>{ ecrire(i.value); });   // sans rendu : la frappe continue
  i.addEventListener('change',()=>{ ecrire(i.value); });  // sélecteur, collage, remplissage auto
  i.addEventListener('blur',()=>{ ecrire(i.value); rendre(); });
  d.appendChild(i); parent.appendChild(d); return d;
}
function champTexte(parent, label, lire, ecrire, ph, type){
  const d=document.createElement('div'); d.className='champ';
  const l=document.createElement('label'); l.textContent=label; d.appendChild(l);
  const i=document.createElement('input'); i.type=type||'text';
  i.value=lire()||''; if(ph) i.placeholder=ph;
  // On ne rend pas à chaque frappe : le curseur sauterait. Le rendu suit la sortie du champ.
  i.addEventListener('input',()=>{ ecrire(i.value); });
  i.addEventListener('change',()=>{ ecrire(i.value); rendre(); });
  d.appendChild(i); parent.appendChild(d); return i;
}
